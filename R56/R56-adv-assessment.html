<title>Lessons 5–6 Review | 進階評量（115上技高英文 Choice 版三）</title>
<style>
:root{
  --ink:#1f2430; --muted:#6b7280; --line:#e5e7eb; --bg:#f4f6fb;
  --card:#ffffff; --accent:#3b5bdb; --accent2:#0ca678; --warn:#f59f00;
  --ok:#2b8a3e; --bad:#e03131; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#4a148c,#9c27b0);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.top .wrap{padding-top:14px;padding-bottom:14px}
.top h1{margin:0;font-size:22px;letter-spacing:.5px}
.top .zh{margin:2px 0 10px;font-size:13px;opacity:.9}
.badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:1px 12px;font-size:12px;margin-bottom:6px}
.scorebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.score{background:rgba(255,255,255,.14);border-radius:10px;padding:6px 14px;font-size:14px}
.score b{font-size:20px;color:#ffe066}
.progress{flex:1 1 120px;height:10px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
#pbar{height:100%;width:0%;background:#ffe066;border-radius:999px;transition:width .3s}
.sb-btn{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer}
.sb-btn:hover{background:rgba(255,255,255,.15)}
.secchips{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;border:none;color:#fff;cursor:pointer;font-family:inherit;transition:.15s}
.chip:hover{background:rgba(255,255,255,.26)}
.chip.on{background:rgba(255,255,255,.4);box-shadow:0 0 0 1px rgba(255,255,255,.65) inset}
.chip.ok{background:rgba(46,204,113,.35)}
main.wrap{padding-top:20px;padding-bottom:40px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px;box-shadow:0 1px 4px rgba(16,24,40,.05);overflow:hidden}
.sec-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;background:#fafbff}
.sec-head h2{margin:0;font-size:17px;color:#253073}
.sec-head .sub{margin:0;font-size:12.5px;color:var(--muted)}
.sec-head .sec-score{margin-left:auto;font-size:13px;color:#253073;font-weight:600}
.passage{margin:14px 18px 0;padding:14px 16px;background:#f8f9ff;border:1px solid #dbe1ff;border-radius:10px;font-size:15px}
.passage .ptitle{font-weight:700;color:#3b5bdb;margin-bottom:6px}
.bk{display:inline-block;background:#3b5bdb;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;margin:0 2px;vertical-align:middle}
.sent{transition:background .3s,box-shadow .3s}
.sent.hl{background:#fff3bf;border-radius:6px;box-shadow:0 0 0 3px #ffe066;scroll-margin-top:170px}
.q{padding:16px 18px;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:none}
.card{scroll-margin-top:170px}
.qhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.qno{font-weight:700;color:#3b5bdb}
.qpts{margin-left:auto;font-size:12px;color:var(--muted);background:#eef1ff;border-radius:6px;padding:0 8px}
.qstem{font-size:15.5px;margin:4px 0}
.qstem .hint{color:var(--warn);font-weight:600}
.uhint,.bblank{color:#94a3b8;font-family:monospace;letter-spacing:.5px;font-weight:600}
.bblank{color:#64748b}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;font-size:14.5px;user-select:none;transition:.12s}
.opt:hover{border-color:#aab4f0;background:#f4f6ff}
.opt .ol{display:inline-block;width:22px;color:#6b7280;font-weight:700}
.opt.sel{border-color:var(--accent);background:#e9edff;box-shadow:0 0 0 1px var(--accent) inset}
.opt.correct{border-color:var(--ok);background:#e6f7ec}
.opt.wrong{border-color:var(--bad);background:#fdecec}
.fbox{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fbox .lbl{font-weight:700;color:#6b7280;font-size:13px}
input[type=text],textarea{border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14.5px;font-family:inherit;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,91,219,.12)}
textarea{width:100%;min-height:64px;resize:vertical}
.inline-in{margin:0 4px;vertical-align:middle}
.fbl{display:inline-block;background:#fff3bf;color:#9a7b00;font-weight:700;font-size:11px;border-radius:5px;padding:0 6px;margin:0 2px;vertical-align:middle}
.qctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button.btn{border:none;border-radius:8px;padding:7px 16px;font-size:13.5px;cursor:pointer;font-family:inherit}
.btn-check{background:var(--accent);color:#fff}
.btn-check:hover{background:#2f4bc0}
.btn-ghost{background:#eef1f6;color:#374151}
.btn-ghost:hover{background:#e2e7f0}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:var(--bad);color:#fff}
.qresult{display:none;margin-top:10px;padding:10px 14px;border-radius:9px;font-size:14px}
.qresult.show{display:block}
.qresult.good{background:#e9f9f0;border:1px solid #b7e6c8;color:#1c6b32}
.qresult.bad{background:#fdeeee;border:1px solid #f3c1c1;color:#9c2222}
.qresult.info{background:#eef4ff;border:1px solid #c6d8ff;color:#2f4bc0}
.toggle-ex{margin-top:10px;border:1px solid #aab4f0;background:#eef1ff;color:#3b5bdb;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;padding:5px 14px;transition:.12s}
.toggle-ex:hover{background:#e2e8ff;border-color:#8f9cf0}
.ex{display:none;margin-top:10px}
.ex.show{display:block}
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex-block{border-radius:9px;padding:10px 12px;font-size:13.5px;border:1px solid var(--line)}
.ex-block h4{margin:0 0 4px;font-size:13px;color:#253073}
.ex-block p{margin:0}
.ex.clue{border-left:4px solid var(--warn);background:#fffbf0}
.ex.words{border-left:4px solid var(--accent);background:#f4f6ff}
.ex.grammar{border-left:4px solid var(--accent2);background:#f0fbf6}
.ex.trans{border-left:4px solid #be4bdb;background:#fcf5ff}
@media (max-width:600px){.ex-grid{grid-template-columns:1fr}}
footer.wrap{padding-bottom:30px;color:var(--muted);font-size:12px}
</style>
</head>

<script>
"use strict";
var DATA = {"num": "R56", "en": "Lessons 5–6 Review", "zh": "複習｜第 5～6 課", "sections": [{"id": "s1", "type": "word", "title": "一、文意字彙", "subtitle": "1.～6. 題，填入適當的字彙，以完成該句。7.～8. 題，選出適當的字彙，以完成該句。9.～10. 題，選出與句中畫底線的字意思最接近的答案。（每題 2 分，共 20 分）", "points": 20, "questions": [{"no": 1, "pts": 2, "type": "word", "sent": "Instead of giving up, we should <span class='hint'>e e</span> other possibilities to solve this difficult problem.", "answer": "explore", "accept": ["explore"], "ex": {"clue": "e…e（探索；探尋）", "words": "explore v. 探索；探尋", "grammar": "should + 原形動詞「應該……」；explore other possibilities「探索其他可能性」；instead of + V-ing「與其……，不如……」；to solve 表目的。", "trans": "與其放棄，我們應該探索其他可能性來解決這個棘手的問題。"}, "id": "q1"}, {"no": 2, "pts": 2, "type": "word", "sent": "On <span class='hint'>a e</span>, the products here are fifteen percent cheaper than in most other supermarkets.", "answer": "average", "accept": ["average"], "ex": {"clue": "on a…e（平均）", "words": "average n. 平均；on average 平均而言", "grammar": "on average「平均而言、平均來說」為固定片語；比較級 cheaper than「比……便宜」。", "trans": "平均而言，這裡的商品比大多數其他超市便宜百分之十五。"}, "id": "q2"}, {"no": 3, "pts": 2, "type": "word", "sent": "Timothy will never forget the <span class='hint'>f c</span> experience of diving underwater for the first time.", "answer": "fantastic", "accept": ["fantastic"], "ex": {"clue": "f…c（極好的）", "words": "fantastic adj. 極好的；令人難忘的", "grammar": "the fantastic experience「極棒的經驗」；diving underwater「潛入水中」，為動名詞片語作介系詞 of 的受詞。", "trans": "提摩西永遠不會忘記第一次潛入水下的奇妙經驗。"}, "id": "q3"}, {"no": 4, "pts": 2, "type": "word", "sent": "Experts have <span class='hint'>p n</span> that the recent earthquake was the most powerful to hit the area in decades.", "answer": "proven", "accept": ["proven", "proved"], "ex": {"clue": "have p…n（證明）", "words": "prove v. 證明；powerful adj. 強大的；decade n. 十年", "grammar": "have + 過去分詞構成現在完成式，故用 proven（proved 亦可）；the most powerful to hit…「襲擊……的最強地震」。", "trans": "專家已證實，最近的地震是幾十年來襲擊該地區最強的一次。"}, "id": "q4"}, {"no": 5, "pts": 2, "type": "word", "sent": "In my <span class='hint'>o n</span>, this essay is interesting and well-written, but it could be simpler.", "answer": "opinion", "accept": ["opinion"], "ex": {"clue": "in my o…n（依我之見）", "words": "opinion n. 意見；in my opinion 依我之見", "grammar": "in my opinion「在我看來、依我之見」為固定片語；well-written「寫得很好的」。", "trans": "依我看，這篇文章有趣而且寫得很好，不過它可以再簡單一點。"}, "id": "q5"}, {"no": 6, "pts": 2, "type": "word", "sent": "These donuts come in several <span class='hint'>f s</span>, and strawberry is my favorite.", "answer": "flavors", "accept": ["flavors", "flavours"], "ex": {"clue": "f…s（口味）", "words": "flavor n. 口味；風味", "grammar": "come in several flavors「有好幾種口味」；strawberry 在此指草莓口味。", "trans": "這些甜甜圈有好幾種口味，而草莓是我最喜歡的。"}, "id": "q6"}, {"no": 7, "pts": 2, "type": "choice", "stem": "Mike decided to take his girlfriend somewhere ______ for a candlelit dinner on Valentine's Day.", "options": ["addicted", "anxious", "challenging", "fancy"], "ans": 3, "ex": {"clue": "fancy 高級華麗的", "words": "fancy adj. 高級的；華麗的", "grammar": "somewhere fancy「某個高級的地方」；形容詞 fancy 置於 somewhere 之後；for 表目的。", "trans": "麥可決定帶女朋友去某個高級的地方，享受情人節燭光晚餐。"}, "id": "q7"}, {"no": 8, "pts": 2, "type": "choice", "stem": "One ______ of spending too much time on your phone is the possible harm to your vision.", "options": ["advantage", "disadvantage", "document", "insult"], "ans": 1, "ex": {"clue": "disadvantage 缺點", "words": "disadvantage n. 缺點；不利之處；vision n. 視力", "grammar": "one + 名詞「一項……」；spending too much time on your phone 為動名詞片語，作介系詞 of 的受詞。", "trans": "花太多時間滑手機的一個缺點，就是可能傷害你的視力。"}, "id": "q8"}, {"no": 9, "pts": 2, "type": "choice", "stem": "Due to her rising rent, Lexi has to cut down on her expenses.", "options": ["receive", "hold", "reduce", "increase"], "ans": 2, "ex": {"clue": "cut down on＝減少", "words": "cut down on 削減；reduce v. 減少", "grammar": "cut down on（削減、減少）的意思最接近 reduce；due to「由於」。", "trans": "由於房租上漲，蕾西必須削減她的開銷。"}, "id": "q9"}, {"no": 10, "pts": 2, "type": "choice", "stem": "Daisy suddenly felt dizzy, so I helped her to a nearby chair to sit down and rest.", "options": ["lightheaded", "healthy", "wealthy", "excited"], "ans": 0, "ex": {"clue": "dizzy＝暈眩的", "words": "dizzy adj. 暈眩的；lightheaded adj. 頭暈的", "grammar": "dizzy（暈眩的）的意思最接近 lightheaded（頭暈目眩的）；help sb. (to) V「幫助某人做某事」。", "trans": "黛西突然覺得暈眩，所以我扶她到附近的椅子坐下休息。"}, "id": "q10"}]}, {"id": "s2", "type": "choice", "title": "二、語法測驗", "subtitle": "選出一個最適當的答案。（每題 2 分，共 16 分）", "points": 16, "questions": [{"no": 11, "pts": 2, "stem": "Owen and his friends enjoyed the time ______ they camped in the woods.", "options": ["where", "which", "when", "what"], "ans": 2, "ex": {"clue": "關係副詞 when 修飾時間", "words": "when 關係副詞；camp v. 露營", "grammar": "when 引導形容詞子句，代替時間副詞 during the time，修飾先行詞 the time「在森林裡露營的那段時間」。", "trans": "歐文和朋友們很享受他們在森林裡露營的時光。"}, "id": "q11"}, {"no": 12, "pts": 2, "stem": "I believe in Roland, so ______ his plan is, I will support him.", "options": ["no matter", "no matter what", "however", "why"], "ans": 1, "ex": {"clue": "no matter what 無論什麼", "words": "believe in sb. 信任某人；support v. 支持", "grammar": "no matter what「無論是什麼」，what 在子句中作主詞補語，表「不管他的計畫是什麼」。", "trans": "我信任羅蘭，所以無論他的計畫是什麼，我都會支持他。"}, "id": "q12"}, {"no": 13, "pts": 2, "stem": "______ Mom is busy or not, she makes time every day to spend with us.", "options": ["Whether", "Either", "Which", "What"], "ans": 0, "ex": {"clue": "whether…or not 無論……與否", "words": "whether conj. 是否；無論；make time 騰出時間", "grammar": "whether…or not「無論是否……」引導副詞子句；主句 she makes time… 為主要事件。", "trans": "無論媽媽忙不忙，她每天都會騰出時間陪我們。"}, "id": "q13"}, {"no": 14, "pts": 2, "stem": "______ Julie sees the old man next door, she is reminded of her grandfather.", "options": ["Whenever", "Whatever", "Whichever", "Whoever"], "ans": 0, "ex": {"clue": "Whenever 每當", "words": "whenever conj. 每當；無論何時；be reminded of 想起", "grammar": "Whenever 引導時間副詞子句「每當、無論何時」；be reminded of sb.「想起某人」。", "trans": "每當茱莉看到隔壁的老先生，就會想起她的祖父。"}, "id": "q14"}, {"no": 15, "pts": 2, "stem": "I have turned the oven on. Could you tell me ______ the bread in?", "options": ["when I to put", "when should put", "when should I put", "when to put"], "ans": 3, "ex": {"clue": "間接問句簡化為 wh- + to V", "words": "wh- + to V 名詞片語；oven n. 烤箱", "grammar": "間接問句可簡化為 wh- + to V 名詞片語，作 tell me 的受詞，故為 when to put。", "trans": "我已經把烤箱打開了。你能告訴我什麼時候該把麵包放進去嗎？"}, "id": "q15"}, {"no": 16, "pts": 2, "stem": "This island is an amazing vacation spot. The longer you stay, ______ you will want to leave.", "options": ["the least", "the less", "less", "much less"], "ans": 1, "ex": {"clue": "the + 比較級…, the + 比較級…", "words": "the + 比較級…, the + 比較級… 越……就越……；vacation spot 度假勝地", "grammar": "the + 比較級 + S + V, the + 比較級 + S + V「越……就越……」；離開的意願是比較級，故用 the less。", "trans": "這座島是很棒的度假勝地。你待得越久，就越不想離開。"}, "id": "q16"}, {"no": 17, "pts": 2, "stem": "While walking down the street, Debra passed a shop ______ various hats were on sale.", "options": ["how", "what", "where", "when"], "ans": 2, "ex": {"clue": "關係副詞 where 修飾地方", "words": "where 關係副詞；on sale 特價中", "grammar": "where 引導形容詞子句，代替地方副詞 in the shop，修飾先行詞 a shop「一家各式帽子特賣的商店」。", "trans": "黛布拉沿街走時，經過一家各式帽子特賣的商店。"}, "id": "q17"}, {"no": 18, "pts": 2, "stem": "Shirley cannot imagine herself ______ on stage because she has poor balance.", "options": ["dances", "dance", "danced", "dancing"], "ans": 3, "ex": {"clue": "imagine + O + V-ing", "words": "imagine + O + V-ing 想像……做……；balance n. 平衡感", "grammar": "imagine + O + 現在分詞「想像某人做某事」；站在台上為主動動作，故用 dancing。", "trans": "雪莉無法想像自己站在台上，因為她的平衡感很差。"}, "id": "q18"}]}, {"id": "s3", "type": "cloze", "ptitle": "綜合測驗", "title": "三、綜合測驗", "subtitle": "依短文文意，選出一個最適合該空格的答案。（每題 2 分，共 10 分）", "points": 10, "passages": [{"title": "短文", "text": "A mystery shopper visits a store or restaurant to secretly check the quality of its service. To make sure the staff behave naturally, mystery shoppers __19__ and act like ordinary customers. Mystery shoppers are trained to learn __20__ to observe, such as the cleanliness of the place and the waiting time. __21__, they may make special requests to see how the staff deal with such situations. __22__ carefully they pay attention to the details, __22__ useful feedback they can give. After their visit, mystery shoppers fill out a questionnaire（問卷）to record their __23__ and ratings. Overall, this job helps businesses improve their services and offers people a chance to experience different stores and restaurants.", "questions": [{"no": 19, "pts": 2, "stem": "", "options": ["go into detail", "face the challenges", "keep a low profile", "meet the requirements"], "ans": 2, "ex": {"clue": "低調行事，不被發現", "words": "keep a low profile 低調行事；ordinary adj. 普通的", "grammar": "為了讓員工表現自然，神秘客要 keep a low profile「保持低調」並假裝成一般顧客，故 (C) 正確。", "trans": "為了讓店員表現自然，神秘客會低調行事，假裝成一般顧客。"}, "id": "q19"}, {"no": 20, "pts": 2, "stem": "", "options": ["what", "who", "why", "when"], "ans": 0, "ex": {"clue": "what to V 名詞片語", "words": "wh- + to V 名詞片語；observe v. 觀察", "grammar": "what to observe「該觀察什麼」，為 wh- + to V 名詞片語，作 learn 的受詞；後文列舉項目（清潔度、等候時間）呼應 what。", "trans": "神秘客會被訓練了解該觀察什麼，例如店內的整潔度和等候時間。"}, "id": "q20"}, {"no": 21, "pts": 2, "stem": "", "options": ["As the saying goes", "Over time", "In other words", "In addition"], "ans": 3, "ex": {"clue": "補充附加訊息用 In addition", "words": "in addition 此外；special request 特別要求", "grammar": "前句談訓練觀察，後句補充他們還可能提出特別要求，為附加資訊，故用 In addition「此外」。", "trans": "此外，他們可能提出特別要求，看看員工如何應對這類狀況。"}, "id": "q21"}, {"no": 22, "pts": 2, "stem": "", "options": ["Much … much", "More … more", "The much … the much", "The more … the more"], "ans": 3, "ex": {"clue": "the + 比較級…, the + 比較級…", "words": "the + 比較級…, the + 比較級… 越……就越……；feedback n. 回饋", "grammar": "the + 比較級 + S + V, the + 比較級 + S + V「越……就越……」；此處以 The more carefully…, the more useful feedback… 表示越注意細節，能提供的回饋越有用。", "trans": "他們越仔細注意細節，就能提供越有用的回饋。"}, "id": "q22"}, {"no": 23, "pts": 2, "stem": "", "options": ["attractions", "comments", "diseases", "apologies"], "ans": 1, "ex": {"clue": "在問卷上記錄評論與評分", "words": "comment n. 評論；rating n. 評分", "grammar": "fill out a questionnaire「填寫問卷」；record their comments and ratings「記錄他們的評論與評分」，comments 與 ratings 對等。", "trans": "訪查結束後，神秘客會填寫問卷，記錄他們的評論與評分。"}, "id": "q23"}]}]}, {"id": "s4", "type": "choice", "title": "四、對話", "subtitle": "根據對話選一個最適當的答案。（每題 3 分，共 15 分）", "points": 15, "questions": [{"no": 24, "pts": 3, "stem": "（In the swimming pool）<br>Victoria: This lane feels so long. I can't swim further!<br>Mitchell: You're only three meters from the finish line. ______ Don't give up!<br>Victoria: OK.", "options": ["Let's warm up", "That's good to hear", "I'm stronger than you", "You're almost there"], "ans": 3, "ex": {"clue": "You're almost there. 你快要到了", "words": "finish line 終點線；Don't give up. 別放棄", "grammar": "米契說維多莉亞離終點只剩三公尺，鼓勵她「You're almost there.「你就要到了」再撐一下，別放棄」。", "trans": "（游泳池裡）維多莉亞：這條水道感覺好長，我游不動了！米契：你離終點只剩三公尺了，你快要到了，別放棄！維多莉亞：好。"}, "id": "q24"}, {"no": 25, "pts": 3, "stem": "Ian: Excuse me. Could I have the Wi-Fi password?<br>Receptionist: Sure. ______ Just choose the network and enter the password.<br>Ian: Got it! Thank you.", "options": ["It's on your room card.", "This is the number to call for a taxi.", "There's a switch to turn on the air conditioning.", "The breakfast bar is on the second floor."], "ans": 0, "ex": {"clue": "密碼就在房卡上", "words": "Wi-Fi password Wi-Fi 密碼；room card 房卡", "grammar": "櫃台先告知密碼位置（It's on your room card.「就在你的房卡上」），再教導連線步驟，故 (A) 正確。", "trans": "伊恩：不好意思，可以告訴我 Wi-Fi 密碼嗎？櫃台：當然可以，密碼就在你的房卡上，選擇網路後輸入密碼即可。伊恩：知道了！謝謝。"}, "id": "q25"}, {"no": 26, "pts": 3, "stem": "Hazel: These candies and cookies are really sweet. ______ It's better not to eat too many.<br>Kieran: Is it because they can cause tooth decay?<br>Hazel: Having too much sugar can give you worse health problems, like diabetes.", "options": ["You're making a wise choice.", "That's just the tip of the iceberg.", "They don't taste as good as you expected.", "I'm not surprised at all."], "ans": 1, "ex": {"clue": "蛀牙只是冰山一角", "words": "tip of the iceberg 冰山一角；tooth decay 蛀牙", "grammar": "甜食甜蜜的口感背後藏著更大的健康問題，故 Hazel 說 That's just the tip of the iceberg.「那只是冰山一角」，意謂蛀牙只是眾多問題的開端。", "trans": "海柔：這些糖果餅乾真的很甜，那只是冰山一角，最好別吃太多。奇蘭：是因為它們會造成蛀牙嗎？海柔：吃太多糖會帶來更嚴重的健康問題，例如糖尿病。"}, "id": "q26"}, {"no": 27, "pts": 3, "stem": "Gloria: So, what exactly do you do for a living?<br>Cory: I wait in line for those who don't have time to get tickets or something popular they want.<br>Gloria: Sounds interesting. What does a job like that require?<br>Cory: You definitely need a lot of patience because standing for hours can be boring. ______", "options": ["I guess that's why it's so attractive.", "I often need this service for its convenience.", "I don't think it would be a problem.", "I often need to tell myself to hang in there."], "ans": 3, "ex": {"clue": "I often need to tell myself to hang in there", "words": "patience n. 耐心；hang in there 堅持下去；撐住", "grammar": "柯瑞說這份工作需要耐心、久站很無聊，接著坦言「我常得告訴自己要撐下去」，故 (D) 正確。", "trans": "葛洛莉亞：那你到底是做什麼工作的？柯瑞：我幫那些沒時間排隊的人排隊買票，或買他們想要的熱門商品。葛洛莉亞：聽起來很有趣，這樣的工作需要什麼條件？柯瑞：絕對需要很多耐心，因為站好幾個小時很無聊，我常得告訴自己要撐下去。"}, "id": "q27"}, {"no": 28, "pts": 3, "stem": "Stacy: ______<br>Receptionist: Yes. You can pick them up at the front desk anytime.<br>Stacy: Okay. Thank you.", "options": ["Could I have a wake-up call?", "Could I check out later?", "Do you provide extra towels?", "Do you offer room service?"], "ans": 2, "ex": {"clue": "索取額外的毛巾", "words": "extra towels 額外的毛巾；front desk 櫃台", "grammar": "櫃台回覆「可以，隨時到櫃台領取」，可知史黛西問的是能否索取額外毛巾，故 (C) 正確。", "trans": "史黛西：你們提供額外的毛巾嗎？櫃台：有的，你可以隨時到櫃台領取。史黛西：好的，謝謝。"}, "id": "q28"}]}, {"id": "s5", "type": "cloze", "title": "五、閱讀測驗", "subtitle": "閱讀下列短文，選出最適當的答案。（每題 3 分，共 18 分）", "points": 18, "passages": [{"title": "A", "text": "Here is some information on an online event.<br><br><b>Healthy Eating Workshop（工作坊）</b><br><b>Led by Dietitian Lottie Wu</b><br><br>Want some simple ideas for healthy meals? Join our online workshop and learn practical tips you can use in your daily life.<br><br><b>In this workshop, you will learn:</b><br>• the basics of balanced nutrition<br>• practical tips for choosing healthier ingredients<br>• how to plan simple and balanced meals<br><br><b>Featured Demonstration（示範）:</b><br>The dietitian will show you how to prepare a balanced breakfast, a low-sugar snack, and a quick homemade lunch box that fits a busy schedule.<br><br><b>Date &amp; Time:</b> Friday, November 20, 19:00 – 21:30<br><b>Platform:</b> Zoom (link will be sent after you sign up)<br><b>Special gifts:</b><br>• digital recipe book for healthy meals<br>• 7-day simple meal plan<br><br><b>Registration（報名）Information:</b><br>• Fee: NT$300<br>• Sign up at: www.healthyeating***.com.tw/register", "questions": [{"no": 29, "pts": 3, "stem": "What is the main purpose of this event?", "options": ["To raise people's awareness of food safety.", "To give suggestions about vegetarian diets.", "To show the importance of regular check-ups.", "To help people develop healthy eating habits."], "ans": 3, "ex": {"clue": "活動目的是幫助養成健康飲食習慣", "words": "purpose n. 目的；healthy eating 健康飲食", "grammar": "工作坊主題是學習健康餐點的實用技巧、均衡營養與簡易餐點規劃，故其目的在幫助養成健康飲食習慣。", "trans": "這個活動的主要目的是幫助人們養成健康的飲食習慣。"}, "id": "q29"}, {"no": 30, "pts": 3, "stem": "What CAN'T people learn from this event?", "options": ["Tips on making a healthy diet plan.", "Basic nutrition knowledge.", "Advice on eating out when on a diet.", "Methods of preparing healthy meals."], "ans": 2, "ex": {"clue": "文中未提到在外用餐的建議", "words": "diet plan 飲食計畫；nutrition n. 營養", "grammar": "課程內容包括 balanced nutrition、choosing healthier ingredients、plan simple meals 與 preparing meals，但未提到節食時在外用餐的建議，故 (C)。", "trans": "人們無法從這個活動學到「節食時外出用餐的建議」。"}, "id": "q30"}, {"no": 31, "pts": 3, "stem": "Which of the following is true about the event?", "options": ["It is free of charge.", "People need to sign up for it on the website.", "It is held offline for three hours.", "All those who join it will receive a printed book by Lottie Wu."], "ans": 1, "ex": {"clue": "需至網站報名，且酌收費用", "words": "sign up 報名；fee n. 費用", "grammar": "報名資訊載明 Fee: NT$300 且需至網站 Sign up，並透過 Zoom 線上舉辦，故 (B)「需在網站報名」正確；(A) 非免費、(C) 為線上而非實體、(D) 為數位食譜書而非紙本書。", "trans": "關於這個活動，正確的敘述是「人們需要在網站上報名」。"}, "id": "q31"}]}, {"title": "B", "text": "Have you ever imagined having a job where you can eat sweets every day? In fact, some people are paid to taste chocolate. Large chocolate companies such as Hershey's and Nestlé hire chocolate testers to check the quality of their products. It may sound like a dream job, but the reality can be quite different.<br><br>A chocolate tester checks the flavor, smell, and texture of different kinds of chocolate and gives opinions about them. Their feedback helps companies improve their products and make sure the chocolate meets their quality standards. However, eating chocolate regularly can still be challenging for the body.<br><br>For instance, a chocolate tester in the UK needed to taste many samples of chocolate every week and compared products from different factories. That meant she consumed more sugar and fat than usual. To stay healthy, she had to exercise regularly and pay close attention to her diet. Eventually, she decided to change her career because of health concerns.<br><br>This example shows that even a dream job can have its downsides. A job that seems enjoyable may also bring hidden challenges. No matter how much we like something, our health should always come first.", "questions": [{"no": 32, "pts": 3, "stem": "What is this passage mainly about?", "options": ["A tester's experiences of tasting different kinds of food.", "The sales and development of chocolate products.", "A dream job and the risks behind it.", "Ways to enjoy chocolate healthily."], "ans": 2, "ex": {"clue": "主旨：夢幻工作背後的風險", "words": "dream job 夢幻工作；risk n. 風險", "grammar": "全文以巧克力品嘗師為例，說明夢幻工作也有隱藏挑戰與健康風險，故主旨是「夢幻工作及其背後的風險」。", "trans": "這篇文章主要在談「夢幻工作及其背後隱藏的風險」。"}, "id": "q32"}, {"no": 33, "pts": 3, "stem": "Why did the chocolate tester in the third paragraph quit her job?", "options": ["She got tired of eating chocolate.", "She decided to open her own chocolate store.", "She could not tell the different flavors of chocolate.", "She was worried about her health."], "ans": 3, "ex": {"clue": "她因健康問題而換工作", "words": "quit v. 辭去；離開；health concern 健康隱憂", "grammar": "第三段說 she decided to change her career because of health concerns，故她因擔心健康而辭職。", "trans": "第三段中的巧克力品嘗師為什麼辭職？因為她擔心自己的健康。"}, "id": "q33"}, {"no": 34, "pts": 3, "stem": "What does the author think of jobs like being a chocolate tester?", "options": ["They may look enjoyable but can also cause problems.", "They are suitable for anyone with great passion.", "They should be avoided because they do more harm than good.", "They can have less impact on health with a good exercise plan."], "ans": 0, "ex": {"clue": "作者認為夢幻工作也有隱憂", "words": "enjoyable adj. 令人愉快的；downside n. 缺點", "grammar": "結尾說 a dream job can have its downsides，看似開心的工作也可能帶來隱藏的挑戰，故作者認為此類工作「看似愉快，但也可能造成問題」。", "trans": "作者如何看待巧克力品嘗師這類工作？它們看似愉快，但也可能帶來問題。"}, "id": "q34"}]}]}, {"id": "s6", "type": "fill", "title": "六、填充", "subtitle": "依提示字母填入適當的字彙，以完成句子。（每格 2 分，共 8 分）", "points": 8, "questions": [{"no": 35, "pts": 2, "cn": "Toby非常喜愛烹飪，並經常給我們看他做的料理照片。", "en": "Toby is very ((0)) ((1)) cooking and often shows us pictures of the dishes he makes.", "blanks": [{"label": "(f)(d)", "ans": "fond", "accept": ["fond"]}, {"label": "(o)(f)", "ans": "of", "accept": ["of"]}], "ex": {"clue": "f…d o…f（喜愛）", "words": "be fond of 喜愛；picture n. 照片", "grammar": "be fond of + N/V-ing「喜愛……」；dishes he makes「他做的料理」為省略關係代名詞的形容詞子句。", "trans": "Toby非常喜愛烹飪，並經常給我們看他做的料理照片。"}, "id": "q35"}, {"no": 36, "pts": 2, "cn": "因為工作的關係，Becky經常四處奔波，頻繁到國外出差。", "en": "Because of her job, Becky is often on ((0)) ((1)), going on many business trips abroad.", "blanks": [{"label": "(t)(e)", "ans": "the", "accept": ["the"]}, {"label": "(m)(e)", "ans": "move", "accept": ["move"]}], "ex": {"clue": "on the m…e（四處奔波）", "words": "be on the move 四處奔波；business trip 出差", "grammar": "be on the move「忙個不停、四處奔走」為固定片語；because of + 名詞「因為……」。", "trans": "因為工作的關係，Becky經常四處奔波， var NORM_RE = /[\s\.,，。;；:：!！?？"'“”‘’（）()\[\]【】\-、_]/g;
function norm(s){return (s==null?"":String(s)).toLowerCase().replace(NORM_RE,"");}
function hasAny(user, arr){
  var u = norm(user);
  return arr.some(function(a){ return u === norm(a); });
}

var score = 0, total = 0;
var results = {};   // qid -> {ok:true/false, pts:n}   (fill -> {blanks:[bool]})

function el(tag, cls, html){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html != null) e.innerHTML = html;
  return e;
}

function exBlock(cls, title, text){
  var b = el("div", "ex-block " + cls);
  var h = el("h4", null, title);
  var p = el("p", null, text || "—");
  b.appendChild(h); b.appendChild(p);
  return b;
}

function exPanel(q, openAll){
  var ex = el("div", "ex" + (openAll ? " show" : ""));
  var grid = el("div", "ex-grid");
  grid.appendChild(exBlock("clue", "解題線索", q.ex.clue));
  grid.appendChild(exBlock("words", "重要字詞", q.ex.words));
  grid.appendChild(exBlock("grammar", "文法句型", q.ex.grammar));
  grid.appendChild(exBlock("trans", "中文翻譯", q.ex.trans));
  ex.appendChild(grid);
  var tg = el("button", "toggle-ex", "查看詳解 ▾");
  tg.onclick = function(){ ex.classList.toggle("show"); tg.textContent = ex.classList.contains("show") ? "收合詳解 ▴" : "查看詳解 ▾"; };
  ex.appendChild(tg);
  return ex;
}

function resultBox(){
  var r = el("div", "qresult");
  return r;
}
function showResult(qEl, rbox, ok, msg){
  rbox.className = "qresult show " + (ok ? "good" : "bad");
  rbox.innerHTML = msg;
}

function showInfo(rbox, msg){
  rbox.className = "qresult show info";
  rbox.innerHTML = msg;
}

function speak(text){
  try{
    if(!text) return;
    if(typeof window === "undefined" || !window.speechSynthesis) return;
    var s = window.speechSynthesis;
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = "en-US";
    u.rate = 0.9;
    s.cancel();
    s.speak(u);
    // Chrome/Edge workaround: wake the engine with pause()/resume()
    try{
      if(!s.paused){
        s.pause();
        s.resume();
      }
    }catch(e2){}
  }catch(e){}
}

function fullSentence(q){
  if(q.speakText) return q.speakText;
  if(q.en){
    return q.en.replace(/\(\((\d+)\)\)/g, function(m, n){ return (q.blanks[+n] || {}).ans || ""; });
  }
  if(q.sent){
    var s = String(q.sent).replace(/<span class='hint'>[^<]*<\/span>/g, q.answer || "");
    return s.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  }
  return String(q.stem || "").replace(/_{3,}/g, q.answer || (q.options ? q.options[q.ans] : "") || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
}

function sentenceWithBlank(text, no, ans){
  var t = String(text || "").replace(/<[^>]+>/g, " ");
  var m = t.match(new RegExp("\\S[^.!?]*?__" + no + "__[^.!?]*(?:[.!?]|$)"));
  if(!m) return "";
  var parts = String(ans || "").split("\u2026");
  var i = 0;
  var out = m[0].replace(new RegExp("__" + no + "__", "g"), function(){
    var v = parts.length > 1 ? (parts[i] || "") : (ans || "");
    i++;
    return v.trim();
  });
  return out.replace(/\s+/g, " ").replace(/^[\s.,;:!?]+/, "").trim();
}

function splitSents(text){
  var t = String(text || "");
  var chunks = [];
  var re = /[^.!?]+(?:[.!?]+|$)/g;
  var m;
  while((m = re.exec(t))){
    var c = m[0].trim();
    var bare = c.replace(/<br\s*\/?>/gi, " ").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ");
    if(c && bare.trim()) chunks.push(c);
  }
  if(!chunks.length && t.trim()) chunks.push(t.trim());
  return chunks;
}

function highlightSentence(box, no){
  try{
    var card = box.parentElement || box.parent;
    if(!card) return;
    var target = null;
    [].forEach.call(card.querySelectorAll(".passage"), function(pa){
      if(!target) target = pa.querySelector("span[data-no=" + no + "]");
    });
    if(!target) return;
    [].forEach.call(card.querySelectorAll(".passage .sent"), function(s){ if(s.classList) s.classList.remove("hl"); });
    target.classList.add("hl");
    if(typeof target.scrollIntoView === "function") target.scrollIntoView({behavior:"smooth", block:"center"});
    if(typeof requestAnimationFrame === "function"){
      clearTimeout(target._hlTimer);
      target._hlTimer = setTimeout(function(){ target.classList.remove("hl"); }, 3600);
    }
  }catch(e){}
}

/* ---------- rendering ---------- */
function renderApp(){
  var app = document.getElementById("app");
  DATA.sections.forEach(function(sec){
    var card = el("section", "card");
    card.id = sec.id;
    var head = el("div", "sec-head");
    head.appendChild(el("h2", null, sec.title));
    head.appendChild(el("p", "sub", sec.subtitle));
    var ssc = el("span", "sec-score", "本節得分 <b id='ss-"+sec.id+"'>0</b> / <span>"+sec.points+"</span>");
    head.appendChild(ssc);
    card.appendChild(head);

    if(sec.type === "cloze"){
      sec.passages.forEach(function(pg){
        var pass = el("div", "passage");
        var pt = el("div", "ptitle", (sec.ptitle || "閱讀測驗 ") + pg.title);
        pass.appendChild(pt);
        var text = splitSents(pg.text).map(function(ch){
          var no = (ch.match(/__(\d+)__/) || [])[1];
          return "<span class='sent'" + (no ? " data-no='" + no + "'" : "") + ">" + ch.replace(/__(\d+)__/g, function(m, n){ return "<span class='bk'>（" + n + "）</span>"; }) + "</span>";
        }).join(" ");
        pass.appendChild(el("p", null, text));
        card.appendChild(pass);
        pg.questions.forEach(function(q){
          q.speakText = sentenceWithBlank(pg.text, q.no, q.options[q.ans]);
          card.appendChild(renderQ(sec, q));
        });
      });
    } else {
      sec.questions.forEach(function(q){ card.appendChild(renderQ(sec, q)); });
    }
    app.appendChild(card);
  });
  total = 0;
  DATA.sections.forEach(function(sec){
    total += sec.points;
  });
  document.getElementById("total").textContent = total;
  buildChips();
}

function renderQ(sec, q){
  q.type = q.type || sec.type; q.sec = sec.id; q.secTitle = sec.title;
  var box = el("div", "q");
  box.setAttribute("data-qid", q.id);
  var head = el("div", "qhead");
  head.appendChild(el("span", "qno", q.no + "."));
  var dispPts = q.pts * (q.blanks ? q.blanks.length : 1);
  head.appendChild(el("span", "qpts", dispPts + " 分"));
  box.appendChild(head);

  var body = el("div", "qbody");
  var ctrl = el("div", "qctrl");
  var rbox = resultBox();

  if(q.type === "choice" || q.type === "cloze"){
    body.appendChild(el("p", "qstem", q.stem));
    var opts = el("div", "opts");
    var selected = -1;
    q.options.forEach(function(opt, i){
      var o = el("div", "opt");
      o.innerHTML = "<span class='ol'>" + String.fromCharCode(65+i) + ".</span>" + opt;
      o.onclick = function(){
        if(box.dataset.graded === "1") return;
        Array.prototype.forEach.call(opts.children, function(c){ c.classList.remove("sel"); });
        o.classList.add("sel");
        selected = i;
      };
      opts.appendChild(o);
    });
    body.appendChild(opts);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      if(q.type === "cloze") highlightSentence(box, q.no);
      if(selected < 0){
        showInfo(rbox, "尚未選擇答案。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var ok = (selected === q.ans);
      markResult(box, rbox, q, ok);
      Array.prototype.forEach.call(opts.children, function(c, i){
        c.classList.remove("sel");
        if(i === q.ans) c.classList.add("correct");
        else if(i === selected && !ok) c.classList.add("wrong");
      });
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "vocab"){
    body.appendChild(el("p", "qstem", "請寫出「<b>" + q.answer + "</b>」的英文。"));
    var inp = el("input", "");
    inp.type = "text"; inp.placeholder = "輸入英文單字";
    body.appendChild(inp);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(q.word);
      var v = inp.value.trim();
      if(!v){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，作答後即可計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, [q.word].concat(q.accept_en || []));
      markResult(box, rbox, q, ok, q.word + "（" + q.answer + "）");
      if(ok){ inp.style.borderColor = "#2b8a3e"; } else { inp.style.borderColor = "#e03131"; }
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "word"){
    var sent = String(q.sent).replace(/<span class='hint'>([a-zA-Z]+)\s+([a-zA-Z]+)<\/span>/g, function(m, a, b){
      var missing = Math.max(1, (q.answer || "").length - a.length - b.length);
      return "<span class='hint'>" + a + "</span><span class='uhint'>" + new Array(missing + 1).join("_") + "</span><span class='hint'>" + b + "</span>";
    });
    body.appendChild(el("p", "qstem", sent));
    var inp = el("input", "");
    inp.type = "text"; inp.placeholder = "依提示字母填入單字";
    body.appendChild(inp);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      var v = inp.value.trim();
      if(!v){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，作答後即可計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, q.accept);
      markResult(box, rbox, q, ok);
      if(ok){ inp.style.borderColor = "#2b8a3e"; } else { inp.style.borderColor = "#e03131"; }
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "fill"){
    body.appendChild(el("p", "qstem", "【中文】" + q.cn));
    var sen = el("p", "qstem");
    var html = q.en.replace(/\(\((\d+)\)\)/g, function(m, n){
      var b = q.blanks[+n];
      var letters = [];
      var lm, lre = /\(([^)]+)\)/g;
      while((lm = lre.exec(b.label || ""))) letters.push(lm[1]);
      var fragA = letters[0] || "";
      var fragB = letters.length > 1 ? letters.slice(1).join("") : "";
      var missing = Math.max(1, (b.ans || "").length - fragA.length - fragB.length);
      var shown = fragA + new Array(missing + 1).join("_") + fragB;
      return ' <span class="bblank">' + shown + '</span> ';
    });
    sen.innerHTML = html;
    body.appendChild(sen);
    var abox = el("div", "fbox");
    q.blanks.forEach(function(b, n){
      var span = el("span", "lbl", "(" + (n + 1) + ")");
      var inp = el("input", "inline-in");
      inp.type = "text";
      inp.style.width = Math.min(220, Math.max(90, (b.ans || "").length * 12)) + "px";
      inp.setAttribute("data-blank", n);
      abox.appendChild(span); abox.appendChild(inp);
    });
    body.appendChild(abox);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      var ins = abox.querySelectorAll("input[data-blank]");
      var emptyAll = true;
      ins.forEach(function(ip){ if(String(ip.value || "").trim()) emptyAll = false; });
      if(emptyAll){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var oks = [];
      var all = true, any = false;
      ins.forEach(function(ip){
        var b = q.blanks[+ip.dataset.blank];
        var ok = hasAny(ip.value, b.accept);
        oks.push(ok); any = any || ok; if(!ok) all = false;
        ip.style.borderColor = ok ? "#2b8a3e" : "#e03131";
      });
      var nOk = oks.filter(Boolean).length;
      box.dataset.graded = "1";
      var pts = nOk * q.pts;
      var prev = results[q.id];
      if(prev){ score -= prev.pts; }
      results[q.id] = {ok: nOk === q.blanks.length, pts: pts};
      score += pts;
      updateScore();
      var msg = "答對 " + nOk + " / " + q.blanks.length + " 格，得 " + pts + " 分。";
      showResult(box, rbox, all, msg);
      expandEx(box);
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "sentence"){
    body.appendChild(el("p", "qstem", q.task));
    var ta = el("textarea", "");
    ta.placeholder = "請寫下你的句子";
    body.appendChild(ta);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(q.answer);
      var v = ta.value.trim();
      if(!v){
        showInfo(rbox, "尚未寫下句子。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, q.accept);
      markResult(box, rbox, q, ok);
      if(!ok){
        rbox.innerHTML = "尚未完全符合參考答案。請先參考下方「解題線索／文法句型」，再自行判斷是否答對。";
        var self = el("div", "qctrl");
        var y = el("button", "btn btn-ok", "我寫對了");
        var n = el("button", "btn btn-bad", "我寫錯了");
        y.onclick = function(){ markResult(box, rbox, q, true); self.remove(); };
        n.onclick = function(){ markResult(box, rbox, q, false); self.remove(); };
        self.appendChild(y); self.appendChild(n);
        rbox.appendChild(self);
      }
    };
    ctrl.appendChild(chk);
  }

  box.appendChild(body);
  box.appendChild(ctrl);
  box.appendChild(rbox);
  var ex = exPanel(q, false);
  box.appendChild(ex);
  return box;
}

function markResult(box, rbox, q, ok, ansText){
  box.dataset.graded = "1";
  var prev = results[q.id];
  if(prev){ score -= prev.pts; }
  results[q.id] = {ok: ok, pts: ok ? q.pts : 0};
  score += ok ? q.pts : 0;
  updateScore();
  if(ok){
    showResult(box, rbox, true, "答對了！得 " + q.pts + " 分。");
  } else {
    showResult(box, rbox, false, "答錯了。正確答案：" + (ansText || q.answer));
  }
  var chip = document.getElementById("chip-" + q.sec);
  if(chip){
    chip.textContent = q.secTitle + " " + sectionScore(q.sec) + "/" + sectionPoints(q.sec);
  }
  expandEx(box);
}

function expandEx(box){
  var ex = box.querySelector(".ex");
  var tg = box.querySelector(".toggle-ex");
  if(ex && !ex.classList.contains("show")){ ex.classList.add("show"); }
  if(tg){ tg.textContent = "收合詳解 ▴"; }
}

function sectionPoints(secId){
  var s = DATA.sections.filter(function(x){return x.id===secId;})[0];
  return s ? s.points : 0;
}
function sectionScore(secId){
  var tot = 0;
  Object.keys(results).forEach(function(k){
    var r = results[k];
    var q = questionById(k);
    if(q && q.sec === secId) tot += r.pts;
  });
  return tot;
}
function questionById(qid){
  var found = null;
  DATA.sections.forEach(function(sec){
    var list = [];
    if(sec.type === "cloze"){ sec.passages.forEach(function(p){ list = list.concat(p.questions); }); }
    else { list = sec.questions; }
    list.forEach(function(q){ if(q.id === qid){ found = q; } });
  });
  return found;
}

function updateScore(){
  document.getElementById("score").textContent = score;
  var p = total ? Math.round(score / total * 100) : 0;
  document.getElementById("pbar").style.width = p + "%";
  DATA.sections.forEach(function(sec){
    var s = document.getElementById("ss-" + sec.id);
    if(s) s.textContent = sectionScore(sec.id);
  });
}

function buildChips(){
  var c = document.getElementById("secchips");
  c.innerHTML = "";
  DATA.sections.forEach(function(sec){
    var ch = el("button", "chip", sec.title + " 0/" + sec.points);
    ch.type = "button";
    ch.id = "chip-" + sec.id;
    ch.onclick = function(){
      var el = document.getElementById(sec.id);
      if(el) el.scrollIntoView({behavior: "smooth", block: "start"});
    };
    c.appendChild(ch);
  });
  updateChipActive();
}

function updateChipActive(){
  var mark = null;
  DATA.sections.forEach(function(sec){
    var el = document.getElementById(sec.id);
    var ch = document.getElementById("chip-" + sec.id);
    if(!el || !ch) return;
    var r = el.getBoundingClientRect();
    if(r.top <= 170) mark = ch;
  });
  document.querySelectorAll("#secchips .chip").forEach(function(ch){
    if(ch === mark) ch.classList.add("on");
    else ch.classList.remove("on");
  });
}
if(typeof window !== "undefined"){
  window.addEventListener("scroll", updateChipActive, {passive: true});
}

function revealAll(){
  document.querySelectorAll("#app .q").forEach(function(box){
    var q = questionById(box.dataset.qid);
    if(!q) return;
    var ex = box.querySelector(".ex");
    if(ex) ex.classList.add("show");
    var ins = box.querySelectorAll("input[type=text],textarea");
    if(q.type === "vocab"){
      if(ins[0]) ins[0].value = q.word;
    } else if(q.type === "word"){
      if(ins[0]) ins[0].value = q.answer;
    } else if(q.type === "fill"){
      box.querySelectorAll("input[data-blank]").forEach(function(ip){
        ip.value = q.blanks[+ip.dataset.blank].ans;
      });
    } else if(q.type === "sentence"){
      if(ins[0]) ins[0].value = q.answer;
    } else if(q.type === "choice" || q.type === "cloze"){
      box.querySelectorAll(".opt").forEach(function(o, i){
        if(i === q.ans) o.classList.add("correct");
      });
    }
  });
  var tgs = document.querySelectorAll(".toggle-ex");
  tgs.forEach(function(t){ t.textContent = "收合詳解 ▴"; });
}

function resetAll(){
  score = 0; results = {};
  document.querySelectorAll("#app .q").forEach(function(box){
    box.dataset.graded = "";
    box.querySelectorAll("input[type=text],textarea").forEach(function(i){ i.value=""; i.style.borderColor=""; });
    box.querySelectorAll(".opt").forEach(function(o){ o.className="opt"; });
    var r = box.querySelector(".qresult");
    if(r){ r.className="qresult"; r.innerHTML=""; }
    var ex = box.querySelector(".ex");
    if(ex) ex.classList.remove("show");
  });
  document.querySelectorAll(".toggle-ex").forEach(function(t){ t.textContent = "查看詳解 ▾"; });
  updateScore();
  buildChips();
}

document.getElementById("reset").onclick = resetAll;
document.getElementById("revealAll").onclick = revealAll;
renderApp();
updateScore();
</script>
