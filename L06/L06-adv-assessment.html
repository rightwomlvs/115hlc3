<style>
:root{

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}

.chip:hover{background:rgba(255,255,255,.26)}

main.wrap{padding-top:20px;padding-bottom:40px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px;box-shadow:0 1px 4px rgba(16,24,40,.05);overflow:hidden}

.sec-head h2{margin:0;font-size:17px;color:#253073}

.sec-head .sec-score{margin-left:auto;font-size:13px;color:#253073;font-weight:600}

.bk-link{cursor:pointer;transition:.15s}
.bk-link:hover{background:#0ca678;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.q.jump-hl{animation:jumpflash 1.5s ease}

.q{padding:16px 18px;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:none}
.card{scroll-margin-top:170px}
.qhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.qno{font-weight:700;color:#3b5bdb}
.qpts{margin-left:auto;font-size:12px;color:var(--muted);background:#eef1ff;border-radius:6px;padding:0 8px}

.opt .ol{display:inline-block;width:22px;color:#6b7280;font-weight:700}
.opt.sel{border-color:var(--accent);background:#e9edff;box-shadow:0 0 0 1px var(--accent) inset}
.opt.correct{border-color:var(--ok);background:#e6f7ec}
.opt.wrong{border-color:var(--bad);background:#fdecec}

.fbox .lbl{font-weight:700;color:#6b7280;font-size:13px}

textarea{width:100%;min-height:64px;resize:vertical}
.inline-in{margin:0 4px;vertical-align:middle}
.fbl{display:inline-block;background:#fff3bf;color:#9a7b00;font-weight:700;font-size:11px;border-radius:5px;padding:0 6px;margin:0 2px;vertical-align:middle}
.qctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button.btn{border:none;border-radius:8px;padding:7px 16px;font-size:13.5px;cursor:pointer;font-family:inherit}
.btn-check{background:var(--accent);color:#fff}
.btn-check:hover{background:#2f4bc0}
.btn-ghost{background:#eef1f6;color:#374151}
.btn-ghost:hover{background:#e2e7f0}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:var(--bad);color:#fff}
.qresult{display:none;margin-top:10px;padding:10px 14px;border-radius:9px;font-size:14px}
.qresult.show{display:block}
.qresult.good{background:#e9f9f0;border:1px solid #b7e6c8;color:#1c6b32}
.qresult.bad{background:#fdeeee;border:1px solid #f3c1c1;color:#9c2222}
.qresult.info{background:#eef4ff;border:1px solid #c6d8ff;color:#2f4bc0}
.toggle-ex{margin-top:10px;border:1px solid #aab4f0;background:#eef1ff;color:#3b5bdb;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;padding:5px 14px;transition:.12s}
.toggle-ex:hover{background:#e2e8ff;border-color:#8f9cf0}
.ex{display:none;margin-top:10px}
.ex.show{display:block}
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex-block{border-radius:9px;padding:10px 12px;font-size:13.5px;border:1px solid var(--line)}
.ex-block h4{margin:0 0 4px;font-size:13px;color:#253073}
.ex-block p{margin:0}
.ex-block.ans{grid-column:1/-1;border-left:4px solid #2b8a3e;background:#f0fbf3}
.ex-block.clue{border-left:4px solid var(--warn);background:#fffbf0}
.ex-block.opts{border-left:4px solid #0ca678;background:#f3fbf7}
.ex-block.why{border-left:4px solid #e8590c;background:#fff7f0}
.ex-block.words{border-left:4px solid var(--accent);background:#f4f6ff}
.ex-block.grammar{border-left:4px solid var(--accent2);background:#f0fbf6}
.ex-block.trans{border-left:4px solid #be4bdb;background:#fcf5ff}
@media (max-width:600px){.ex-grid{grid-template-columns:1fr}}
footer.wrap{padding-bottom:30px;color:var(--muted);font-size:12px}
.speech-note{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;max-width:88vw;background:#1f2430;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.35);text-align:center;line-height:1.5}

 classes is a basic <span class='hint'>r t</span> to pass Mr. Bailey's course.", "answer": "requirement", "accept": ["requirement"], "ex": {"clue": "a basic r…t（基本要求）", "words": "requirement n. 要求；必要條件", "grammar": "a basic requirement to V「做……的基本要求」；主詞為動名詞片語 Attending all the classes。", "trans": "出席所有課程是通過貝利老師課程的基本要求。"}, "id": "q5"}, {"no": 6, "pts": 2, "type": "word", "sent": "I think the pancakes at this café are worth trying, but Sandy has a different <span class='hint'>o n</span>.", "answer": "opinion", "accept": ["opinion"], "ex": {"clue": "a different o…n（不同的意見）", "words": "opinion n. 意見；看法；worth trying 值得一試", "grammar": "have a different opinion「有不同的看法」；be worth V-ing「值得做……」。", "trans": "我覺得這家咖啡館的鬆餅值得一試，但桑迪有不同的看法。"}, "id": "q6"}, {"no": 7, "pts": 2, "type": "choice", "stem": "Joanne stays ______ through a balanced diet and regular exercise.", "options": ["challenging", "fancy", "processed", "fit"], "ans": 3, "ex": {"clue": "透過飲食與運動「保持健康」", "words": "fit adj. 健康的；balanced diet 均衡飲食", "grammar": "stay fit「保持健康」；透過 balanced diet（均衡飲食）與 regular exercise（規律運動）。", "trans": "瓊安靠著均衡飲食和規律運動保持健康。", "opts_trans": ["具有挑戰性的", "花俏的", "加工過的", "健康的"], "why": "靠均衡飲食與規律運動能「保持健康」，stay fit 為固定搭配；challenging、fancy、processed 皆無「健康」之意，故選 fit。"}, "id": "q7"}, {"no": 8, "pts": 2, "type": "choice", "stem": "The biggest ______ of this electric scooter is the energy it saves.", "options": ["advantage", "challenge", "flavor", "downside"], "ans": 0, "ex": {"clue": "省電是最大的「優點」", "words": "advantage n. 優點；downside n. 缺點", "grammar": "the biggest advantage「最大的優點」；the energy it saves「它所節省的能量」。", "trans": "這台電動滑板車最大的優點是它省電。", "opts_trans": ["優點", "挑戰", "風味", "缺點"], "why": "省電是電動滑板車的好處，故選 advantage「優點」；challenge、flavor 語意不合，downside「缺點」與句意正好相反。"}, "id": "q8"}, {"no": 9, "pts": 2, "type": "choice", "stem": "The magician's tricks in the show tonight amazed us—they were fantastic!", "options": ["harmful", "expensive", "wonderful", "terrible"], "ans": 2, "ex": {"clue": "fantastic＝wonderful（美妙的）", "words": "fantastic adj. 極好的；wonderful adj. 精彩的；amaze v. 使驚嘆", "grammar": "fantastic「極好的」意思最接近 wonderful「精彩的、美妙的」；harmful 有害的；terrible 可怕的。", "trans": "魔術師今晚在表演中的把戲讓我們驚嘆不已——真是太精采了！", "opts_trans": ["有害的", "昂貴的", "精彩的", "可怕的"], "why": "fantastic「極好的」與 wonderful「精彩的」同義；harmful、expensive、terrible 均無法表達對魔術表演的讚嘆。"}, "id": "q9"}, {"no": 10, "pts": 2, "type": "choice", "stem": "Jennifer once considered becoming a nurse, but she chose a career as a hairdresser instead.", "options": ["thought about", "signed up for", "took care of", "stood for"], "ans": 0, "ex": {"clue": "considered＝thought about（考慮）", "words": "consider v. 考慮；hairdresser n. 美髮師", "grammar": "considered（考慮）意思最接近 thought about（考慮、想到）；sign up for 報名參加；take care of 照顧；stand for 代表。", "trans": "珍妮佛曾經考慮要當護士，但她最後選擇了美髮師這個職業。", "opts_trans": ["考慮（想到）", "報名參加", "照顧", "代表"], "why": "considered「考慮」與 thought about「考慮、想到」同義；signed up for「報名」、took care of「照顧」、stood for「代表」語意皆不符。"}, "id": "q10"}]}, {"id": "s2", "type": "choice", "title": "二、語法測驗", "subtitle": "選出一個最適當的答案。（每題 2 分，共 16 分）", "points": 16, "questions": [{"no": 11, "pts": 2, "stem": "The children did not know ______ to do about the ball that was stuck in the tree.", "options": ["who", "why", "where", "what"], "ans": 3, "ex": {"clue": "不知該對那顆球做「什麼」", "words": "what to do 該做什麼；be stuck in 卡在……", "grammar": "將間接問句 wh- + S + could + V 簡化成名詞片語 wh- + to V；不知可以對那顆球做「什麼」，用疑問詞 what，故為 what to do。", "trans": "孩子們不知道該對那顆卡在樹上的球怎麼辦。", "opts_trans": ["誰", "為什麼", "哪裡", "什麼"], "why": "孩子們不知對卡在樹上的球做「什麼」，疑問詞 what 作 do 的受詞，故為 what to do；who、why、where 皆無法作 do 的受詞。"}, "id": "q11"}, {"no": 12, "pts": 2, "stem": "Richard poured ______ honey into his tea and stirred it.", "options": ["a bit of", "a few of", "a bit", "a few"], "ans": 0, "ex": {"clue": "a bit of 修飾不可數名詞", "words": "pour v. 倒；a bit of 一點；honey n. 蜂蜜", "grammar": "a bit of 為數量詞，修飾不可數名詞 honey（蜂蜜）；(B)(D) 的 a few 修飾可數名詞，不符；a bit 之後需接 of 才能接名詞。", "trans": "理查倒了一點蜂蜜到茶裡，並攪拌了一下。", "opts_trans": ["a bit of（一點，修飾不可數名詞）", "a few of（一些，a few 修飾可數名詞）", "a bit（一點，後須接 of 才能接名詞）", "a few（一些，修飾可數名詞）"], "why": "honey 為不可數名詞，須以 a bit of 修飾；a few (of) 修飾可數名詞、a bit 後須加 of 才能接名詞，故選 a bit of。"}, "id": "q12"}, {"no": 13, "pts": 2, "stem": "Denise wants to go back to the restaurant ______ she had a great lamb chop last month.", "options": ["which", "where", "when", "what"], "ans": 1, "ex": {"clue": "關係副詞 where 引導關係子句", "words": "lamb chop 羊排；go back 回去", "grammar": "關係副詞 where 引導關係子句，補充說明表地方的先行詞 the restaurant，是「她上個月享用美味羊排」的那家餐廳。", "trans": "丹妮絲想回到她上個月吃到美味羊排的那家餐廳。", "opts_trans": ["哪一個", "在那裡（關係副詞）", "何時", "什麼"], "why": "先行詞 the restaurant 表地點，故用關係副詞 where 引導關係子句；which 在此無從擔任子句成分、when 表時間、what 不引導關係子句。"}, "id": "q13"}, {"no": 14, "pts": 2, "stem": "I have a problem with my new task, but I'm not sure who ______.", "options": ["can ask", "is asking", "asks", "to ask"], "ans": 3, "ex": {"clue": "wh- + to V 名詞片語", "words": "be not sure 不確定；task n. 任務", "grammar": "將間接問句 wh- + S + should + V 簡化成名詞片語，結構為 wh- + to V，在此 who to ask「該問誰」。", "trans": "我的新任務出了問題，但我不知道該問誰。", "opts_trans": ["可以問（子句形式）", "正在問（現在分詞）", "問（第三人稱單數）", "該問誰（wh- + to V 名詞片語）"], "why": "be not sure 後接名詞片語，將 who I should ask 簡化為 who to ask；can ask、is asking、asks 皆為子句動詞形式，無法接在 who 之後。"}, "id": "q14"}, {"no": 15, "pts": 2, "stem": "2018 was the year ______ my father was sent to work in Vietnam.", "options": ["where", "when", "why", "which"], "ans": 1, "ex": {"clue": "關係副詞 when 引導關係子句", "words": "be sent to 被派到；Vietnam 越南", "grammar": "關係副詞 when 引導關係子句，補充說明表時間的先行詞 the year，是「我父親被派到越南工作」的那一年。", "trans": "2018 年是我父親被派到越南工作的那一年。", "opts_trans": ["在那裡", "那一年（關係副詞）", "為什麼", "哪一個"], "why": "先行詞 the year 表時間，故用關係副詞 when 引導關係子句；where 表地點、why 表原因、which 在此語法不符，故選 when。"}, "id": "q15"}, {"no": 16, "pts": 2, "stem": "Stanley closed his eyes and imagined himself ______ on a warm beach.", "options": ["lie", "lay", "lying", "to lie"], "ans": 2, "ex": {"clue": "imagine + O + V-ing", "words": "imagine v. 想像；beach n. 海灘", "grammar": "imagine + O + V-ing「想像……做……」；himself「躺在」海灘上為主動動作，故受詞補語用現在分詞 lying。", "trans": "史丹利閉上眼睛，想像自己躺在溫暖的海灘上。", "opts_trans": ["躺（原形）", "lay（lie 的過去式／放置）", "躺著（現在分詞）", "躺（不定詞）"], "why": "imagine + O + V-ing，himself 躺在海灘為主動動作，故受詞補語用現在分詞 lying；lie 為原形、to lie 為不定詞、lay 為過去式或「放置」，皆不合句型。"}, "id": "q16"}, {"no": 17, "pts": 2, "stem": "Hailey looked through all of the dresses in her closet and couldn't decide ______.", "options": ["which one to wear", "which should she wear", "to wear which", "which she to wear"], "ans": 0, "ex": {"clue": "which + N + to + V 名詞片語", "words": "look through 翻遍；closet n. 衣櫃", "grammar": "原為疑問詞 which 後接名詞、帶助動詞的間接問句 S + should + V，簡化為名詞片語 which + N + to + V，即 which one to wear「該穿哪一件」。", "trans": "海莉翻遍了衣櫃裡所有的洋裝，還是無法決定該穿哪一件。", "opts_trans": ["該穿哪一件（which + N + to V）", "which should she wear（疑問句語序）", "to wear which（語序錯誤）", "which she to wear（文法錯誤）"], "why": "間接問句 which one she should wear 簡化為名詞片語 which one to wear，作 decide 的受詞；(B) 保留疑問句語序，(C)(D) 結構錯誤，故選 (A)。"}, "id": "q17"}, {"no": 18, "pts": 2, "stem": "The band is looking for a place ______ they can hold a big outdoor concert.", "options": ["what", "which", "where", "when"], "ans": 2, "ex": {"clue": "關係副詞 where 引導關係子句", "words": "hold a concert 舉辦演唱會；outdoor adj. 戶外的", "grammar": "關係副詞 where 引導關係子句，說明表地方的先行詞 a place，是「樂團可以舉辦戶外演唱會」的地點。", "trans": "樂團正在尋找一個可以舉辦大型戶外演唱會的地方。", "opts_trans": ["什麼", "哪一個", "在那裡（關係副詞）", "何時"], "why": "先行詞 a place 表地點，故用關係副詞 where 引導關係子句；what 不引導關係子句、which 在此語法不符、when 表時間，故選 where。"}, "id": "q18"}]}, {"id": "s3", "type": "cloze", "ptitle": "綜合測驗", "title": "三、綜合測驗", "subtitle": "依短文文意，選出一個最適合該空格的答案。（每題 2 分，共 10 分）", "points": 10, "passages": [{"title": "短文", "text": "Being a video game tester is seen as a dream job. Many people may think that video game testers are paid only to __19__ games to see if they are interesting. __20__, this job is not as fun as it seems. First, game testers must play the same level repeatedly to find any problems and tell the developers __21__ improve the game. To ensure there are no errors in the final product, game testers spend most of the time __22__ bugs instead of playing for fun. In addition, game testers often work under time pressure because of __23__. Game testing takes more hard work than people expect. After all, these testers are not simply hired to enjoy the games.", "questions": [{"no": 19, "pts": 2, "stem": "", "options": ["cut down", "cope with", "run into", "try out"], "ans": 3, "ex": {"clue": "試玩遊戲看看是否有趣", "words": "try out 試用；video game tester 電玩測試員", "grammar": "try out games「試玩遊戲」；be paid only to V「受雇只是為了做……」。", "trans": "許多人可能以為，電玩測試員受雇只是為了試玩遊戲，看看它們是否有趣。"}, "id": "q19"}, {"no": 20, "pts": 2, "stem": "", "options": ["Similarly", "In fact", "Therefore", "What's more"], "ans": 1, "ex": {"clue": "點出與普遍認知相反的實際情況", "words": "in fact 實際上；as fun as it seems 如表面上看起來那麼有趣", "grammar": "後句點出事實、表達與前句普遍認知相反的情況，故用轉折詞 in fact「實際上」。", "trans": "實際上，這份工作並不像表面上看起來那麼有趣。"}, "id": "q20"}, {"no": 21, "pts": 2, "stem": "", "options": ["how to", "how can they", "how they to", "how can"], "ans": 0, "ex": {"clue": "how + to + V 名詞片語", "words": "improve v. 改善；developers n. 開發者", "grammar": "原為疑問詞 how 引導、帶助動詞的間接問句 S + can + V，表示「可以如何改善」；簡化為名詞片語後結構為 how + to + V。", "trans": "遊戲測試員必須一再玩同一個關卡，找出問題並告訴開發者如何改善遊戲。"}, "id": "q21"}, {"no": 22, "pts": 2, "stem": "", "options": ["found", "to find", "finding", "find"], "ans": 2, "ex": {"clue": "spend + 時間 + V-ing", "words": "bug n. 漏洞；error n. 錯誤", "grammar": "表花費的動詞 spend + 時間 + on N / V-ing，故空格填現在分詞 finding。", "trans": "為了確保最終成品沒有錯誤，電玩測試員大部分時間都在尋找漏洞，而不是為了好玩而玩遊戲。"}, "id": "q22"}, {"no": 23, "pts": 2, "stem": "", "options": ["tight deadlines", "fair comments", "personal service", "essential knowledge"], "ans": 0, "ex": {"clue": "因期限緊迫而承受時間壓力", "words": "tight deadline 緊迫的期限；time pressure 時間壓力", "grammar": "because of + N「因為……」；tight deadlines「緊迫的期限」與 under time pressure 語意一致。", "trans": "此外，電玩測試員常因為期限緊迫而承受時間壓力。"}, "id": "q23"}]}]}, {"id": "s4", "type": "choice", "title": "四、對話", "subtitle": "根據對話選一個最適當的答案。（每題 3 分，共 15 分）", "points": 15, "questions": [{"no": 24, "pts": 3, "stem": "Receptionist: Let me check your reservation. You've booked a room for two nights. Is that correct?<br>Josie: Yes, that's correct.<br>Receptionist: OK. Here is your room card. ______", "options": ["Enjoy your stay.", "Sorry for the inconvenience.", "Good to hear that.", "No worries."], "ans": 0, "ex": {"clue": "遞上房卡時的禮貌用語", "words": "reservation n. 訂房；room card 房卡", "grammar": "櫃檯人員給房卡時，用 Enjoy your stay.「祝您住宿愉快」表達祝福與歡迎。", "trans": "櫃檯人員：讓我確認一下您的訂房紀錄。您訂了兩晚的房間，對嗎？喬希：是的。櫃檯人員：好的，這是您的房卡，祝您住宿愉快。", "opts_trans": ["祝您住宿愉快", "造成不便，敬請見諒", "很高興聽到你這麼說", "別擔心"], "why": "櫃檯人員遞上房卡時表達祝福，故用接待用語 Enjoy your stay.「祝您住宿愉快」；其餘選項皆非遞房卡時的祝福語。"}, "id": "q24"}, {"no": 25, "pts": 3, "stem": "Rodney: I heard that you apologize to people for others for a living. That sounds like an easy job.<br>Kristen: Not really. ______<br>Rodney: Why is that?<br>Kristen: I have to face angry people and say sorry again and again. It can be very stressful.", "options": ["It's not the worst job I've got.", "It's like being on vacation all the time.", "I don't mind dealing with them.", "It's not as simple as people think."], "ans": 3, "ex": {"clue": "其實沒有表面上看起來那麼簡單", "words": "apologize v. 道歉；stressful adj. 有壓力的", "grammar": "克莉絲汀接著說要面對生氣的人、一再道歉，可知她想表達這份工作「不如人們想的那樣簡單」，故選 It's not as simple as people think.。", "trans": "羅德尼：我聽說你以代替別人向人道歉為業，聽起來很輕鬆。克莉絲汀：其實不然，這份工作並不如人們想的那樣簡單。", "opts_trans": ["這不是我做過最糟的工作", "就像一直度假一樣", "我不介意應付他們", "這份工作並不如人們想的那樣簡單"], "why": "Kristen 接著說要面對生氣的人並一再道歉，可見工作不輕鬆，故選 It's not as simple as people think.；其餘選項皆無法銜接她對工作的抱怨。"}, "id": "q25"}, {"no": 26, "pts": 3, "stem": "Receptionist: Good evening, Sir. What can I do for you?<br>Theo: This is Room 706. ______ Could you send someone to check it?<br>Receptionist: Sure. Just a moment, please.", "options": ["I forgot to bring my toiletries.", "I'd like a wake-up call, please.", "There's a problem with my shower.", "There's a double room available tonight."], "ans": 2, "ex": {"clue": "浴室有問題，請人來檢查", "words": "shower n. 淋浴設備；check v. 檢查", "grammar": "西奧報出房號後請求派人來檢查，故用 There's a problem with my shower.「我的淋浴設備有問題」。", "trans": "櫃檯人員：先生晚安，有什麼可以為您服務？西奧：這裡是 706 房。我的淋浴設備有問題，可以請人來檢查一下嗎？櫃檯人員：好的，請稍等。", "opts_trans": ["我忘了帶盥洗用品", "我想要晨喚服務", "我的淋浴設備有問題", "今晚有雙人房"], "why": "Theo 報出房號後請求派人檢查，故應說明設備故障，選 There's a problem with my shower.；其餘選項與「派人來檢查」的要求無關。"}, "id": "q26"}, {"no": 27, "pts": 3, "stem": "Tori: Excuse me. ______<br>Receptionist: Yes. We have a spa on the fifth floor. We also offer free laundry service on the top floor.<br>Tori: That's great. I just need to wash a blouse. Thanks a lot.", "options": ["Could I have room service?", "Do you have any facilities here?", "Could you book a pick-up service for me?", "Are there any parking spaces here?"], "ans": 1, "ex": {"clue": "詢問飯店有哪些設施", "words": "facility n. 設施；laundry service 洗衣服務", "grammar": "櫃檯人員回應提到 spa 與免費洗衣服務，可知托莉在問設施，故選 Do you have any facilities here?「你們這裡有什麼設施嗎？」", "trans": "托莉：不好意思，你們這裡有什麼設施嗎？櫃檯人員：有的，我們五樓有水療中心，頂樓還提供免費洗衣服務。托莉：太好了，我正好需要洗一件上衣，非常感謝。", "opts_trans": ["我可以叫客房服務嗎？", "你們這裡有什麼設施嗎？", "可以幫我訂接駁服務嗎？", "你們有停車位嗎？"], "why": "櫃檯人員回應提到 spa 與免費洗衣服務，可見 Tori 在詢問飯店設施，故選 Do you have any facilities here?；其餘選項與 spa、洗衣的回應內容不符。"}, "id": "q27"}, {"no": 28, "pts": 3, "stem": "Interviewer: You are applying for the job of a food stylist. What makes you suitable for this job?<br>Percy: I took courses in photography（攝影）in college and worked as a cook in a restaurant. So ______.<br>Interviewer: I'm impressed. Can you take a test to prove your abilities?", "options": ["I can design various menus for clients", "I'm good at making food look attractive", "I often talk about food on social media", "I had lots of fine dining experiences"], "ans": 1, "ex": {"clue": "攝影課與廚師經驗＝擅長讓食物好看", "words": "food stylist 食物造型師；photography n. 攝影", "grammar": "柏西學過攝影、當過廚師，總結為 I'm good at making food look attractive.「我擅長讓食物看起來吸引人」，正符合食物造型師的工作。", "trans": "面試官：你應徵的是食物造型師的工作，你覺得自己為何適合？柏西：我大學修過攝影課程，也在餐廳當過廚師，所以我擅長讓食物看起來吸引人。", "opts_trans": ["我可以為客戶設計各種菜單", "我擅長讓食物看起來吸引人", "我常在社群媒體上聊食物", "我有許多精緻餐飲的用餐經驗"], "why": "柏西的攝影課與廚師經歷支持「擅長讓食物看起來吸引人」，正符合食物造型師的工作，故選 (B)；其餘選項未呼應攝影與下廚的資歷。"}, "id": "q28"}]}, {"id": "s5", "type": "cloze", "title": "五、閱讀測驗", "subtitle": "閱讀下列短文，選出最適當的答案。（每題 3 分，共 18 分）", "points": 18, "passages": [{"title": "A", "text": "<b>Now Hiring! Ride Tester at Sunshine Wonderland</b><br>We're offering you a chance to enjoy every ride for free.<br><br><b>You'll need to review …</b><br>● rides and attractions<br>● staff service<br>● food and drinks<br><br><b>We'll provide …</b><br>● free transportation（交通）<br>● a week-long free stay at an onsite hotel（園區內飯店）<br>● $1,000 of spending money to experience the park<br><br><b>How to Apply</b><br>You need to be …<br>✓ ready and willing to go on all the rides<br>✓ a physically fit adult<br>✓ willing to work with us for a full week<br><br>Please send the following to sunshine**@*mail.com:<br>✓ your contact information<br>✓ a three-minute self-introduction video", "questions": [{"no": 29, "pts": 3, "stem": "According to the advertisement, what is the main purpose of this job?", "options": ["To try out rides and services.", "To design fun rides for an amusement park.", "To keep a place clean.", "To provide services to visitors."], "ans": 0, "ex": {"clue": "Ride Tester 試乘設施與服務", "words": "ride n.（遊樂園）設施；tester n. 測試員", "grammar": "廣告徵的是 Ride Tester，需 review rides and attractions、staff service 與 food and drinks，故主要目的為 (A) 試乘設施並體驗服務。", "trans": "根據廣告，這份工作的主要目的是試乘遊樂設施並體驗各項服務。"}, "id": "q29"}, {"no": 30, "pts": 3, "stem": "Which of the following is NOT true about the job?", "options": ["Sunshine Wonderland has its own hotel.", "Applicants（應徵者）need to send a self-introduction video.", "Sunshine Wonderland is looking for a full-time worker.", "A hired ride tester can spend $1,000 in the park."], "ans": 2, "ex": {"clue": "只需願意工作「整整一週」而非全職", "words": "full-time 全職的；self-introduction video 自我介紹影片", "grammar": "廣告要求 willing to work with us for a full week「願意與我們一起工作整整一週」，並非全職（full-time），故 (C) 不正確。", "trans": "樂園徵的是願意工作整整一週的人，而非全職員工，故 (C) 錯誤。"}, "id": "q30"}, {"no": 31, "pts": 3, "stem": "Who is most likely to apply for the job?", "options": ["A man who prefers working in an office.", "A woman who can spare a week.", "A senior high school student.", "A woman with heart disease."], "ans": 1, "ex": {"clue": "需身體健康且能抽出一週", "words": "physically fit 體能良好的；spare v. 騰出", "grammar": "廣告要求 a physically fit adult 且 willing to work with us for a full week，故 (B)「能抽出一週的女性」最可能應徵。", "trans": "這份工作適合能抽出一週時間、體能良好的成年人，故 (B) 最有可能應徵。"}, "id": "q31"}]}, {"title": "B", "text": "With high pay, breathtaking ocean views, and a unique lifestyle, being an island caretaker is often called \"the best job in the world.\" However, behind the beautiful photos, the reality is far more demanding.<br><br>Island caretakers are busy. For instance, on Handa Island in Scotland, caretakers must manage a habitat for tens of thousands of seabirds while keeping the island clean. During the high season, the island may receive up to 7,000 visitors. Meanwhile, on Australia's Hamilton Island, caretakers must go snorkeling（浮潛）and feed fish, but they aren't just playing; they must create high-quality blogs and videos to attract visitors.<br><br>In addition, life on an island can be inconvenient. Although free housing is usually provided, it is far from a city and there are limited supplies and services. Caretakers may also have little contact with other people and spend long periods alone on the island. Because of this isolation, some caretakers may feel bored or lonely after work.<br><br>Taking care of an island requires physical and mental strength. The beautiful views may attract people at first, but only those who enjoy nature and can handle the responsibilities will truly love the job.", "questions": [{"no": 32, "pts": 3, "stem": "What is the main idea of this passage?", "options": ["Handa Island and Hamilton Island are good places for a vacation.", "Taking care of an island is the best job in the world.", "Living on an island has many advantages.", "There are challenges in being an island caretaker."], "ans": 3, "ex": {"clue": "全文談島嶼管理員的種種挑戰", "words": "caretaker n. 管理員；challenge n. 挑戰；demanding adj. 耗費精力的", "grammar": "文章先說島嶼管理員看似「全世界最好的工作」，接著說明工作忙碌、孤獨、生活不便等現實挑戰，故主旨為 (D)。", "trans": "本文的主旨在於說明擔任島嶼管理員所面臨的種種挑戰。"}, "id": "q32"}, {"no": 33, "pts": 3, "stem": "Which of the following is true according to the passage?", "options": ["Island caretakers may feel bored because they have a lot of free time.", "Island caretakers have to pay for their housing on the island.", "The views are one of the main reasons people want to become island caretakers.", "Taking care of animals on the island is not the job of an island caretaker."], "ans": 2, "ex": {"clue": "美景吸引人申請這份工作", "words": "view n. 景色；provide v. 提供", "grammar": "文中提到 With high pay, breathtaking ocean views… 與 The beautiful views may attract people at first，故 (C) 正確；(B) 錯，住宿通常是免費提供的。", "trans": "景色是許多人想擔任島嶼管理員的主要原因之一，故 (C) 正確。"}, "id": "q33"}, {"no": 34, "pts": 3, "stem": "What does the word \"isolation\" mean in the third paragraph?", "options": ["The ability to interact with others.", "The lack of supplies.", "The state of being very tired.", "The condition of being alone."], "ans": 3, "ex": {"clue": "isolation＝孤獨、獨處", "words": "isolation n. 孤獨；alone adv. 獨自", "grammar": "第三段提到管理員鮮少與人接觸、長時間獨自一人，故 isolation「孤獨、獨處」意思最接近 the condition of being alone。", "trans": "第三段中的 isolation（孤獨）指的是獨自一人的狀態。"}, "id": "q34"}]}]}, {"id": "s6", "type": "fill", "title": "六、填充", "subtitle": "依提示字母填入適當的字彙，以完成句子。（每格 2 分，共 8 分）", "points": 8, "questions": [{"no": 35, "pts": 2, "cn": "這位詩人保持低調，大多數人一直不知道他的真實身分。", "en": "The poet ((0)) a low ((1)), and his real identity remains unknown to most people.", "blanks": [{"label": "(k)(s)", "ans": "keeps", "accept": ["keeps", "keep"]}, {"label": "(p)(e)", "ans": "profile", "accept": ["profile"]}], "ex": {"clue": "k…s a low p…e（保持低調）", "words": "keep a low profile 保持低調；identity n. 身分", "grammar": "keep a low profile「保持低調」為固定片語；主詞 The poet 為第三人稱單數，故動詞用 keeps。", "trans": "這位詩人保持低調，大多數人一直不知道他的真實身分。"}, "id": "q35"}, {"no": 36, "pts": 2, "cn": "導覽員詳細說明了牛奶如何加工才能安全飲用。", "en": "The tour guide went ((0)) ((1)) about how milk is processed to make it safe to drink.", "blanks": [{"label": "(i)(o)", "ans": "into", "accept": ["into"]}, {"label": "(d)(l)", "ans": "detail", "accept": ["detail"]}], "ex": {"clue": "went i…o d…l（詳細說明）", "words": "go into detail 詳細說明；process v. 加工", "grammar": "go into detail (about)「詳細說明……」，為固定搭配。", "trans": "導覽員詳細說明了牛奶如何加工才能安全飲用。"}, "id": "q36"}]}, {"id": "s7", "type": "sentence", "title": "七、句型練習", "subtitle": "將所給的字詞重組成完整句子，或依提示合併／改寫句子。（第 37.～39. 題每題 3 分，第 40. 題 4 分，共 13 分）", "points": 13, "questions": [{"no": 37, "pts": 3, "task": "when / at the gate / just told me / to meet her / Tracy（句子重組）", "answer": "Tracy just told me when to meet her at the gate.", "accept": ["Tracy just told me when to meet her at the gate", "tracy just told me when to meet her at the gate"], "ex": {"clue": "when + to V 名詞片語作直接受詞", "words": "tell sb. to V 告訴某人做某事；at the gate 在大門口", "grammar": "just told me when to meet her「剛才告訴我何時與她碰面」；when to meet her 為 when + to V 名詞片語，作 told 的直接受詞。", "trans": "崔西剛才告訴我何時在大門口與她碰面。"}, "id": "q37"}, {"no": 38, "pts": 3, "task": "Allen is thinking about where he can hang his new clock.（以 wh- + to V 名詞片語改寫）", "answer": "Allen is thinking about where to hang his new clock.", "accept": ["Allen is thinking about where to hang his new clock", "allen is thinking about where to hang his new clock"], "ex": {"clue": "where + to V 名詞片語", "words": "hang v. 掛；clock n. 時鐘", "grammar": "將間接問句 where he can hang his new clock 簡化為名詞片語 where to hang his new clock，作介詞 about 的受詞。", "trans": "艾倫正在思考要把他的新時鐘掛在哪裡。"}, "id": "q38"}, {"no": 39, "pts": 3, "task": "Do you remember the day?<br>A typhoon forced the school to close on that day.（以關係副詞合併）", "answer": "Do you remember the day when a typhoon forced the school to close?", "accept": ["Do you remember the day when a typhoon forced the school to close", "do you remember the day when a typhoon forced the school to close"], "ex": {"clue": "關係副詞 when 合併兩句", "words": "typhoon n. 颱風；force sb. to V 迫使某人做某事", "grammar": "以關係副詞 when 連接兩句，on that day 改為 when，合併為 the day when a typhoon forced the school to close。", "trans": "你記得學校因為颱風而停課的那一天嗎？"}, "id": "q39"}, {"no": 40, "pts": 4, "task": "這是一個許多遊客在冬季泡溫泉（take a hot spring bath）的觀光勝地。（關係副詞）（中譯英）", "answer": "This is a tourist attraction where many visitors take a hot spring bath in winter.", "accept": ["This is a tourist attraction where many visitors take a hot spring bath in winter", "this is a tourist attraction where many visitors take a hot spring bath in winter"], "ex": {"clue": "關係副詞 where 修飾表地點的先行詞", "words": "tourist attraction 觀光勝地；take a hot spring bath 泡溫泉", "grammar": "先行詞 a tourist attraction 表地點，用關係副詞 where 引導關係子句，描述「許多遊客在冬季泡溫泉」的地方。", "trans": "這是一個許多遊客在冬季泡溫泉的觀光勝地。"}, "id": "q40"}]}]};

var NORM_RE = /[\s\.,，。;；:：!！?？"'“”‘’（）()\[\]【】\-、_]/g;
function norm(s){return (s==null?"":String(s)).toLowerCase().replace(NORM_RE,"");}
function hasAny(user, arr){
  var u = norm(user);
  return arr.some(function(a){ return u === norm(a); });
}

var score = 0, total = 0;
var results = {};   // qid -> {ok:true/false, pts:n}   (fill -> {blanks:[bool]})

function el(tag, cls, html){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html != null) e.innerHTML = html;
  return e;
}

function exBlock(cls, title, text){
  var b = el("div", "ex-block " + cls);
  var h = el("h4", null, title);
  var p = el("p", null, text || "—");
  b.appendChild(h); b.appendChild(p);
  return b;
}

function exPanel(q, openAll){
  var ex = el("div", "ex" + (openAll ? " show" : ""));
  var grid = el("div", "ex-grid");
  var ans = "";
  if(q.type === "sentence" && q.answer){
    ans = q.answer;
  } else if(q.type === "fill" && q.en && q.blanks){
    ans = String(q.en).replace(/\(\((\d+)\)\)/g, function(m, n){ return q.blanks[+n] ? q.blanks[+n].ans : m; });
  }
  if(ans) grid.appendChild(exBlock("ans", "正確答案", ans));
  grid.appendChild(exBlock("clue", "解題線索", q.ex.clue));
  if((q.type === "choice" || q.type === "cloze") && q.ex.opts_trans && q.ex.opts_trans.length){
    var rows = q.options.map(function(o, i){
      return "<b>" + String.fromCharCode(65 + i) + ".</b> " + o + (q.ex.opts_trans[i] ? " ／ " + q.ex.opts_trans[i] : "");
    }).join("<br>");
    grid.appendChild(exBlock("opts", "選項解析", rows));
  }
  grid.appendChild(exBlock("words", "重要字詞", q.ex.words));
  grid.appendChild(exBlock("grammar", "文法句型", q.ex.grammar));
  if((q.type === "choice" || q.type === "cloze") && q.ex.why){
    grid.appendChild(exBlock("why", "為何不選其他選項", q.ex.why));
  }
  grid.appendChild(exBlock("trans", "中文翻譯", q.ex.trans));
  ex.appendChild(grid);
  var tg = el("button", "toggle-ex", "查看詳解 ▾");
  tg.onclick = function(){ ex.classList.toggle("show"); tg.textContent = ex.classList.contains("show") ? "收合詳解 ▴" : "查看詳解 ▾"; };
  ex.appendChild(tg);
  return ex;
}

function speak(text){
  try{
    if(!text) return;
    if(typeof window === "undefined") return;
    if(!window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined"){
      speechUnsupported();
      return;
    }
    var s = window.speechSynthesis;
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = "en-US";
    u.rate = 0.9;
    try{
      var vs = s.getVoices ? s.getVoices() : [];
      var v = null;
      for(var i = 0; i < vs.length; i++){ if(/^en[-_]?US/i.test(vs[i].lang || "")){ v = vs[i]; break; } }
      if(!v){ for(i = 0; i < vs.length; i++){ if(/^en/i.test(vs[i].lang || "")){ v = vs[i]; break; } } }
      if(v) u.voice = v;
    }catch(e1){}
    var np = (typeof navigator !== "undefined" && navigator) ? (navigator.platform || "") : "";
    var touch = false;
    try{ touch = ("ontouchstart" in window) || ((navigator.maxTouchPoints || 0) > 0); }catch(e3){}
    var iOS = /iP(hone|ad|od)/.test(np) || (np === "MacIntel" && (navigator.maxTouchPoints || 0) > 1);
    if(iOS || touch){
      // Mobile (iOS Safari / Android Chrome & Edge): cancel() before speak() is the
      // known Android workaround for silent first utterance, but pause()/resume()
      // must NOT be used — it can leave the synthesis paused and produce no sound.
      s.cancel();
      s.speak(u);
      return;
    }
    s.cancel();
    s.speak(u);
    // Chrome/Edge desktop workaround: wake the engine with pause()/resume()
    try{
      if(!s.paused){
        s.pause();
        s.resume();
      }
    }catch(e2){}
  }catch(e){}
}

var speechToast = null;
function speechUnsupported(){
  try{

    speechToast = el("div", "speech-note", "此環境無法播放語音朗讀：瀏覽器需支援 Web Speech API，並以 HTTPS（或本機）開啟頁面。");
    document.body.appendChild(speechToast);
    setTimeout(function(){ try{ if(speechToast){ speechToast.remove(); speechToast = null; } }catch(e){} }, 5200);
  }catch(e){}
}

(function(){

    else if(window.speechSynthesis.onvoiceschanged === null) window.speechSynthesis.onvoiceschanged = function(){ try{ if(window.speechSynthesis.getVoices) window.speechSynthesis.getVoices(); }catch(e){} };

function fullSentence(q){
  if(q.speakText) return q.speakText;
  if(q.en){
    return q.en.replace(/\(\((\d+)\)\)/g, function(m, n){ return (q.blanks[+n] || {}).ans || ""; });
  }
  if(q.sent){
    var s = String(q.sent).replace(/<span class='hint'>[^<]*<\/span>/g, q.answer || "");
    return s.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  }
  return String(q.stem || "").replace(/_{3,}/g, q.answer || (q.options ? q.options[q.ans] : "") || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
}

function sentChunk(text, no){
  var chs = splitSents(text);
  for(var i = 0; i < chs.length; i++){
    if(chs[i].indexOf("__" + no + "__") >= 0) return chs[i];
  }
  return "";
}

function sentenceWithBlank(text, no, ans){
  var ch = sentChunk(text, no);
  if(!ch) return "";
  ch = String(ch).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  // drop the OCR artifact period right after the blank when the sentence continues
  ch = ch.replace(new RegExp("__" + no + "__\\.(?=\\s*[a-z,])"), "__" + no + "__");
  var parts = String(ans || "").split("\u2026");
  var i = 0;
  var out = ch.replace(new RegExp("__" + no + "__", "g"), function(){
    var v = parts.length > 1 ? (parts[i] || "") : (ans || "");
    i++;
    return v.trim();
  });
  return out.replace(/\s+/g, " ").replace(/^[\s.,;:!?]+/, "").trim();
}

function badgeClean(s){
  return String(s).replace(/<span class='bk'>（\d+）<\/span>\.(?=\s*[a-z,])/g, function(m){ return m.slice(0, -1); });
}

function refSentHTML(text, no){
  var chs = splitSents(text);
  var idx = -1;
  for(var i = 0; i < chs.length; i++){
    if(chs[i].indexOf("__" + no + "__") >= 0){ idx = i; break; }
  }
  if(idx < 0) return "";
  var cur = chs[idx].replace(/__(\d+)__/g, function(m, n){ return "<span class='bk'>（" + n + "）</span>"; });
  var out = "";
  if(idx > 0 && /^\s*__\d+__/.test(chs[idx])){
    var prev = chs[idx - 1].replace(/__(\d+)__/g, function(m, n){ return "<span class='bk'>（" + n + "）</span>"; });
    out += "<span class='ctx-prev'>" + badgeClean(prev) + "</span>";
  }
  out += "<span class='ctx-cur'>" + badgeClean(cur) + "</span>";
  return out;
}

function splitSents(text){
  var t = String(text || "");
  var chunks = [];
  var start = 0;
  for(var i = 0; i < t.length; i++){
    var c = t.charAt(i);
    if(c === "." || c === "!" || c === "?"){
      var prev = t.slice(Math.max(0, i - 12), i);
      if(/[0-9]+__$/.test(prev)){
        var nx = t.slice(i + 1).replace(/^\s+/, "");
        if(nx && /^[a-z,]/.test(nx)) continue;
      }
      i++;
      while(i < t.length && /[.!?]/.test(t.charAt(i))) i++;
      var ch = t.slice(start, i).trim().replace(/\s+/g, " ");
      if(ch) chunks.push(ch);
      start = i;
      i--;
    }
  }
  var tail = t.slice(start).trim().replace(/\s+/g, " ");
  if(tail) chunks.push(tail);
  return chunks;
}

function goToQuestion(card, no){
  try{
    var box = null;
    [].forEach.call(card.querySelectorAll(".q"), function(b){
      var qno = b.querySelector(".qno");
      if(!qno) return;
      var t = String(qno.textContent || qno._innerSet || "").replace(/\s+/g, "");
      if(t === no + ".") box = b;
    });
    if(!box) return;
    if(typeof box.scrollIntoView === "function") box.scrollIntoView({behavior:"smooth", block:"start"});
    var ex = box.querySelector(".ex");
    if(ex){
      ex.classList.add("show");
      var tg = box.querySelector(".toggle-ex");
      if(tg) tg.textContent = "收合詳解 ▴";
    }
    box.classList.add("jump-hl");
    if(typeof setTimeout !== "undefined") setTimeout(function(){ try{ box.classList.remove("jump-hl"); }catch(e){} }, 1600);
  }catch(e){}
}

function highlightSentence(box, no){
  try{
    var card = box.parentElement || box.parent;
    if(!card) return;
    var target = null;
    [].forEach.call(card.querySelectorAll(".passage"), function(pa){
      if(!target) target = pa.querySelector("span[data-no=" + no + "]");
    });
    if(!target) return;
    [].forEach.call(card.querySelectorAll(".passage .sent"), function(s){ if(s.classList) s.classList.remove("hl"); });
    target.classList.add("hl");
    if(typeof target.scrollIntoView === "function") target.scrollIntoView({behavior:"smooth", block:"center"});
    if(typeof requestAnimationFrame === "function"){
      clearTimeout(target._hlTimer);
      target._hlTimer = setTimeout(function(){ target.classList.remove("hl"); }, 3600);
    }
  }catch(e){}
}

/* ---------- rendering ---------- */
function renderApp(){
  var app = document.getElementById("app");
  DATA.sections.forEach(function(sec){
    var card = el("section", "card");
    card.id = sec.id;
    var head = el("div", "sec-head");
    head.appendChild(el("h2", null, sec.title));
    head.appendChild(el("p", "sub", sec.subtitle));
    var ssc = el("span", "sec-score", "本節得分 <b id='ss-"+sec.id+"'>0</b> / <span>"+sec.points+"</span>");
    head.appendChild(ssc);
    card.appendChild(head);

    if(sec.type === "cloze"){
      sec.passages.forEach(function(pg){
        var pass = el("div", "passage");
        var pt = el("div", "ptitle", (sec.ptitle || "閱讀測驗 ") + pg.title);
        pass.appendChild(pt);
        var text = splitSents(pg.text).map(function(ch){
          var no = (ch.match(/__(\d+)__/) || [])[1];
          var html = ch.replace(/__(\d+)__/g, function(m, n){ return "<span class='bk'>（" + n + "）</span>"; });
          return "<span class='sent'" + (no ? " data-no='" + no + "'" : "") + ">" + badgeClean(html) + "</span>";
        }).join(" ");
        var pEl = el("p", null, text);
        pass.appendChild(pEl);
        card.appendChild(pass);
        [].forEach.call(pEl.querySelectorAll(".bk"), function(bk){
          var n = parseInt(String(bk.textContent || bk._innerSet || "").replace(/[^0-9]+/g, ""), 10);
          if(!n) return;
          bk.classList.add("bk-link");
          bk.title = "跳到第 " + n + " 題解析";
          bk.onclick = function(){ goToQuestion(card, n); };
        });
        pg.questions.forEach(function(q){
          q.speakText = sentenceWithBlank(pg.text, q.no, q.options[q.ans]);
          q.refSent = refSentHTML(pg.text, q.no);
          card.appendChild(renderQ(sec, q));
        });
      });
    } else {
      sec.questions.forEach(function(q){ card.appendChild(renderQ(sec, q)); });
    }
    app.appendChild(card);
  });
  total = 0;
  DATA.sections.forEach(function(sec){
    total += sec.points;
  });
  document.getElementById("total").textContent = total;
  buildChips();
}

function renderQ(sec, q){
  q.type = q.type || sec.type; q.sec = sec.id; q.secTitle = sec.title;
  var box = el("div", "q");
  box.setAttribute("data-qid", q.id);
  var head = el("div", "qhead");
  head.appendChild(el("span", "qno", q.no + "."));
  var dispPts = q.pts * (q.blanks ? q.blanks.length : 1);
  head.appendChild(el("span", "qpts", dispPts + " 分"));
  box.appendChild(head);

  var body = el("div", "qbody");
  var ctrl = el("div", "qctrl");
  var rbox = resultBox();

  if(q.type === "choice" || q.type === "cloze"){
    var stemText = q.stem || (q.type === "cloze" ? q.refSent : "");
    if(stemText) body.appendChild(el("p", "qstem" + (q.type === "cloze" && !q.stem ? " refsent" : ""), stemText));
    var opts = el("div", "opts");
    var selected = -1;
    q.options.forEach(function(opt, i){
      var o = el("div", "opt");
      o.innerHTML = "<span class='ol'>" + String.fromCharCode(65+i) + ".</span>" + opt;
      o.onclick = function(){
        if(box.dataset.graded === "1") return;
        Array.prototype.forEach.call(opts.children, function(c){ c.classList.remove("sel"); });
        o.classList.add("sel");
        selected = i;
      };
      opts.appendChild(o);
    });
    body.appendChild(opts);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      if(q.type === "cloze") highlightSentence(box, q.no);
      if(selected < 0){
        showInfo(rbox, "尚未選擇答案。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var ok = (selected === q.ans);
      markResult(box, rbox, q, ok);
      Array.prototype.forEach.call(opts.children, function(c, i){
        c.classList.remove("sel");
        if(i === q.ans) c.classList.add("correct");
        else if(i === selected && !ok) c.classList.add("wrong");
      });
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "vocab"){
    body.appendChild(el("p", "qstem", "請寫出「<b>" + q.answer + "</b>」的英文。"));
    var inp = el("input", "");
    inp.type = "text"; inp.placeholder = "輸入英文單字";
    body.appendChild(inp);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(q.word);
      var v = inp.value.trim();
      if(!v){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，作答後即可計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, [q.word].concat(q.accept_en || []));
      markResult(box, rbox, q, ok, q.word + "（" + q.answer + "）");
      if(ok){ inp.style.borderColor = "#2b8a3e"; } else { inp.style.borderColor = "#e03131"; }
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "word"){
    var sent = String(q.sent).replace(/<span class='hint'>([a-zA-Z]+)\s+([a-zA-Z]+)<\/span>/g, function(m, a, b){
      var missing = Math.max(1, (q.answer || "").length - a.length - b.length);
      return "<span class='hint'>" + a + "</span><span class='uhint'>" + new Array(missing + 1).join("_") + "</span><span class='hint'>" + b + "</span>";
    });
    body.appendChild(el("p", "qstem", sent));
    var inp = el("input", "");
    inp.type = "text"; inp.placeholder = "依提示字母填入單字";
    body.appendChild(inp);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      var v = inp.value.trim();
      if(!v){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，作答後即可計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, q.accept);
      markResult(box, rbox, q, ok);
      if(ok){ inp.style.borderColor = "#2b8a3e"; } else { inp.style.borderColor = "#e03131"; }
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "fill"){
    body.appendChild(el("p", "qstem", "【中文】" + q.cn));
    var sen = el("p", "qstem");
    var html = q.en.replace(/\(\((\d+)\)\)/g, function(m, n){
      var b = q.blanks[+n];
      var letters = [];
      var lm, lre = /\(([^)]+)\)/g;
      while((lm = lre.exec(b.label || ""))) letters.push(lm[1]);
      var fragA = letters[0] || "";
      var fragB = letters.length > 1 ? letters.slice(1).join("") : "";
      var missing = Math.max(1, (b.ans || "").length - fragA.length - fragB.length);
      var shown = fragA + new Array(missing + 1).join("_") + fragB;
      return ' <span class="bblank">' + shown + '</span> ';
    });
    sen.innerHTML = html;
    body.appendChild(sen);
    var abox = el("div", "fbox");
    q.blanks.forEach(function(b, n){
      var span = el("span", "lbl", "(" + (n + 1) + ")");
      var inp = el("input", "inline-in");
      inp.type = "text";
      inp.style.width = Math.min(220, Math.max(90, (b.ans || "").length * 12)) + "px";
      inp.setAttribute("data-blank", n);
      abox.appendChild(span); abox.appendChild(inp);
    });
    body.appendChild(abox);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      var ins = abox.querySelectorAll("input[data-blank]");
      var emptyAll = true;
      ins.forEach(function(ip){ if(String(ip.value || "").trim()) emptyAll = false; });
      if(emptyAll){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var oks = [];
      var all = true, any = false;
      ins.forEach(function(ip){
        var b = q.blanks[+ip.dataset.blank];
        var ok = hasAny(ip.value, b.accept);
        oks.push(ok); any = any || ok; if(!ok) all = false;
        ip.style.borderColor = ok ? "#2b8a3e" : "#e03131";
      });
      var nOk = oks.filter(Boolean).length;
      box.dataset.graded = "1";
      var pts = nOk * q.pts;
      var prev = results[q.id];
      if(prev){ score -= prev.pts; }
      results[q.id] = {ok: nOk === q.blanks.length, pts: pts};
      score += pts;
      updateScore();
      var msg = "答對 " + nOk + " / " + q.blanks.length + " 格，得 " + pts + " 分。";
      showResult(box, rbox, all, msg);
      expandEx(box);
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "sentence"){
    body.appendChild(el("p", "qstem", q.task));
    var ta = el("textarea", "");
    ta.placeholder = "請寫下你的句子";
    body.appendChild(ta);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(q.answer);
      var v = ta.value.trim();
      if(!v){
        showInfo(rbox, "尚未寫下句子。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, q.accept);
      markResult(box, rbox, q, ok);
      if(!ok){
        rbox.innerHTML = "尚未完全符合參考答案。請先參考下方「解題線索／文法句型」，再自行判斷是否答對。";
        var self = el("div", "qctrl");
        var y = el("button", "btn btn-ok", "我寫對了");
        var n = el("button", "btn btn-bad", "我寫錯了");
        y.onclick = function(){ markResult(box, rbox, q, true); self.remove(); };
        n.onclick = function(){ markResult(box, rbox, q, false); self.remove(); };
        self.appendChild(y); self.appendChild(n);
        rbox.appendChild(self);
      }
    };
    ctrl.appendChild(chk);
  }

  box.appendChild(body);
  box.appendChild(ctrl);
  box.appendChild(rbox);
  var ex = exPanel(q, false);
  box.appendChild(ex);
  return box;
}

function markResult(box, rbox, q, ok, ansText){
  box.dataset.graded = "1";
  var prev = results[q.id];
  if(prev){ score -= prev.pts; }
  results[q.id] = {ok: ok, pts: ok ? q.pts : 0};
  score += ok ? q.pts : 0;
  updateScore();
  if(ok){
    showResult(box, rbox, true, "答對了！得 " + q.pts + " 分。");
  } else {
    showResult(box, rbox, false, "答錯了。正確答案：" + (ansText || q.answer));
  }
  var chip = document.getElementById("chip-" + q.sec);
  if(chip){
    chip.textContent = q.secTitle + " " + sectionScore(q.sec) + "/" + sectionPoints(q.sec);
  }
  expandEx(box);
}

function expandEx(box){
  var ex = box.querySelector(".ex");
  var tg = box.querySelector(".toggle-ex");
  if(ex && !ex.classList.contains("show")){ ex.classList.add("show"); }
  if(tg){ tg.textContent = "收合詳解 ▴"; }
}

function sectionPoints(secId){
  var s = DATA.sections.filter(function(x){return x.id===secId;})[0];
  return s ? s.points : 0;
}
function sectionScore(secId){
  var tot = 0;
  Object.keys(results).forEach(function(k){
    var r = results[k];
    var q = questionById(k);
    if(q && q.sec === secId) tot += r.pts;
  });
  return tot;
}
function questionById(qid){
  var found = null;
  DATA.sections.forEach(function(sec){
    var list = [];
    if(sec.type === "cloze"){ sec.passages.forEach(function(p){ list = list.concat(p.questions); }); }
    else { list = sec.questions; }
    list.forEach(function(q){ if(q.id === qid){ found = q; } });
  });
  return found;
}

function updateScore(){
  document.getElementById("score").textContent = score;
  var p = total ? Math.round(score / total * 100) : 0;
  document.getElementById("pbar").style.width = p + "%";
  DATA.sections.forEach(function(sec){
    var s = document.getElementById("ss-" + sec.id);
    if(s) s.textContent = sectionScore(sec.id);
  });
}

function buildChips(){
  var c = document.getElementById("secchips");
  c.innerHTML = "";
  DATA.sections.forEach(function(sec){
    var ch = el("button", "chip", sec.title + " 0/" + sec.points);
    ch.type = "button";
    ch.id = "chip-" + sec.id;
    ch.onclick = function(){
      var el = document.getElementById(sec.id);
      if(el) el.scrollIntoView({behavior: "smooth", block: "start"});
    };
    c.appendChild(ch);
  });
  updateChipActive();
}

function updateChipActive(){
  var mark = null;
  DATA.sections.forEach(function(sec){
    var el = document.getElementById(sec.id);
    var ch = document.getElementById("chip-" + sec.id);
    if(!el || !ch) return;
    var r = el.getBoundingClientRect();
    if(r.top <= 170) mark = ch;
  });
  document.querySelectorAll("#secchips .chip").forEach(function(ch){
    if(ch === mark) ch.classList.add("on");
    else ch.classList.remove("on");
  });
}
if(typeof window !== "undefined"){
  window.addEventListener("scroll", updateChipActive, {passive: true});
}

function revealAll(){
  document.querySelectorAll("#app .q").forEach(function(box){
    var q = questionById(box.dataset.qid);
    if(!q) return;
    var ex = box.querySelector(".ex");
    if(ex) ex.classList.add("show");
    var ins = box.querySelectorAll("input[type=text],textarea");
    if(q.type === "vocab"){
      if(ins[0]) ins[0].value = q.word;
    } else if(q.type === "word"){
      if(ins[0]) ins[0].value = q.answer;
    } else if(q.type === "fill"){
      box.querySelectorAll("input[data-blank]").forEach(function(ip){
        ip.value = q.blanks[+ip.dataset.blank].ans;
      });
    } else if(q.type === "sentence"){
      if(ins[0]) ins[0].value = q.answer;
    } else if(q.type === "choice" || q.type === "cloze"){
      box.querySelectorAll(".opt").forEach(function(o, i){
        if(i === q.ans) o.classList.add("correct");
      });
    }
  });
  var tgs = document.querySelectorAll(".toggle-ex");
  tgs.forEach(function(t){ t.textContent = "收合詳解 ▴"; });
}

function resetAll(){
  score = 0; results = {};
  document.querySelectorAll("#app .q").forEach(function(box){
    box.dataset.graded = "";
    box.querySelectorAll("input[type=text],textarea").forEach(function(i){ i.value=""; i.style.borderColor=""; });
    box.querySelectorAll(".opt").forEach(function(o){ o.className="opt"; });
    var r = box.querySelector(".qresult");
    if(r){ r.className="qresult"; r.innerHTML=""; }
    var ex = box.querySelector(".ex");
    if(ex) ex.classList.remove("show");
  });
  document.querySelectorAll(".toggle-ex").forEach(function(t){ t.textContent = "查看詳解 ▾"; });
  updateScore();
  buildChips();
}

document.getElementById("reset").onclick = resetAll;
document.getElementById("revealAll").onclick = revealAll;
renderApp();
updateScore();
</script>
