<head>

<title>Lessons 3–4 Review | 學習評量（115上技高英文 Choice 版三）</title>
<style>
:root{
  --ink:#1f2430; --muted:#6b7280; --line:#e5e7eb; --bg:#f4f6fb;
  --card:#ffffff; --accent:#3b5bdb; --accent2:#0ca678; --warn:#f59f00;
  --ok:#2b8a3e; --bad:#e03131; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#065f46,#0ca678);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.top .wrap{padding-top:14px;padding-bottom:14px}
.top h1{margin:0;font-size:22px;letter-spacing:.5px}
.top .zh{margin:2px 0 10px;font-size:13px;opacity:.9}
.badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:1px 12px;font-size:12px;margin-bottom:6px}
.scorebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.score{background:rgba(255,255,255,.14);border-radius:10px;padding:6px 14px;font-size:14px}
.score b{font-size:20px;color:#ffe066}
.progress{flex:1 1 120px;height:10px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
#pbar{height:100%;width:0%;background:#ffe066;border-radius:999px;transition:width .3s}
.sb-btn{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer}
.sb-btn:hover{background:rgba(255,255,255,.15)}
.secchips{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;border:none;color:#fff;cursor:pointer;font-family:inherit;transition:.15s}
.chip:hover{background:rgba(255,255,255,.26)}
.chip.on{background:rgba(255,255,255,.4);box-shadow:0 0 0 1px rgba(255,255,255,.65) inset}
.chip.ok{background:rgba(46,204,113,.35)}
main.wrap{padding-top:20px;padding-bottom:40px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px;box-shadow:0 1px 4px rgba(16,24,40,.05);overflow:hidden}
.sec-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;background:#fafbff}
.sec-head h2{margin:0;font-size:17px;color:#253073}
.sec-head .sub{margin:0;font-size:12.5px;color:var(--muted)}
.sec-head .sec-score{margin-left:auto;font-size:13px;color:#253073;font-weight:600}
.passage{margin:14px 18px 0;padding:14px 16px;background:#f8f9ff;border:1px solid #dbe1ff;border-radius:10px;font-size:15px}
.passage .ptitle{font-weight:700;color:#3b5bdb;margin-bottom:6px}
.bk{display:inline-block;background:#3b5bdb;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;margin:0 2px;vertical-align:middle}
.sent{transition:background .3s,box-shadow .3s}
.sent.hl{background:#fff3bf;border-radius:6px;box-shadow:0 0 0 3px #ffe066;scroll-margin-top:170px}
.q{padding:16px 18px;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:none}
.card{scroll-margin-top:170px}
.qhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.qno{font-weight:700;color:#3b5bdb}
.qpts{margin-left:auto;font-size:12px;color:var(--muted);background:#eef1ff;border-radius:6px;padding:0 8px}
.qstem{font-size:15.5px;margin:4px 0}
.qstem .hint{color:var(--warn);font-weight:600}
.uhint,.bblank{color:#94a3b8;font-family:monospace;letter-spacing:.5px;font-weight:600}
.bblank{color:#64748b}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;font-size:14.5px;user-select:none;transition:.12s}
.opt:hover{border-color:#aab4f0;background:#f4f6ff}
.opt .ol{display:inline-block;width:22px;color:#6b7280;font-weight:700}
.opt.sel{border-color:var(--accent);background:#e9edff;box-shadow:0 0 0 1px var(--accent) inset}
.opt.correct{border-color:var(--ok);background:#e6f7ec}
.opt.wrong{border-color:var(--bad);background:#fdecec}
.fbox{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fbox .lbl{font-weight:700;color:#6b7280;font-size:13px}
input[type=text],textarea{border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14.5px;font-family:inherit;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,91,219,.12)}
textarea{width:100%;min-height:64px;resize:vertical}
.inline-in{margin:0 4px;vertical-align:middle}
.fbl{display:inline-block;background:#fff3bf;color:#9a7b00;font-weight:700;font-size:11px;border-radius:5px;padding:0 6px;margin:0 2px;vertical-align:middle}
.qctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button.btn{border:none;border-radius:8px;padding:7px 16px;font-size:13.5px;cursor:pointer;font-family:inherit}
.btn-check{background:var(--accent);color:#fff}
.btn-check:hover{background:#2f4bc0}
.btn-ghost{background:#eef1f6;color:#374151}
.btn-ghost:hover{background:#e2e7f0}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:var(--bad);color:#fff}
.qresult{display:none;margin-top:10px;padding:10px 14px;border-radius:9px;font-size:14px}
.qresult.show{display:block}
.qresult.good{background:#e9f9f0;border:1px solid #b7e6c8;color:#1c6b32}
.qresult.bad{background:#fdeeee;border:1px solid #f3c1c1;color:#9c2222}
.qresult.info{background:#eef4ff;border:1px solid #c6d8ff;color:#2f4bc0}
.toggle-ex{margin-top:10px;border:1px solid #aab4f0;background:#eef1ff;color:#3b5bdb;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;padding:5px 14px;transition:.12s}
.toggle-ex:hover{background:#e2e8ff;border-color:#8f9cf0}
.ex{display:none;margin-top:10px}
.ex.show{display:block}
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex-block{border-radius:9px;padding:10px 12px;font-size:13.5px;border:1px solid var(--line)}
.ex-block h4{margin:0 0 4px;font-size:13px;color:#253073}
.ex-block p{margin:0}
.ex.clue{border-left:4px solid var(--warn);background:#fffbf0}
.ex.words{border-left:4px solid var(--accent);background:#f4f6ff}
.ex.grammar{border-left:4px solid var(--accent2);background:#f0fbf6}
.ex.trans{border-left:4px solid #be4bdb;background:#fcf5ff}
@media (max-width:600px){.ex-grid{grid-template-columns:1fr}}
footer.wrap{padding-bottom:30px;color:var(--muted);font-size:12px}
</style>
</head>

<script>
"use strict";
var DATA = {"num": "R34", "en": "Lessons 3–4 Review", "zh": "複習｜第 3～4 課", "sections": [{"id": "s1", "type": "word", "title": "一、文意字彙", "subtitle": "1.～7. 題，填入適當的字彙，以完成該句。8.～10. 題，選出與句中畫底線的字意思最接近的答案。（每題 2 分，共 20 分）", "points": 20, "questions": [{"no": 1, "pts": 2, "type": "word", "sent": "Because of the victim's <span class='hint'>v e</span> information, the police finally caught the scammers.", "answer": "valuable", "accept": ["valuable"], "ex": {"clue": "v…e（有價值的）", "words": "valuable adj. 有價值的；寶貴的；victim n. 受害者", "grammar": "valuable 為形容詞，修飾 information「寶貴的情報資訊」；because of + 名詞「因為……」。", "trans": "由於受害者提供了寶貴的資訊，警方終於抓到這些騙子。"}, "id": "q1"}, {"no": 2, "pts": 2, "type": "word", "sent": "Laura <span class='hint'>p d</span> her baby's head before singing him to sleep.", "answer": "patted", "accept": ["patted", "pats"], "ex": {"clue": "p…d（輕拍）", "words": "pat v. 輕拍；sing sb. to sleep 唱歌哄某人入睡", "grammar": "動作發生於過去（before singing him to sleep），故用過去式 patted。", "trans": "蘿拉在唱歌哄她的小嬰兒入睡前，先輕拍他的頭。"}, "id": "q2"}, {"no": 3, "pts": 2, "type": "word", "sent": "Bruce is a very <span class='hint'>i l</span> businessman. Many people have been inspired by his success.", "answer": "influential", "accept": ["influential"], "ex": {"clue": "i…l（有影響力的）", "words": "influential adj. 有影響力的；inspire v. 激勵", "grammar": "very + 形容詞；influential businessman「有影響力的企業家」；inspired by「受到……的啟發／激勵」。", "trans": "布魯斯是一位非常有影響力的企業家，許多人因他的成功而受到激勵。"}, "id": "q3"}, {"no": 4, "pts": 2, "type": "word", "sent": "The customer felt very sorry and apologized to the clerk for his rude <span class='hint'>b r</span>.", "answer": "behavior", "accept": ["behavior", "behaviour"], "ex": {"clue": "b…r（行為）", "words": "behavior n. 行為；apologize to sb. for sth. 因某事向某人道歉", "grammar": "apologize to sb. for sth.「因某事向某人道歉」；for 後接名詞，rude behavior「粗魯的行為」。", "trans": "顧客感到非常抱歉，並為自己的粗魯行為向店員道歉。"}, "id": "q4"}, {"no": 5, "pts": 2, "type": "word", "sent": "I don't know what to eat for dinner. Do you have any <span class='hint'>s s</span>?", "answer": "suggestions", "accept": ["suggestions"], "ex": {"clue": "s…s（建議）", "words": "suggestion n. 建議；any 用於疑問句", "grammar": "疑問句用 any + 可數複數名詞，故 suggestion 用複數 suggestions。", "trans": "我不知道晚餐要吃什麼，你有任何建議嗎？"}, "id": "q5"}, {"no": 6, "pts": 2, "type": "word", "sent": "Leo's father got into <span class='hint'>d t</span> and his company closed down.", "answer": "debt", "accept": ["debt"], "ex": {"clue": "d…t（債務）", "words": "debt n. 債務；get into debt 負債；close down 倒閉", "grammar": "get into debt「負債」；close down「倒閉」，與債務的因果關係相呼應。", "trans": "里歐的父親負了債，他的公司也倒閉了。"}, "id": "q6"}, {"no": 7, "pts": 2, "type": "word", "sent": "Jogging is a popular form of <span class='hint'>p l</span> exercise.", "answer": "physical", "accept": ["physical"], "ex": {"clue": "p…l（身體的）", "words": "physical adj. 身體的；physical exercise 體育鍛鍊", "grammar": "a form of + 名詞「一種……的形式」；physical exercise「體育鍛鍊」。", "trans": "慢跑是一種很受歡迎的體育鍛鍊形式。"}, "id": "q7"}, {"no": 8, "pts": 2, "type": "choice", "stem": "We admire Jason's courage in saving a drowning child.", "options": ["react", "grab", "respect", "prefer"], "ans": 2, "ex": {"clue": "admire＝欽佩；尊敬", "words": "admire v. 欽佩；respect v. 尊敬；欽佩", "grammar": "admire（欽佩、尊敬）的意思最接近 respect。", "trans": "我們欽佩傑森拯救溺水兒童的勇氣。"}, "id": "q8"}, {"no": 9, "pts": 2, "type": "choice", "stem": "Gender equality is an important issue in our society now.", "options": ["program", "discovery", "solution", "problem"], "ans": 3, "ex": {"clue": "issue＝議題；問題", "words": "issue n. 議題；問題；problem n. 問題", "grammar": "issue（議題、問題）的意思最接近 problem。", "trans": "性別平等在我們現今的社會是一個重要的議題。"}, "id": "q9"}, {"no": 10, "pts": 2, "type": "choice", "stem": "Tom refused the job offer because he is going to study abroad next month.", "options": ["checked on", "turned down", "passed down", "relied on"], "ans": 1, "ex": {"clue": "refused＝拒絕", "words": "refuse v. 拒絕；turn down 拒絕；job offer 工作機會", "grammar": "refuse（拒絕）的意思最接近 turn down（婉拒、拒絕）。", "trans": "湯姆拒絕了那份工作機會，因為他下個月要出國留學。"}, "id": "q10"}]}, {"id": "s2", "type": "choice", "title": "二、語法測驗", "subtitle": "選出一個最適當的答案。（每題 2 分，共 16 分）", "points": 16, "questions": [{"no": 11, "pts": 2, "stem": "______ what the sign said, the tourist looked confused.", "options": ["Not known", "He didn't know", "Not knowing", "Didn't know"], "ans": 2, "ex": {"clue": "分詞構句：know 為主動動作用現在分詞", "words": "sign n. 告示牌；confused adj. 困惑的", "grammar": "兩個句子間沒有連接詞，故用分詞構句；know 對主詞 the tourist 為主動作，用現在分詞 knowing，並加上否定 Not。", "trans": "因為看不懂告示牌上寫些什麼，那名觀光客看起來很困惑。"}, "id": "q11"}, {"no": 12, "pts": 2, "stem": "Why don't you get a part-time job after school ______ you can earn some money?", "options": ["so that", "although", "as soon as", "whether"], "ans": 0, "ex": {"clue": "表目的用 so that", "words": "part-time job 兼職工作；so that 以便；為了", "grammar": "so that 引導目的子句「以便、為了」；打工的目的在於賺錢，故表目的。", "trans": "你何不在放學後找份兼職工作，這樣你就可以賺點錢呢？"}, "id": "q12"}, {"no": 13, "pts": 2, "stem": "The students wanted to know ______ they would have a quiz or not.", "options": ["that", "if", "what", "when"], "ans": 1, "ex": {"clue": "…or not 搭配 if「是否」", "words": "quiz n. 小考；if…or not 是否", "grammar": "want to know if + S + V「想知道是否……」；句末的 or not 常與 if 搭配表達「是否」。", "trans": "學生們想知道他們是否會有小考。"}, "id": "q13"}, {"no": 14, "pts": 2, "stem": "______ by a car, the injured man was taken to the hospital right away.", "options": ["To hit", "Hitting", "Was hit", "Hit"], "ans": 3, "ex": {"clue": "分詞構句：被動動作用過去分詞", "words": "injured adj. 受傷的；right away 立刻", "grammar": "兩個句子間沒有連接詞，故用分詞構句；hit 對 the injured man 為被動動作（被車撞），故保留過去分詞 Hit。", "trans": "那名受傷的男子被車撞到後，立刻被送往醫院。"}, "id": "q14"}, {"no": 15, "pts": 2, "stem": "I don't know where ______.", "options": ["you live", "live you", "do you live", "are you living"], "ans": 0, "ex": {"clue": "間接問句：wh- + S + V", "words": "where + S + V 何處；live v. 居住", "grammar": "間接問句須以「疑問詞 + 主詞 + 動詞」的順序（where you live），而非疑問句語序。", "trans": "我不知道你住在哪裡。"}, "id": "q15"}, {"no": 16, "pts": 2, "stem": "Sylvia is worried about ______ she can catch the next train.", "options": ["so that", "if", "whether", "what"], "ans": 2, "ex": {"clue": "介系詞後只能用 whether", "words": "be worried about 擔心；whether + S + V 是否", "grammar": "介系詞 about 之後表示「是否」只能用 whether（不可用 if），其後接「whether + S + V」。", "trans": "西維亞擔心她是否能趕上下一班火車。"}, "id": "q16"}, {"no": 17, "pts": 2, "stem": "We had better ______ Google Maps before the trip.", "options": ["to check", "check", "checking", "checked"], "ans": 1, "ex": {"clue": "had better + 原形動詞", "words": "had better + V 最好……；trip n. 旅行", "grammar": "had better 後接原形動詞，表示「最好……」，故用 check。", "trans": "我們最好在旅行前先查看一下 Google 地圖。"}, "id": "q17"}, {"no": 18, "pts": 2, "stem": "Did you see ______ stole the money?", "options": ["whether", "that", "who", "where"], "ans": 2, "ex": {"clue": "空格缺乏主詞，用疑問詞 who", "words": "steal v. 偷竊；steal money 偷錢", "grammar": "空格需作為間接問句的主詞，疑問詞中只有 who 可以當主詞。", "trans": "你有看到是誰偷了那筆錢嗎？"}, "id": "q18"}]}, {"id": "s3", "type": "cloze", "ptitle": "綜合測驗", "title": "三、綜合測驗", "subtitle": "依短文文意，選出一個最適合該空格的答案。（每題 2 分，共 10 分）", "points": 10, "passages": [{"title": "短文", "text": "As the gap between rich and poor grows, many poor people are stuck in the “poverty trap.” __19__ heavy pressure in daily life, they must focus on their immediate needs, such as what to eat or where to sleep. As a result, it may __20__ them a long time to earn enough money to cover basic living costs. Due to __21__ under such conditions, poor people often have little choice. For example, children in these families may not have the chance to think about __22__ in the future. __23__ solving this problem is not easy, society should still try to help those who are trapped in poverty. This may give them a better chance to change their lives.", "questions": [{"no": 19, "pts": 2, "stem": "", "options": ["Face", "They face", "Faced", "Facing"], "ans": 3, "ex": {"clue": "分詞構句：face 為主動作", "words": "poverty n. 貧窮；pressure n. 壓力", "grammar": "兩個句子間沒有連接詞，也非關係子句，故用分詞構句；face 對 many poor people 為主動作，故用現在分詞 Facing。", "trans": "面對日常生活的沉重壓力，他們必須專注於眼前（立即）的需求，像是要吃什麼、要在哪裡睡覺。"}, "id": "q19"}, {"no": 20, "pts": 2, "stem": "", "options": ["take", "cost", "spend", "ask"], "ans": 0, "ex": {"clue": "It takes sb. 時間 to V", "words": "take v. 花費（時間）；cover v. 支付；basic living costs 基本生活費用", "grammar": "It + take(s) + sb. + 時間 + to V「做某事花費某人多少時間」，故用 take。", "trans": "結果，他們可能需要花很長的時間，才能賺到足夠的錢來支付基本生活開銷。"}, "id": "q20"}, {"no": 21, "pts": 2, "stem": "", "options": ["they live", "living", "live", "lived"], "ans": 1, "ex": {"clue": "due to + N / V-ing", "words": "due to 因為；conditions n. 環境；處境", "grammar": "due to 之後須接名詞或動名詞，故用 living。", "trans": "由於在這種處境下生活，窮人往往沒有太多選擇。"}, "id": "q21"}, {"no": 22, "pts": 2, "stem": "", "options": ["what do they want to do", "what they want to do", "they want to do what", "do they want to do what"], "ans": 1, "ex": {"clue": "間接問句：wh- + S + V", "words": "in the future 在未來；think about 考慮", "grammar": "間接問句須用「疑問詞 + 主詞 + 動詞」的順序（what they want to do），而非疑問句語序。", "trans": "例如，這些家庭的孩子們可能沒有機會思考未來想做什麼。"}, "id": "q22"}, {"no": 23, "pts": 2, "stem": "", "options": ["However", "Before", "When", "Although"], "ans": 3, "ex": {"clue": "讓步：「雖然……，還是……」", "words": "although 雖然；solve v. 解決；be trapped in 被困於", "grammar": "兩個子句之間為讓步關係「雖然……，社會還是應該……」，故用 Although。", "trans": "雖然解決這個問題並不容易，社會仍應設法幫助那些陷入貧窮的人。"}, "id": "q23"}]}]}, {"id": "s4", "type": "choice", "title": "四、對話", "subtitle": "根據對話選一個最適當的答案。（每題 3 分，共 15 分）", "points": 15, "questions": [{"no": 24, "pts": 3, "stem": "Sean: How was your exam? Did it go well?<br>Tracy: Yes, I passed it. Thank you for helping me prepare for it.<br>Sean: __________ I'm happy to help.", "options": ["I'm afraid not.", "I'm sorry to hear that.", "Don't mention it.", "Forget it."], "ans": 2, "ex": {"clue": "回應對方的道謝用 Don't mention it.", "words": "Don't mention it. 不客氣；別客氣", "grammar": "對方道謝時可用 Don't mention it.（別客氣、不用謝）回應，意思等同 You're welcome。", "trans": "尚恩：你考試考得如何？順利嗎？翠西：我通過了，謝謝你幫我準備。尚恩：別客氣，我很樂意幫忙。"}, "id": "q24"}, {"no": 25, "pts": 3, "stem": "Finn: My girlfriend looked through my cellphone without my permission, and I don't like it.<br>Luke: I think you should tell her how you feel about it.<br>Finn: __________ I will.", "options": ["You should ask me first.", "Why did you do it?", "Thanks for the advice.", "Could you leave me alone?"], "ans": 2, "ex": {"clue": "接受建議並道謝", "words": "Thanks for the advice. 謝謝你的建議；permission n. 允許", "grammar": "芬恩接受路克的建議，接著表示「我會的」，故用 Thanks for the advice.「謝謝你的建議」。", "trans": "芬恩：我女朋友沒經過我允許就翻看我的手機，我不喜歡這樣。路克：我覺得你應該告訴她你的感受。芬恩：謝謝你的建議，我會的。"}, "id": "q25"}, {"no": 26, "pts": 3, "stem": "Jerry: I'm leaving for Japan tomorrow. Can you take me to the airport?<br>John: __________ When is your flight?<br>Jerry: It leaves at 12 noon. Is that convenient?<br>John: I'll pick you up at 9 a.m. from your house.<br>Jerry: Thanks a lot. I owe you one.", "options": ["Sure thing.", "I'm sorry I can't.", "No way.", "Watch out for the step."], "ans": 0, "ex": {"clue": "爽快答應用 Sure thing.", "words": "Sure thing. 沒問題；可以啊；owe sb. one 欠某人一次人情", "grammar": "約翰願意載傑瑞去機場，並接著詢問班機時間，故用 Sure thing.「沒問題」。", "trans": "傑瑞：我明天要出發去日本，你能載我去機場嗎？約翰：沒問題，你的班機幾點？傑瑞：中午十二點起飛，方便嗎？約翰：我早上九點去你家接你。傑瑞：非常感謝，我欠你一次人情。"}, "id": "q26"}, {"no": 27, "pts": 3, "stem": "Vicky: Can you lend me your suit today? I have a job interview later.<br>Lily: I'd love to, but __________<br>Vicky: That's OK. Thanks anyway.", "options": ["it's yours", "take your time", "I have two of them", "I need it myself"], "ans": 3, "ex": {"clue": "婉拒對方：我自己也需要", "words": "lend v. 借出；job interview 工作面試", "grammar": "莉莉婉拒維琪並說明自己也需用西裝，故用 I need it myself.「我自己也需要它」。", "trans": "維琪：你今天能把西裝借我嗎？我稍後有工作面試。莉莉：我很想借你，但我也需要它。維琪：沒關係，還是謝謝你。"}, "id": "q27"}, {"no": 28, "pts": 3, "stem": "Kate: You shouldn't have made fun of Mia in that post. You really hurt her feelings.<br>Ted: It was a mistake. I'll take down the post. __________<br>Kate: Good, and I think you should also apologize to her in person.", "options": ["You're welcome.", "You are right.", "Nobody cares about it.", "That post is so popular."], "ans": 1, "ex": {"clue": "承認對方說得對", "words": "make fun of 取笑；take down 刪除；apologize to sb. in person 當面向某人道歉", "grammar": "泰德承認錯誤並認同凱特的看法，故用 You are right.「你說得對」。", "trans": "凱特：你不該在那則貼文取笑米亞，你真的傷了她的心。泰德：那是個錯誤，我會刪掉那則貼文，你說得對。凱特：很好，我覺得你也應該當面向她道歉。"}, "id": "q28"}]}, {"id": "s5", "type": "cloze", "title": "五、閱讀測驗", "subtitle": "閱讀下列短文，選出最適當的答案。（每題 3 分，共 18 分）", "points": 18, "passages": [{"title": "A", "text": "City University has posted the following announcement on its official website.<br><br><b>Ask a Lawyer</b><br><b>What Should I Do If I Get into Legal Trouble?</b><br>Monday, Nov. 23 | 7:00 PM ~ 9:00 PM<br>Student Activity Center, 2F Assembly Hall<br><br>Dr. Carrie Wu, a successful lawyer and an alumnus（校友）of our school's Department of Law, will join us to discuss legal problems students may face and offer practical legal advice.<br><br>Bring your questions or concerns, and find out what to do.<br><br>Only 100 spots are available. Sign up before Nov. 16.<br><br>For more details, please visit our social media page.<br><br>The Law Student Association", "questions": [{"no": 29, "pts": 3, "stem": "Which people are most likely to attend this activity?", "options": ["Parents and children.", "University students.", "Lawyers.", "Salespeople."], "ans": 1, "ex": {"clue": "活動在校園舉辦，對象為大學生", "words": "attend v. 參加；activity n. 活動；announcement n. 公告", "grammar": "公告張貼於大學官網，且內容是討論學生可能面對的法律問題，故最可能參加的是大學生。", "trans": "最可能參加這項活動的是大學生。"}, "id": "q29"}, {"no": 30, "pts": 3, "stem": "Who is most likely to sign up for the activity?", "options": ["Bob, who wants to know how to ask a girl out.", "Mandy, who cares about sea animals.", "Leslie, who has some questions about the history of movies.", "Oliver, who wants to know what to do if someone refuses to pay him back."], "ans": 3, "ex": {"clue": "活動主題為法律問題", "words": "sign up 報名；pay sb. back 還錢給某人", "grammar": "歐利佛想知道別人欠錢不還該如何處理，符合「法律問題」的主題，故最可能報名。", "trans": "最可能報名這項活動的是歐利佛，他想知道別人欠錢不還該怎麼處理。"}, "id": "q30"}, {"no": 31, "pts": 3, "stem": "According to the information above, which statement is true?", "options": ["This activity will take place in the morning.", "There is no limit on the number of participants（參加者）.", "Dr. Carrie Wu studied at City University before.", "This activity was arranged by Carrie Wu's law office."], "ans": 2, "ex": {"clue": "她是本校法律系校友", "words": "alumnus n. 校友；take place 舉行", "grammar": "公告說明她是本校法律系校友（an alumnus of our school's Department of Law），故 (C) 正確。", "trans": "根據上文，吳凱莉博士曾就讀於城市大學（本校法律系校友）。"}, "id": "q31"}]}, {"title": "B", "text": "Using credit cards has become a common way to pay for things, especially online shopping. With a credit card, people can buy what they need quickly and easily without carrying cash.<br><br>However, a credit card is not free money. When people use a credit card, they are actually borrowing money from the bank. If they pay the full amount on time, they usually do not have to pay extra fees. But if they only pay part of the bill, the bank will charge interest（利息）. Credit card interest is much higher than a normal bank loan（貸款）. That means a small debt can quickly grow into a heavy mountain that is impossible to move.<br><br>For this reason, smart users should treat their credit cards like cash, only buying what they can actually afford so that they can enjoy the convenience without the cost. Always remember: plan your spending, and never let the bank's interest control your future.", "questions": [{"no": 32, "pts": 3, "stem": "What does the author say about using a credit card?", "options": ["Credit cards are useful but must be used carefully.", "Credit cards are the best way to borrow money from banks.", "Credit cards always lead to high interest and debt.", "Using credit cards is safer than paying with cash."], "ans": 0, "ex": {"clue": "信用卡方便但須謹慎使用", "words": "credit card 信用卡；convenience n. 便利；afford v. 負擔得起", "grammar": "作者肯定信用卡的便利，同時提醒要像對待現金一樣謹慎使用，故 (A) 正確。", "trans": "作者認為信用卡很好用，但必須謹慎使用。"}, "id": "q32"}, {"no": 33, "pts": 3, "stem": "When is credit card interest charged?", "options": ["It is charged when users don't use a credit card for too long.", "It is charged when users get a loan from the bank.", "It is charged when users don't pay their full bill on time.", "It is charged when a credit card is stolen or lost."], "ans": 2, "ex": {"clue": "只付部分帳單才收取利息", "words": "charge interest 收取利息；bill n. 帳單；on time 準時", "grammar": "文中說若只支付部分帳單，銀行就會收取利息，故 (C) 正確。", "trans": "當持卡人沒有準時付清全額帳單時，銀行才會收取利息。"}, "id": "q33"}, {"no": 34, "pts": 3, "stem": "What do the two words “they” refer to in the last paragraph?", "options": ["Users.", "Credit cards.", "Things.", "Cash and credit cards."], "ans": 0, "ex": {"clue": "they 指「使用者」", "words": "refer to 指的是；smart users 明智的使用者", "grammar": "最後一段「smart users should treat their credit cards like cash, only buying what they can actually afford」中，they 指 users（使用者）。", "trans": "最後一段中的 they 指的是「（信用卡的）使用者」。"}, "id": "q34"}]}]}, {"id": "s6", "type": "fill", "title": "六、填充", "subtitle": "依提示字母填入適當的字彙，以完成句子。（每格 2 分，共 8 分）", "points": 8, "questions": [{"no": 35, "pts": 2, "cn": "我手機螢幕裂了，要花一大筆錢送修。", "en": "My phone screen is cracked, and it will ((0)) a ((1)) to get it fixed.", "blanks": [{"label": "(c)(t)", "ans": "cost", "accept": ["cost"]}, {"label": "(f)(e)", "ans": "fortune", "accept": ["fortune"]}], "ex": {"clue": "c…t f…e（花費；一大筆錢）", "words": "cost v. 花費；a fortune 一大筆錢；get sth. fixed 把某物修理好", "grammar": "will 後接原形動詞 cost；a fortune「一大筆錢」，表示花費龐大。", "trans": "我的手機螢幕裂了，要花一大筆錢才能修好。"}, "id": "q35"}, {"no": 36, "pts": 2, "cn": "我做午餐時不小心切到手指。", "en": "I cut my finger ((0)) ((1)) when I was cooking my lunch.", "blanks": [{"label": "(b)(y)", "ans": "by", "accept": ["by"]}, {"label": "(a)(t)", "ans": "accident", "accept": ["accident"]}], "ex": {"clue": "b…y a…t（不小心地）", "words": "by accident 不小心地；cook my lunch 做我的午餐", "grammar": "by accident「意外地、不小心地」為固定片語；when 引導時間副詞子句。", "trans": "我做午餐時不小心切到手指。"}, "id": "q36"}]}, {"id": "s7", "type": "sentence", "title": "七、句型練習", "subtitle": "將所給的字詞重組成完整句子，或依提示合併句子。（第 37.～38. 題每題 4 分，第 39. 題 5 分，共 13 分）", "points": 13, "questions": [{"no": 37, "pts": 4, "task": "Helen / whether / she should / go to the party or not / is considering", "answer": "Helen is considering whether she should go to the party or not.", "accept": ["Helen is considering whether she should go to the party or not", "helen is considering whether she should go to the party or not"], "ex": {"clue": "consider + whether 子句「考慮是否……」", "words": "whether…or not 是否；consider v. 考慮", "grammar": "consider 之後接「whether + S + V + or not」的間接問句語序，表達「考慮是否要……」。", "trans": "海倫正在考慮她是否應該去參加派對。"}, "id": "q37"}, {"no": 38, "pts": 4, "task": "the office / bright and large / white, / looks / Painted", "answer": "Painted white, the office looks bright and large.", "accept": ["Painted white, the office looks bright and large", "painted white the office looks bright and large"], "ex": {"clue": "分詞構句：被動動作用過去分詞 Painted", "words": "paint v. 油漆；塗；bright and large 明亮又寬敞", "grammar": "S + V…, Vpp 分詞構句；office 是「被漆成白色」，為被動動作，故用過去分詞 Painted 開頭。", "trans": "被漆成白色後，辦公室看起來明亮又寬敞。"}, "id": "q38"}, {"no": 39, "pts": 5, "task": "Mary left the window open. / The room wouldn't get too hot.（用 so that 合併）", "answer": "Mary left the window open so that the room wouldn't get too hot.", "accept": ["Mary left the window open so that the room wouldn't get too hot", "mary left the window open so that the room wouldn't get too hot", "Mary left the window open so that the room would not get too hot", "Mary left the window open so that the room wouldn't become too hot"], "ex": {"clue": "so that 以便；為了", "words": "so that 以便；為了；get too hot 變得太熱", "grammar": "so that 引導目的子句「以便、為了」；合併時將 so that 置於兩句之間。", "trans": "瑪麗讓窗戶開著，這樣房間才不會變得太熱。"}, "id": "q39"}]}]};

var NORM_RE = /[\s\.,，。;；:：!！?？"'“”‘’（）()\[\]【】\-、_]/g;
function norm(s){return (s==null?"":String(s)).toLowerCase().replace(NORM_RE,"");}
function hasAny(user, arr){
  var u = norm(user);
  return arr.some(function(a){ return u === norm(a); });
}

var score = 0, total = 0;
var results = {};   // qid -> {ok:true/false, pts:n}   (fill -> {blanks:[bool]})

function el(tag, cls, html){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html != null) e.innerHTML = html;
  return e;
}

function exBlock(cls, title, text){
  var b = el("div", "ex-block " + cls);
  var h = el("h4", null, title);
  var p = el("p", null, text || "—");
  b.appendChild(h); b.appendChild(p);
  return b;
}

function exPanel(q, openAll){
  var ex = el("div", "ex" + (openAll ? " show" : ""));
  var grid = el("div", "ex-grid");
  grid.appendChild(exBlock("clue", "解題線索", q.ex.clue));
  grid.appendChild(exBlock("words", "重要字詞", q.ex.words));
  grid.appendChild(exBlock("grammar", "文法句型", q.ex.grammar));
  grid.appendChild(exBlock("trans", "中文翻譯", q.ex.trans));
  ex.appendChild(grid);
  var tg = el("button", "toggle-ex", "查看詳解 ▾");
  tg.onclick = function(){ ex.classList.toggle("show"); tg.textContent = ex.classList.contains("show") ? "收合詳解 ▴" : "查看詳解 ▾"; };
  ex.appendChild(tg);
  return ex;
}

function resultBox(){
  var r = el("div", "qresult");
  return r;
}
function showResult(qEl, rbox, ok, msg){
  rbox.className = "qresult show " + (ok ? "good" : "bad");
  rbox.innerHTML = msg;
}

function showInfo(rbox, msg){
  rbox.className = "qresult show info";
  rbox.innerHTML = msg;
}

function speak(text){
  try{
    if(!text) return;
    if(typeof window === "undefined" || !window.speechSynthesis) return;
    var s = window.speechSynthesis;
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = "en-US";
    u.rate = 0.9;
    s.cancel();
    s.speak(u);
    // Chrome/Edge workaround: wake the engine with pause()/resume()
    try{
      if(!s.paused){
        s.pause();
        s.resume();
      }
    }catch(e2){}
  }catch(e){}
}

function fullSentence(q){
  if(q.speakText) return q.speakText;
  if(q.en){
    return q.en.replace(/\(\((\d+)\)\)/g, function(m, n){ return (q.blanks[+n] || {}).ans || ""; });
  }
  if(q.sent){
    var s = String(q.sent).replace(/<span class='hint'>[^<]*<\/span>/g, q.answer || "");
    return s.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  }
  return String(q.stem || "").replace(/_{3,}/g, q.answer || (q.options ? q.options[q.ans] : "") || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
}

function sentenceWithBlank(text, no, ans){
  var t = String(text || "").replace(/<[^>]+>/g, " ");
  var m = t.match(new RegExp("\\S[^.!?]*?__" + no + "__[^.!?]*(?:[.!?]|$)"));
  if(!m) return "";
  var parts = String(ans || "").split("\u2026");
  var i = 0;
  var out = m[0].replace(new RegExp("__" + no + "__", "g"), function(){
    var v = parts.length > 1 ? (parts[i] || "") : (ans || "");
    i++;
    return v.trim();
  });
  return out.replace(/\s+/g, " ").replace(/^[\s.,;:!?]+/, "").trim();
}

function splitSents(text){
  var t = String(text || "");
  var chunks = [];
  var re = /[^.!?]+(?:[.!?]+|$)/g;
  var m;
  while((m = re.exec(t))){
    var c = m[0].trim();
    var bare = c.replace(/<br\s*\/?>/gi, " ").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ");
    if(c && bare.trim()) chunks.push(c);
  }
  if(!chunks.length && t.trim()) chunks.push(t.trim());
  return chunks;
}

function highlightSentence(box, no){
  try{
    var card = box.parentElement || box.parent;
    if(!card) return;
    var target = null;
    [].forEach.call(card.querySelectorAll(".passage"), function(pa){
      if(!target) target = pa.querySelector("span[data-no=" + no + "]");
    });
    if(!target) return;
    [].forEach.call(card.querySelectorAll(".passage .sent"), function(s){ if(s.classList) s.classList.remove("hl"); });
    target.classList.add("hl");
    if(typeof target.scrollIntoView === "function") target.scrollIntoView({behavior:"smooth", block:"center"});
    if(typeof requestAnimationFrame === "function"){
      clearTimeout(target._hlTimer);
      target._hlTimer = setTimeout(function(){ target.classList.remove("hl"); }, 3600);
    }
  }catch(e){}
}

/* ---------- rendering ---------- */
function renderApp(){
  var app = document.getElementById("app");
  DATA.sections.forEach(function(sec){
    var card = el("section", "card");
    card.id = sec.id;
    var head = el("div", "sec-head");
    head.appendChild(el("h2", null, sec.title));
    head.appendChild(el("p", "sub", sec.subtitle));
    var ssc = el("span", "sec-score", "本節得分 <b id='ss-"+sec.id+"'>0</b> / <span>"+sec.points+"</span>");
    head.appendChild(ssc);
    card.appendChild(head);

    if(sec.type === "cloze"){
      sec.passages.forEach(function(pg){
        var pass = el("div", "passage");
        var pt = el("div", "ptitle", (sec.ptitle || "閱讀測驗 ") + pg.title);
        pass.appendChild(pt);
        var text = splitSents(pg.text).map(function(ch){
          var no = (ch.match(/__(\d+)__/) || [])[1];
          return "<span class='sent'" + (no ? " data-no='" + no + "'" : "") + ">" + ch.replace(/__(\d+)__/g, function(m, n){ return "<span class='bk'>（" + n + "）</span>"; }) + "</span>";
        }).join(" ");
        pass.appendChild(el("p", null, text));
        card.appendChild(pass);
        pg.questions.forEach(function(q){
          q.speakText = sentenceWithBlank(pg.text, q.no, q.options[q.ans]);
          card.appendChild(renderQ(sec, q));
        });
      });
    } else {
      sec.questions.forEach(function(q){ card.appendChild(renderQ(sec, q)); });
    }
    app.appendChild(card);
  });
  total = 0;
  DATA.sections.forEach(function(sec){
    total += sec.points;
  });
  document.getElementById("total").textContent = total;
  buildChips();
}

function renderQ(sec, q){
  q.type = q.type || sec.type; q.sec = sec.id; q.secTitle = sec.title;
  var box = el("div", "q");
  box.setAttribute("data-qid", q.id);
  var head = el("div", "qhead");
  head.appendChild(el("span", "qno", q.no + "."));
  var dispPts = q.pts * (q.blanks ? q.blanks.length : 1);
  head.appendChild(el("span", "qpts", dispPts + " 分"));
  box.appendChild(head);

  var body = el("div", "qbody");
  var ctrl = el("div", "qctrl");
  var rbox = resultBox();

  if(q.type === "choice" || q.type === "cloze"){
    body.appendChild(el("p", "qstem", q.stem));
    var opts = el("div", "opts");
    var selected = -1;
    q.options.forEach(function(opt, i){
      var o = el("div", "opt");
      o.innerHTML = "<span class='ol'>" + String.fromCharCode(65+i) + ".</span>" + opt;
      o.onclick = function(){
        if(box.dataset.graded === "1") return;
        Array.prototype.forEach.call(opts.children, function(c){ c.classList.remove("sel"); });
        o.classList.add("sel");
        selected = i;
      };
      opts.appendChild(o);
    });
    body.appendChild(opts);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      if(q.type === "cloze") highlightSentence(box, q.no);
      if(selected < 0){
        showInfo(rbox, "尚未選擇答案。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var ok = (selected === q.ans);
      markResult(box, rbox, q, ok);
      Array.prototype.forEach.call(opts.children, function(c, i){
        c.classList.remove("sel");
        if(i === q.ans) c.classList.add("correct");
        else if(i === selected && !ok) c.classList.add("wrong");
      });
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "vocab"){
    body.appendChild(el("p", "qstem", "請寫出「<b>" + q.answer + "</b>」的英文。"));
    var inp = el("input", "");
    inp.type = "text"; inp.placeholder = "輸入英文單字";
    body.appendChild(inp);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(q.word);
      var v = inp.value.trim();
      if(!v){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，作答後即可計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, [q.word].concat(q.accept_en || []));
      markResult(box, rbox, q, ok, q.word + "（" + q.answer + "）");
      if(ok){ inp.style.borderColor = "#2b8a3e"; } else { inp.style.borderColor = "#e03131"; }
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "word"){
    var sent = String(q.sent).replace(/<span class='hint'>([a-zA-Z]+)\s+([a-zA-Z]+)<\/span>/g, function(m, a, b){
      var missing = Math.max(1, (q.answer || "").length - a.length - b.length);
      return "<span class='hint'>" + a + "</span><span class='uhint'>" + new Array(missing + 1).join("_") + "</span><span class='hint'>" + b + "</span>";
    });
    body.appendChild(el("p", "qstem", sent));
    var inp = el("input", "");
    inp.type = "text"; inp.placeholder = "依提示字母填入單字";
    body.appendChild(inp);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      var v = inp.value.trim();
      if(!v){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，作答後即可計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, q.accept);
      markResult(box, rbox, q, ok);
      if(ok){ inp.style.borderColor = "#2b8a3e"; } else { inp.style.borderColor = "#e03131"; }
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "fill"){
    body.appendChild(el("p", "qstem", "【中文】" + q.cn));
    var sen = el("p", "qstem");
    var html = q.en.replace(/\(\((\d+)\)\)/g, function(m, n){
      var b = q.blanks[+n];
      var letters = [];
      var lm, lre = /\(([^)]+)\)/g;
      while((lm = lre.exec(b.label || ""))) letters.push(lm[1]);
      var fragA = letters[0] || "";
      var fragB = letters.length > 1 ? letters.slice(1).join("") : "";
      var missing = Math.max(1, (b.ans || "").length - fragA.length - fragB.length);
      var shown = fragA + new Array(missing + 1).join("_") + fragB;
      return ' <span class="bblank">' + shown + '</span> ';
    });
    sen.innerHTML = html;
    body.appendChild(sen);
    var abox = el("div", "fbox");
    q.blanks.forEach(function(b, n){
      var span = el("span", "lbl", "(" + (n + 1) + ")");
      var inp = el("input", "inline-in");
      inp.type = "text";
      inp.style.width = Math.min(220, Math.max(90, (b.ans || "").length * 12)) + "px";
      inp.setAttribute("data-blank", n);
      abox.appendChild(span); abox.appendChild(inp);
    });
    body.appendChild(abox);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      var ins = abox.querySelectorAll("input[data-blank]");
      var emptyAll = true;
      ins.forEach(function(ip){ if(String(ip.value || "").trim()) emptyAll = false; });
      if(emptyAll){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var oks = [];
      var all = true, any = false;
      ins.forEach(function(ip){
        var b = q.blanks[+ip.dataset.blank];
        var ok = hasAny(ip.value, b.accept);
        oks.push(ok); any = any || ok; if(!ok) all = false;
        ip.style.borderColor = ok ? "#2b8a3e" : "#e03131";
      });
      var nOk = oks.filter(Boolean).length;
      box.dataset.graded = "1";
      var pts = nOk * q.pts;
      var prev = results[q.id];
      if(prev){ score -= prev.pts; }
      results[q.id] = {ok: nOk === q.blanks.length, pts: pts};
      score += pts;
      updateScore();
      var msg = "答對 " + nOk + " / " + q.blanks.length + " 格，得 " + pts + " 分。";
      showResult(box, rbox, all, msg);
      expandEx(box);
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "sentence"){
    body.appendChild(el("p", "qstem", q.task));
    var ta = el("textarea", "");
    ta.placeholder = "請寫下你的句子";
    body.appendChild(ta);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(q.answer);
      var v = ta.value.trim();
      if(!v){
        showInfo(rbox, "尚未寫下句子。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, q.accept);
      markResult(box, rbox, q, ok);
      if(!ok){
        rbox.innerHTML = "尚未完全符合參考答案。請先參考下方「解題線索／文法句型」，再自行判斷是否答對。";
        var self = el("div", "qctrl");
        var y = el("button", "btn btn-ok", "我寫對了");
        var n = el("button", "btn btn-bad", "我寫錯了");
        y.onclick = function(){ markResult(box, rbox, q, true); self.remove(); };
        n.onclick = function(){ markResult(box, rbox, q, false); self.remove(); };
        self.appendChild(y); self.appendChild(n);
        rbox.appendChild(self);
      }
    };
    ctrl.appendChild(chk);
  }

  box.appendChild(body);
  box.appendChild(ctrl);
  box.appendChild(rbox);
  var ex = exPanel(q, false);
  box.appendChild(ex);
  return box;
}

function markResult(box, rbox, q, ok, ansText){
  box.dataset.graded = "1";
  var prev = results[q.id];
  if(prev){ score -= prev.pts; }
  results[q.id] = {ok: ok, pts: ok ? q.pts : 0};
  score += ok ? q.pts : 0;
  updateScore();
  if(ok){
    showResult(box, rbox, true, "答對了！得 " + q.pts + " 分。");
  } else {
    showResult(box, rbox, false, "答錯了。正確答案：" + (ansText || q.answer));
  }
  var chip = document.getElementById("chip-" + q.sec);
  if(chip){
    chip.textContent = q.secTitle + " " + sectionScore(q.sec) + "/" + sectionPoints(q.sec);
  }
  expandEx(box);
}

function expandEx(box){
  var ex = box.querySelector(".ex");
  var tg = box.querySelector(".toggle-ex");
  if(ex && !ex.classList.contains("show")){ ex.classList.add("show"); }
  if(tg){ tg.textContent = "收合詳解 ▴"; }
}

function sectionPoints(secId){
  var s = DATA.sections.filter(function(x){return x.id===secId;})[0];
  return s ? s.points : 0;
}
function sectionScore(secId){
  var tot = 0;
  Object.keys(results).forEach(function(k){
    var r = results[k];
    var q = questionById(k);
    if(q && q.sec === secId) tot += r.pts;
  });
  return tot;
}
function questionById(qid){
  var found = null;
  DATA.sections.forEach(function(sec){
    var list = [];
    if(sec.type === "cloze"){ sec.passages.forEach(function(p){ list = list.concat(p.questions); }); }
    else { list = sec.questions; }
    list.forEach(function(q){ if(q.id === qid){ found = q; } });
  });
  return found;
}

function updateScore(){
  document.getElementById("score").textContent = score;
  var p = total ? Math.round(score / total * 100) : 0;
  document.getElementById("pbar").style.width = p + "%";
  DATA.sections.forEach(function(sec){
    var s = document.getElementById("ss-" + sec.id);
    if(s) s.textContent = sectionScore(sec.id);
  });
}

function buildChips(){
  var c = document.getElementById("secchips");
  c.innerHTML = "";
  DATA.sections.forEach(function(sec){
    var ch = el("button", "chip", sec.title + " 0/" + sec.points);
    ch.type = "button";
    ch.id = "chip-" + sec.id;
    ch.onclick = function(){
      var el = document.getElementById(sec.id);
      if(el) el.scrollIntoView({behavior: "smooth", block: "start"});
    };
    c.appendChild(ch);
  });
  updateChipActive();
}

function updateChipActive(){
  var mark = null;
  DATA.sections.forEach(function(sec){
    var el = document.getElementById(sec.id);
    var ch = document.getElementById("chip-" + sec.id);
    if(!el || !ch) return;
    var r = el.getBoundingClientRect();
    if(r.top <= 170) mark = ch;
  });
  document.querySelectorAll("#secchips .chip").forEach(function(ch){
    if(ch === mark) ch.classList.add("on");
    else ch.classList.remove("on");
  });
}
if(typeof window !== "undefined"){
  window.addEventListener("scroll", updateChipActive, {passive: true});
}

function revealAll(){
  document.querySelectorAll("#app .q").forEach(function(box){
    var q = questionById(box.dataset.qid);
    if(!q) return;
    var ex = box.querySelector(".ex");
    if(ex) ex.classList.add("show");
    var ins = box.querySelectorAll("input[type=text],textarea");
    if(q.type === "vocab"){
      if(ins[0]) ins[0].value = q.word;
    } else if(q.type === "word"){
      if(ins[0]) ins[0].value = q.answer;
    } else if(q.type === "fill"){
      box.querySelectorAll("input[data-blank]").forEach(function(ip){
        ip.value = q.blanks[+ip.dataset.blank].ans;
      });
    } else if(q.type === "sentence"){
      if(ins[0]) ins[0].value = q.answer;
    } else if(q.type === "choice" || q.type === "cloze"){
      box.querySelectorAll(".opt").forEach(function(o, i){
        if(i === q.ans) o.classList.add("correct");
      });
    }
  });
  var tgs = document.querySelectorAll(".toggle-ex");
  tgs.forEach(function(t){ t.textContent = "收合詳解 ▴"; });
}

function resetAll(){
  score = 0; results = {};
  document.querySelectorAll("#app .q").forEach(function(box){
    box.dataset.graded = "";
    box.querySelectorAll("input[type=text],textarea").forEach(function(i){ i.value=""; i.style.borderColor=""; });
    box.querySelectorAll(".opt").forEach(function(o){ o.className="opt"; });
    var r = box.querySelector(".qresult");
    if(r){ r.className="qresult"; r.innerHTML=""; }
    var ex = box.querySelector(".ex");
    if(ex) ex.classList.remove("show");
  });
  document.querySelectorAll(".toggle-ex").forEach(function(t){ t.textContent = "查看詳解 ▾"; });
  updateScore();
  buildChips();
}

document.getElementById("reset").onclick = resetAll;
document.getElementById("revealAll").onclick = revealAll;
renderApp();
updateScore();
</script>
