<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask a Lawyer | 進階評量（115上技高英文 Choice 版三）</title>
<style>
:root{
  --ink:#1f2430; --muted:#6b7280; --line:#e5e7eb; --bg:#f4f6fb;
  --card:#ffffff; --accent:#3b5bdb; --accent2:#0ca678; --warn:#f59f00;
  --ok:#2b8a3e; --bad:#e03131; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#4a148c,#9c27b0);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.top .wrap{padding-top:14px;padding-bottom:14px}
.top h1{margin:0;font-size:22px;letter-spacing:.5px}
.top .zh{margin:2px 0 10px;font-size:13px;opacity:.9}
.badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:1px 12px;font-size:12px;margin-bottom:6px}
.scorebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.score{background:rgba(255,255,255,.14);border-radius:10px;padding:6px 14px;font-size:14px}
.score b{font-size:20px;color:#ffe066}
.progress{flex:1 1 120px;height:10px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
#pbar{height:100%;width:0%;background:#ffe066;border-radius:999px;transition:width .3s}
.sb-btn{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer}
.sb-btn:hover{background:rgba(255,255,255,.15)}
.secchips{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;border:none;color:#fff;cursor:pointer;font-family:inherit;transition:.15s}
.chip:hover{background:rgba(255,255,255,.26)}
.chip.on{background:rgba(255,255,255,.4);box-shadow:0 0 0 1px rgba(255,255,255,.65) inset}
.chip.ok{background:rgba(46,204,113,.35)}
main.wrap{padding-top:20px;padding-bottom:40px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px;box-shadow:0 1px 4px rgba(16,24,40,.05);overflow:hidden}
.sec-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;background:#fafbff}
.sec-head h2{margin:0;font-size:17px;color:#253073}
.sec-head .sub{margin:0;font-size:12.5px;color:var(--muted)}
.sec-head .sec-score{margin-left:auto;font-size:13px;color:#253073;font-weight:600}
.passage{margin:14px 18px 0;padding:14px 16px;background:#f8f9ff;border:1px solid #dbe1ff;border-radius:10px;font-size:15px}
.passage .ptitle{font-weight:700;color:#3b5bdb;margin-bottom:6px}
.bk{display:inline-block;background:#3b5bdb;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;margin:0 2px;vertical-align:middle}
.bk-link{cursor:pointer;transition:.15s}
.bk-link:hover{background:#0ca678;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.q.jump-hl{animation:jumpflash 1.5s ease}
@keyframes jumpflash{0%{background:#fff9db}55%{background:#fff9db}100%{background:transparent}}
.sent{transition:background .3s,box-shadow .3s}
.sent.hl{background:#fff3bf;border-radius:6px;box-shadow:0 0 0 3px #ffe066;scroll-margin-top:170px}
.q{padding:16px 18px;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:none}
.card{scroll-margin-top:170px}
.qhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.qno{font-weight:700;color:#3b5bdb}
.qpts{margin-left:auto;font-size:12px;color:var(--muted);background:#eef1ff;border-radius:6px;padding:0 8px}
.qstem{font-size:15.5px;margin:4px 0}
.qstem .hint{color:var(--warn);font-weight:600}
.qstem.refsent{background:#f8f9ff;border:1px dashed #c7cff5;border-radius:8px;padding:8px 10px;margin:4px 0 8px}
.qstem.refsent .ctx-prev{display:block;color:#64748b;font-size:13.5px;margin-bottom:2px}
.qstem.refsent .ctx-prev:before{content:"前一句：";color:#3b5bdb;font-weight:700;font-size:12.5px;margin-right:6px}
.qstem.refsent .ctx-cur{display:block}
.qstem.refsent .ctx-cur:before{content:"該格句子：";color:#3b5bdb;font-weight:700;font-size:12.5px;margin-right:6px}
.uhint,.bblank{color:#94a3b8;font-family:monospace;letter-spacing:.5px;font-weight:600}
.bblank{color:#64748b}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;font-size:14.5px;user-select:none;transition:.12s}
.opt:hover{border-color:#aab4f0;background:#f4f6ff}
.opt .ol{display:inline-block;width:22px;color:#6b7280;font-weight:700}
.opt.sel{border-color:var(--accent);background:#e9edff;box-shadow:0 0 0 1px var(--accent) inset}
.opt.correct{border-color:var(--ok);background:#e6f7ec}
.opt.wrong{border-color:var(--bad);background:#fdecec}
.fbox{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fbox .lbl{font-weight:700;color:#6b7280;font-size:13px}
input[type=text],textarea{border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14.5px;font-family:inherit;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,91,219,.12)}
textarea{width:100%;min-height:64px;resize:vertical}
.inline-in{margin:0 4px;vertical-align:middle}
.fbl{display:inline-block;background:#fff3bf;color:#9a7b00;font-weight:700;font-size:11px;border-radius:5px;padding:0 6px;margin:0 2px;vertical-align:middle}
.qctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button.btn{border:none;border-radius:8px;padding:7px 16px;font-size:13.5px;cursor:pointer;font-family:inherit}
.btn-check{background:var(--accent);color:#fff}
.btn-check:hover{background:#2f4bc0}
.btn-ghost{background:#eef1f6;color:#374151}
.btn-ghost:hover{background:#e2e7f0}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:var(--bad);color:#fff}
.qresult{display:none;margin-top:10px;padding:10px 14px;border-radius:9px;font-size:14px}
.qresult.show{display:block}
.qresult.good{background:#e9f9f0;border:1px solid #b7e6c8;color:#1c6b32}
.qresult.bad{background:#fdeeee;border:1px solid #f3c1c1;color:#9c2222}
.qresult.info{background:#eef4ff;border:1px solid #c6d8ff;color:#2f4bc0}
.toggle-ex{margin-top:10px;border:1px solid #aab4f0;background:#eef1ff;color:#3b5bdb;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;padding:5px 14px;transition:.12s}
.toggle-ex:hover{background:#e2e8ff;border-color:#8f9cf0}
.ex{display:none;margin-top:10px}
.ex.show{display:block}
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex-block{border-radius:9px;padding:10px 12px;font-size:13.5px;border:1px solid var(--line)}
.ex-block h4{margin:0 0 4px;font-size:13px;color:#253073}
.ex-block p{margin:0}
.ex-block.ans{grid-column:1/-1;border-left:4px solid #2b8a3e;background:#f0fbf3}
.ex-block.clue{border-left:4px solid var(--warn);background:#fffbf0}
.ex-block.opts{border-left:4px solid #0ca678;background:#f3fbf7}
.ex-block.why{border-left:4px solid #e8590c;background:#fff7f0}
.ex-block.words{border-left:4px solid var(--accent);background:#f4f6ff}
.ex-block.grammar{border-left:4px solid var(--accent2);background:#f0fbf6}
.ex-block.trans{border-left:4px solid #be4bdb;background:#fcf5ff}
@media (max-width:600px){.ex-grid{grid-template-columns:1fr}}
footer.wrap{padding-bottom:30px;color:var(--muted);font-size:12px}
.speech-note{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;max-width:88vw;background:#1f2430;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.35);text-align:center;line-height:1.5}
</style>
</head>

  <div class="wrap">
    <span class="badge">Lesson 4｜115上 技高英文 Choice 版（三）進階評量</span>

</header>

"use strict";
var DATA = {"num": 4, "en": "Ask a Lawyer", "zh": "進階評量｜第 4 課", "sections": [{"id": "s1", "type": "word", "title": "一、文意字彙", "subtitle": "1.～6. 題，填入適當的字彙，以完成該句。7.～8. 題，選出適當的字彙，以完成該句。9.～10. 題，選出與句中畫底線的字意思最接近的答案。（每題 2 分，共 20 分）", "points": 20, "questions": [{"no": 1, "pts": 2, "type": "word", "sent": "The old woman <span class='hint'>p d</span> her grandson on the back and whispered something softly to him.", "answer": "patted", "accept": ["patted", "pat"], "ex": {"clue": "p…d（輕拍）", "words": "pat v. 輕拍；whisper v. 低語", "grammar": "pat sb. on the back「拍拍某人的背」；and 連接 pat 與 whisper 兩個過去式動詞。", "trans": "老婦人輕拍孫子的背，對他輕聲說了些話。"}, "id": "q1"}, {"no": 2, "pts": 2, "type": "word", "sent": "Even though there was only a small chance of winning the contest, Freya <span class='hint'>r d</span> to give up.", "answer": "refused", "accept": ["refused", "refuse"], "ex": {"clue": "r…d（拒絕）", "words": "refuse v. 拒絕；give up 放棄", "grammar": "refuse to + 原形動詞「拒絕做……」；even though「即使、雖然」引導讓步副詞子句。", "trans": "儘管贏得比賽的機會渺茫，芙蕾雅仍拒絕放棄。"}, "id": "q2"}, {"no": 3, "pts": 2, "type": "word", "sent": "Kevin often does weight training to build up his <span class='hint'>p l</span> strength and muscles.", "answer": "physical", "accept": ["physical"], "ex": {"clue": "p…l（身體的）", "words": "physical adj. 身體的；體力的；muscle n. 肌肉", "grammar": "physical strength「體力」；build up「增強、鍛鍊」；to + 原形動詞表目的。", "trans": "凱文常做重量訓練來增強體力和肌肉。"}, "id": "q3"}, {"no": 4, "pts": 2, "type": "word", "sent": "Someone entered the science lab without <span class='hint'>p n</span> and broke a piece of equipment.", "answer": "permission", "accept": ["permission"], "ex": {"clue": "without p…n（未經允許）", "words": "permission n. 允許；許可；equipment n. 設備", "grammar": "without + 名詞「沒有……、未經……」；enter「進入」為及物動詞，後直接接受詞。", "trans": "有人未經允許進入科學實驗室，弄壞了一件設備。"}, "id": "q4"}, {"no": 5, "pts": 2, "type": "word", "sent": "More people have become <span class='hint'>a e</span> of the importance of public health as the disease spreads.", "answer": "aware", "accept": ["aware"], "ex": {"clue": "become a…e of（意識到）", "words": "aware adj. 意識到的；become aware of 意識到", "grammar": "become aware of + 名詞「意識到……」；as 在此表「隨著、當……時」。", "trans": "隨著疾病蔓延，越來越多人意識到公共衛生的重要性。"}, "id": "q5"}, {"no": 6, "pts": 2, "type": "word", "sent": "Clive <span class='hint'>a d</span> to his daughter for forgetting her birthday and promised to make it up to her.", "answer": "apologized", "accept": ["apologized", "apologize"], "ex": {"clue": "a…d to sb. for sth.（因某事向某人道歉）", "words": "apologize v. 道歉；make it up to sb. 補償某人", "grammar": "apologize to sb. for sth.「因某事向某人道歉」；promise to + V「承諾做……」；make it up to sb.「補償某人」。", "trans": "克萊夫因忘記女兒的生日而向她道歉，並承諾會補償她。"}, "id": "q6"}, {"no": 7, "pts": 2, "type": "choice", "stem": "Rufus did not mean to hurt the girl's feelings, but she still regarded his comment as a(n) ______.", "options": ["apology", "record", "insult", "gender"], "ans": 2, "ex": {"clue": "傷人的話＝侮辱", "words": "insult n. 侮辱；regard…as… 把……視為……", "grammar": "regard A as B「把 A 視為 B」；mean to + V「故意、存心做……」；空格填 insult「侮辱」符合文意。", "trans": "魯佛斯無意傷害那女孩的感受，但她仍把他的話視為一種侮辱。", "opts_trans": ["道歉", "紀錄；唱片", "侮辱；辱罵", "性別"], "why": "前句說他「無意傷害她的感受」，但女孩仍把話當成「侮辱」，故空格填 insult；apology（道歉）、record（紀錄）、gender（性別）皆與傷人話語的語境不符。"}, "id": "q7"}, {"no": 8, "pts": 2, "type": "choice", "stem": "Although the police thought the man was the thief, there was no evidence（證據）to prove him ______.", "options": ["legal", "guilty", "scared", "reliable"], "ans": 1, "ex": {"clue": "prove sb. guilty 證明某人有罪", "words": "guilty adj. 有罪的；evidence n. 證據", "grammar": "prove + O + 形容詞「證明某人／某物……」；prove him guilty「證明他有罪」。", "trans": "雖然警方認為這名男子是小偷，但沒有證據證明他有罪。", "opts_trans": ["合法的", "有罪的", "害怕的", "可靠的"], "why": "警方認為他是小偷，卻沒有證據「證明他有罪」，prove him guilty 為固定用法；legal（合法）、scared（害怕）、reliable（可靠）皆無法表達「有罪」。"}, "id": "q8"}, {"no": 9, "pts": 2, "type": "choice", "stem": "The rights of minorities are a social issue that has received lots of attention recently.", "options": ["tribe", "problem", "income", "tool"], "ans": 1, "ex": {"clue": "issue＝議題；問題", "words": "issue n. 議題；問題；minority n. 少數群體", "grammar": "issue（議題；問題）的意思最接近 problem（問題）。", "trans": "少數群體的權利是近來備受關注的社會議題。", "opts_trans": ["部落", "問題", "收入", "工具"], "why": "畫底線的 issue（議題；問題）語意最接近 problem（問題），故選 problem；tribe（部落）、income（收入）、tool（工具）皆無「問題」之意。"}, "id": "q9"}, {"no": 10, "pts": 2, "type": "choice", "stem": "Sienna is trying to remove the spots from her skirt by brushing it hard.", "options": ["take away", "rely on", "come up with", "watch out for"], "ans": 0, "ex": {"clue": "remove＝去除", "words": "remove v. 移除；spot n. 污漬", "grammar": "remove（去除）的意思最接近 take away（拿掉、去除）。", "trans": "席安娜正努力用力刷洗裙子上的污漬。", "opts_trans": ["拿走；去除", "依賴；依靠", "想出；提出", "小心；提防"], "why": "畫底線的 remove（去除）語意最接近 take away（拿走、去除），故選 (A)；rely on（依賴）、come up with（想出）、watch out for（小心）皆無「去除」之意。"}, "id": "q10"}]}, {"id": "s2", "type": "choice", "title": "二、語法測驗", "subtitle": "選出一個最適當的答案。（每題 2 分，共 16 分）", "points": 16, "questions": [{"no": 11, "pts": 2, "stem": "I think I met that girl before, but I don't remember ______ she is.", "options": ["when", "who", "which", "why"], "ans": 1, "ex": {"clue": "間接問句：不記得她是「誰」", "words": "remember v. 記得；間接問句 indirect question", "grammar": "此為疑問詞 who 引導的間接問句，語序為疑問詞 + S + V：who she is，表示不記得那個女孩是「誰」。", "trans": "我想我以前見過那個女孩，但我不記得她是誰。", "opts_trans": ["何時", "誰", "哪一個", "為什麼"], "why": "句意為不記得那個女孩是「誰」，疑問詞 who 引導間接問句並作主詞補語；when（何時）、which（哪一個）、why（為什麼）皆無法指稱「人」。"}, "id": "q11"}, {"no": 12, "pts": 2, "stem": "Wanda added some spices to the fried noodles ______ they would taste better.", "options": ["while", "as soon as", "that", "so that"], "ans": 3, "ex": {"clue": "so that 表目的", "words": "spice n. 香料；fried noodles 炒麵", "grammar": "後面子句說明前面動作的目的，故用 so that「以便、為了」連接兩個子句。", "trans": "汪達在炒麵裡加了香料，好讓它們更好吃。", "opts_trans": ["當……的時候；然而", "一……就……", "引導名詞子句（無義）", "以便；為了"], "why": "後面子句說明加香料的目的，故用 so that 引導表目的的副詞子句；while（當……時）、as soon as（一……就）、that（無義）皆無法表達「以便」。"}, "id": "q12"}, {"no": 13, "pts": 2, "stem": "We all wonder ______ Griffin shot every balloon so accurately.", "options": ["how", "where", "what", "which"], "ans": 0, "ex": {"clue": "間接問句：想知道「怎麼」射中", "words": "wonder v. 想知道；accurately adv. 準確地", "grammar": "疑問詞 how「如何」引導間接問句，語序為 how + S + V：how Griffin shot every balloon。", "trans": "我們都想知道格里芬是怎麼那麼準確地射中每個氣球的。", "opts_trans": ["如何；怎麼", "哪裡", "什麼", "哪一個"], "why": "句意為想知道「怎麼」能射得那麼準，疑問詞 how 引導間接問句修飾動詞 shot；where（哪裡）、what（什麼）、which（哪一個）皆無法說明方式。"}, "id": "q13"}, {"no": 14, "pts": 2, "stem": "Here ______ three styles of curtains for you to choose from.", "options": ["are", "is", "have", "has"], "ans": 0, "ex": {"clue": "Here + be + S 地方副詞倒裝句", "words": "curtain n. 窗簾；style n. 款式", "grammar": "Here + be + S 為地方副詞提前的倒裝句型，表達「這裡有……」；be 動詞單複數依主詞 three styles 而定，故用 are。", "trans": "這裡有三種款式的窗簾供你選擇。", "opts_trans": ["是（be 動詞，複數）", "是（be 動詞，單數）", "有（原形）", "有（第三人稱單數）"], "why": "Here + be + S 為地方副詞提前的倒裝句，主詞 three styles 為複數，故 be 動詞用 are；is 用於單數主詞，have／has 不適用此倒裝句型。"}, "id": "q14"}, {"no": 15, "pts": 2, "stem": "Do you know where ______ a drugstore around here? I need to get some vitamin pills.", "options": ["can find", "can I find", "could I find", "I can find"], "ans": 3, "ex": {"clue": "間接問句：wh- + S + V 語序", "words": "drugstore n. 藥妝店；vitamin pill 維生素片", "grammar": "疑問詞 where 引導間接問句時，子句須用敘述句語序 wh- + S + V，故為 where I can find…。", "trans": "你知道這附近哪裡可以找到藥妝店嗎？我需要買一些維生素片。", "opts_trans": ["能找到（缺主詞）", "我能找到嗎（疑問語序）", "我能找到嗎（疑問語序）", "我能找到（敘述語序）"], "why": "where 引導的間接問句須用敘述句語序 wh- + S + V，故用 where I can find；can I find、could I find 為直接問句語序，can find 缺主詞，皆不合。"}, "id": "q15"}, {"no": 16, "pts": 2, "stem": "The hike was much harder than we expected due to ______ such heavy backpacks.", "options": ["we carried", "carrying", "carry", "carried"], "ans": 1, "ex": {"clue": "due to + 名詞／動名詞", "words": "hike n. 健行；backpack n. 背包", "grammar": "due to「由於」後接名詞或動名詞，故空格用動名詞 carrying。", "trans": "因為背著那麼重的背包，這次健行比我們預期的困難許多。", "opts_trans": ["我們背著（子句）", "背著（動名詞）", "背（原形動詞）", "背（過去式／過去分詞）"], "why": "due to「由於」後須接名詞或動名詞，故用動名詞 carrying；we carried 為完整子句，carry、carried 皆無法直接置於 due to 之後。"}, "id": "q16"}, {"no": 17, "pts": 2, "stem": "Colin's friends were amazed when they saw ______ back from Mexico.", "options": ["he brought what", "what did he bring", "what he brought", "what did bring"], "ans": 2, "ex": {"clue": "間接問句：what + S + V", "words": "amazed adj. 感到驚奇的；bring back 帶回", "grammar": "疑問詞 what 引導間接問句作 saw 的受詞，語序為 what + S + V：what he brought back from Mexico。", "trans": "當柯林的朋友們看到他從墨西哥帶回來的東西時，都非常驚奇。", "opts_trans": ["他帶回了什麼（語序錯誤）", "他帶回了什麼（直接問句語序）", "他所帶回的（敘述語序）", "帶回了什麼（缺主詞）"], "why": "saw 之後的間接問句須用 what + S + V 的敘述語序，故用 what he brought；what did he bring 為直接問句語序，he brought what 與 what did bring 語法錯誤。"}, "id": "q17"}, {"no": 18, "pts": 2, "stem": "The hotel is very popular, so I think you'd better ______ a room at least three months before going.", "options": ["to book", "book", "booked", "booking"], "ans": 1, "ex": {"clue": "had better + 原形動詞", "words": "had better 最好；book v. 預訂", "grammar": "had better（＝'d better）後接原形動詞，表示「最好……」，故用 book。", "trans": "那家飯店非常熱門，所以我認為你最好至少在出發前三個月就預訂房間。", "opts_trans": ["預訂（不定詞）", "預訂（原形動詞）", "預訂（過去式／過去分詞）", "預訂（動名詞／現在分詞）"], "why": "had better 後須接原形動詞，故用 book；to book（不定詞）、booked（過去式／過去分詞）、booking（動名詞）皆無法接在 had better 之後。"}, "id": "q18"}]}, {"id": "s3", "type": "cloze", "ptitle": "綜合測驗", "title": "三、綜合測驗", "subtitle": "依短文文意，選出一個最適合該空格的答案。（每題 2 分，共 10 分）", "points": 10, "passages": [{"title": "短文", "text": "Not only adults need to be careful of the law. In fact, teenagers can also get into trouble __19__ if they don't have enough legal knowledge. For instance, students may use violence on classmates __20__ an argument, resulting in harm to others. Other common problems on campus include negative comments on social media, unwelcome teasing, and __21__ someone's privacy. Some people may think of such __22__ as harmless, but it can actually lead to serious problems. Students should have some legal knowledge so that __23__. Knowing the law can protect them and help them make wise decisions in daily life.", "questions": [{"no": 19, "pts": 2, "stem": "", "options": ["in short", "before long", "at most", "by accident"], "ans": 3, "ex": {"clue": "by accident 意外地", "words": "legal knowledge 法律知識；trouble n. 麻煩", "grammar": "by accident「意外地、偶然地」符合文意：青少年可能因缺乏法律知識而「不小心」惹上麻煩。", "trans": "不只大人需要小心法律。事實上，青少年如果沒有足夠的法律知識，也可能意外惹上麻煩。"}, "id": "q19"}, {"no": 20, "pts": 2, "stem": "", "options": ["due to", "because", "in order to", "no wonder"], "ans": 0, "ex": {"clue": "空格後接名詞，用 due to", "words": "violence n. 暴力；argument n. 爭執", "grammar": "because 需接子句，而空格後 an argument 為名詞，故用 due to + 名詞表「因為」。", "trans": "例如，學生可能因為一場爭執而對同學動粗，造成他人受傷。"}, "id": "q20"}, {"no": 21, "pts": 2, "stem": "", "options": ["permitting", "invading", "praising", "behaving"], "ans": 1, "ex": {"clue": "invade one's privacy 侵犯隱私", "words": "invade v. 侵犯；privacy n. 隱私", "grammar": "invade someone's privacy「侵犯某人的隱私」，與前面的 negative comments、unwelcome teasing 並列校園常見問題。", "trans": "其他常見的校園問題包括在社群媒體上發表負面評論、不受歡迎的嘲弄，以及侵犯他人隱私。"}, "id": "q21"}, {"no": 22, "pts": 2, "stem": "", "options": ["refusal", "apology", "behavior", "gender"], "ans": 2, "ex": {"clue": "such + 名詞，指上述行為", "words": "behavior n. 行為；harmless adj. 無害的", "grammar": "such + 名詞「這樣的……」；think of A as B「把 A 視為 B」。", "trans": "有些人可能認為這樣的行為無害，但它其實會導致嚴重的問題。"}, "id": "q22"}, {"no": 23, "pts": 2, "stem": "", "options": ["they won't get into trouble", "they can turn to a lawyer", "they are unsure what they should do", "they need to explain why they did that"], "ans": 0, "ex": {"clue": "so that 表目的：擁有法律知識以免惹麻煩", "words": "so that 以便；get into trouble 惹上麻煩", "grammar": "so that「以便、為了」引導表目的的副詞子句；學習法律知識的目的正是為了不惹上麻煩，故選 (A)。", "trans": "學生應該具備一些法律知識，以免惹上麻煩。"}, "id": "q23"}]}]}, {"id": "s4", "type": "choice", "title": "四、對話", "subtitle": "根據對話選一個最適當的答案。（每題 3 分，共 15 分）", "points": 15, "questions": [{"no": 24, "pts": 3, "stem": "Aurora: Looks like you've run out of correction tape. Would you like to use mine?<br>Mark: Sure. Thanks a lot.<br>Aurora: Let me know if you need anything else.<br>Mark: ______", "options": ["No way.", "It's not easy.", "No big deal.", "I don't think so."], "ans": 2, "ex": {"clue": "回應對方好意：小事一樁", "words": "correction tape 修正帶；run out of 用完", "grammar": "No big deal.「小事一樁；沒什麼」，用來回應對方道謝或表示不必在意。", "trans": "奧蘿拉：你好像用完修正帶了，要借用我的嗎？馬克：好啊，非常謝謝。奧蘿拉：還需要什麼再跟我說。馬克：小事一樁。", "opts_trans": ["不行；絕不", "那不容易", "小事一樁；沒什麼", "我不這麼認為"], "why": "Aurora 大方借出修正帶並表示有事可再開口，Mark 道謝後以 No big deal.「小事一樁」回應對方好意最自然；其餘選項皆與接受好意、客氣回應的語境不符。"}, "id": "q24"}, {"no": 25, "pts": 3, "stem": "Joshua: I have a headache today, so I want to stay home for a rest. Could you take over for me at the convenience store tonight?<br>Louise: No problem.<br>Joshua: Thank you so much.<br>Louise: Don't mention it. Hope you get better soon.<br>Joshua: ______", "options": ["You saved my life.", "Keep it in mind.", "Here you go.", "You're welcome."], "ans": 0, "ex": {"clue": "對方幫了大忙，表達感激", "words": "take over 接管；代班；You saved my life. 你救了我一命", "grammar": "You saved my life.「你救了我一命。」為口語中表達強烈感謝的說法；Don't mention it.「別客氣」。", "trans": "喬書亞：我今天頭痛，想待在家休息，你今晚能替我在便利商店代班嗎？路易絲：沒問題。喬書亞：非常謝謝你。路易絲：別客氣，希望你早日康復。喬書亞：你救了我一命。", "opts_trans": ["你救了我一命（強烈感謝）", "記住這件事", "給你；拿去吧", "不客氣"], "why": "Louise 替 Joshua 代班並祝他早日康復，Joshua 感動之下用 You saved my life.「你救了我一命」表達強烈謝意；Keep it in mind.（記住）、Here you go.（給你）、You're welcome.（不客氣）皆不適合作為受助後的感謝語。"}, "id": "q25"}, {"no": 26, "pts": 3, "stem": "Jace: Are you all right? You seem to be in a bad mood.<br>Darren: It's Nelson, the big guy from Class 305. He threatened to hit me unless I paid him 5,000 dollars. I'm afraid and don't know what to do.<br>Jace: That's serious! We should report it to Ms. Yeh.<br>Darren: ______", "options": ["She'll follow your suggestions.", "She can cover for him.", "Let's do this our way.", "Let the teacher handle this."], "ans": 3, "ex": {"clue": "同意交給老師處理", "words": "handle v. 處理；threaten to + V 威脅要……", "grammar": "Let the teacher handle this.「讓老師來處理這件事。」；Let + O + 原形動詞。", "trans": "傑斯：你還好嗎？你看起來心情不好。戴倫：是305班那個大個子尼爾森，他威脅我，除非我給他五千塊，不然就要打我。我很害怕，不知道該怎麼辦。傑斯：這很嚴重！我們該向葉老師報告。戴倫：讓老師來處理這件事。", "opts_trans": ["她會聽從你的建議", "她可以替他掩護／代班", "我們用自己的方式處理", "讓老師來處理這件事"], "why": "Jace 提議向葉老師報告，Darren 表示同意，故 Let the teacher handle this.「讓老師來處理」最貼切；其餘選項皆未回應「交給老師」的提議。"}, "id": "q26"}, {"no": 27, "pts": 3, "stem": "Elena: Dina asked me to log into her account and take an online quiz for her.<br>Bruce: You didn't say yes, did you?<br>Elena: Of course not. I told her to do it herself.<br>Bruce: You made her understand she should study harder instead of cheating if she wants to get good grades.<br>Elena: ______", "options": ["You'll get into trouble.", "That's a wise move.", "You're so rude to her.", "Just give it a try."], "ans": 1, "ex": {"clue": "肯定對方作法明智", "words": "That's a wise move. 那是明智之舉；cheat v. 作弊", "grammar": "a wise move「明智之舉」；instead of + V-ing「而不是……」；log into 登入（網路帳戶）。", "trans": "伊蓮娜：蒂娜叫我登入她的帳號，替她上網測驗。布魯斯：你沒有答應吧？伊蓮娜：當然沒有，我叫她自己做。布魯斯：你讓她明白，如果想拿到好成績，就該更用功而不是作弊。伊蓮娜：那是明智之舉。", "opts_trans": ["你會惹上麻煩", "那是明智之舉", "你對她太不禮貌了", "就試試看吧"], "why": "Bruce 肯定 Elena 拒絕幫同學作弊、堅持自己作答的作法，故 That's a wise move.「那是明智之舉」最貼切；其餘選項皆無稱讚肯定之意。"}, "id": "q27"}, {"no": 28, "pts": 3, "stem": "Ms. Kirby: Mills Law Office. May I help you?<br>Harrison: Hi, I'd like to speak with Mr. Mills. I need some legal advice about a car accident I was involved in（涉入）. Is he available now?<br>Ms. Kirby: Yes. I'll connect you to him. ______", "options": ["You've convinced me.", "My pleasure.", "Hold on, please.", "Thank you for calling anyway."], "ans": 2, "ex": {"clue": "接線員請來電者稍候", "words": "Hold on, please. 請稍等；connect v. 轉接（電話）", "grammar": "Hold on, please.「請稍候」，常用於電話用語；I'll connect you to him.「我會幫您轉接給他」。", "trans": "柯比小姐：米爾斯法律事務所，您好，有什麼可以為您服務？哈里森：您好，我想找米爾斯律師，我捲入了一場車禍，需要一些法律建議，他現在有空嗎？柯比小姐：有的，我幫您轉接，請稍等。", "opts_trans": ["你說服我了", "我的榮幸；不客氣", "請稍等", "無論如何謝謝您來電"], "why": "Ms. Kirby 說要幫 Harrison 轉接給 Mr. Mills，電話用語中請對方等候應說 Hold on, please.「請稍等」；其餘選項皆非轉接前請等候的正確應答。"}, "id": "q28"}]}, {"id": "s5", "type": "cloze", "title": "五、閱讀測驗", "subtitle": "閱讀下列短文，選出最適當的答案。（每題 3 分，共 18 分）", "points": 18, "passages": [{"title": "A", "text": "Look at the business card and answer the following questions.<br><br><b>Weston Law Firm</b><br><b>Cynthia Weston, Attorney-at-Law</b><br>Specialties: Family law（家事案件）, Internet safety and privacy（網路安全與隱私）, Fraud cases（詐騙案件）<br>Address: No. 25, Sec. 2, Zhongshan Rd., Taipei City<br>Tel: (02) 2345-6789<br>E-mail: info@westonlaw.com.tw<br>Website: www.westonlaw.com.tw<br>Business Hours: Mon.–Fri. 9:00 a.m.–5:30 p.m.<br>Closed on weekends and holidays.", "questions": [{"no": 29, "pts": 3, "stem": "What can we learn about Weston Law Firm?", "options": ["It does not accept cases of family arguments.", "It has its own official website.", "It provides legal advice through the Internet.", "It only focuses on murders and scams."], "ans": 1, "ex": {"clue": "名片上有官方網站", "words": "business card 名片；official website 官方網站", "grammar": "名片上印有 Website: www.westonlaw.com.tw，故 (B)「它擁有自己的官方網站」正確；(A) 與名片所列家事專長矛盾，(D) 與名片內容不符。", "trans": "根據名片，韋斯頓法律事務所擁有自己的官方網站。"}, "id": "q29"}, {"no": 30, "pts": 3, "stem": "Which of the following cases might Cynthia Weston handle?", "options": ["A customer who got injured at a restaurant.", "A singer who has a copyright（著作權）problem with a music company.", "A patient who asks for help after a medical mistake at a hospital.", "A woman who asks for help after being harassed online."], "ans": 3, "ex": {"clue": "名片專長含網路安全與隱私", "words": "harass v. 騷擾；specialty n. 專長", "grammar": "名片上列有 Internet safety and privacy（網路安全與隱私），故遭網路騷擾的女性前來求助最可能屬於辛西亞．韋斯頓的業務範圍。", "trans": "名片所列專長包括網路安全與隱私，因此遭網路騷擾的女性最可能是韋斯頓律師能協助的案件類型。"}, "id": "q30"}, {"no": 31, "pts": 3, "stem": "Which of the following might be the best time to visit Weston Law Firm?", "options": ["Wednesday, 7:00 p.m.", "Saturday, 11:00 a.m.", "Monday, 3:00 p.m.", "Friday, 8:30 a.m."], "ans": 2, "ex": {"clue": "營業時間為週一至週五 9:00～17:30", "words": "business hours 營業時間；weekend n. 週末", "grammar": "營業時間為 Mon.–Fri. 9:00 a.m.–5:30 p.m.，且週末休息；週三晚上七點已過營業時間、週六休息、週五上午八點半尚未營業，只有 (C) 週一下午三點符合。", "trans": "名片上營業時間為週一至週五上午九點到下午五點半，故週一下午三點是最佳造訪時間。"}, "id": "q31"}]}, {"title": "B", "text": "Doxxing（肉搜）is a term that began in hacker（駭客）culture in the 1990s. It came from the phrase \"dropping documents,\" which meant revealing someone's personal information to others. Today, doxxing refers to posting someone's private details online, including home addresses, phone numbers, private messages, or secretly taken photos.<br><br>People doxx others for several reasons. First, many believe they are practicing \"Internet justice\" by punishing those who break the rules. Second, it is a way for people to show their anger online. By attacking others, they feel like they are \"better\" or \"more moral\" than the victim. Third, simple curiosity can drive people to search for a person's real identity.<br><br>Doxxing brings serious problems to society. It often leads to cyberbullying, and sometimes innocent people are wrongly identified. To stop this trend, we need better privacy laws to punish those who give away personal data. Moreover, social media platforms should delete doxxing content quickly. Most importantly, Internet users should practice empathy（同理心）and remember that behind every screen name is a real person with a real life.", "questions": [{"no": 32, "pts": 3, "stem": "According to this passage, what is NOT a reason why people doxx others?", "options": ["To satisfy their curiosity.", "To punish someone they think behaved badly.", "To express anger toward someone online.", "To protect someone's privacy on the Internet."], "ans": 3, "ex": {"clue": "文中提三個理由，保護隱私不在其中", "words": "curiosity n. 好奇心；victim n. 受害者", "grammar": "文中提到的肉搜理由包括：懲罰違規者、在網路上發洩怒火、以及出於好奇心；(D)「保護某人的網路隱私」並非理由。", "trans": "根據本文，保護某人的網路隱私不是人們肉搜他人的原因。"}, "id": "q32"}, {"no": 33, "pts": 3, "stem": "What can we learn about doxxing from this passage?", "options": ["The original meaning of doxxing is similar to what it refers to today.", "This term was created when hacker culture became common in the 2000s.", "Doxxing can help solve real crimes by providing key evidence.", "Private photos and home addresses are never used in doxxing."], "ans": 0, "ex": {"clue": "原本意指揭露個資，與今日意義相似", "words": "reveal v. 揭露；private details 私人資訊", "grammar": "原文說 doxxing 起源於 1990 年代的駭客文化（非 2000 年代），原本「dropping documents」意指揭露他人個人資訊，與現今意義相似，故 (A) 正確。", "trans": "肉搜一詞的原意與今日所指相似，都是指揭露他人的個人資訊。"}, "id": "q33"}, {"no": 34, "pts": 3, "stem": "What is the main idea of the last paragraph?", "options": ["Cyberbullying is the biggest problem on the Internet today.", "Doxxing causes harm, so action is needed to stop it.", "Social media companies should check personal data.", "Many people share information on the Internet without thinking."], "ans": 1, "ex": {"clue": "末段說明危害並呼籲制止", "words": "cyberbullying n. 網路霸凌；empathy n. 同理心", "grammar": "末段指出肉搜導致網路霸凌、無辜者被誤認等問題，並提出加強隱私法、平台快速刪文、使用者發揮同理心等遏止方法，故 (B)「肉搜造成傷害，需採取行動遏止」為主旨。", "trans": "末段的主旨是：肉搜造成傷害，需要採取行動加以遏止。"}, "id": "q34"}]}]}, {"id": "s6", "type": "fill", "title": "六、填充", "subtitle": "依提示字母填入適當的字彙，以完成句子。（每格 2 分，共 8 分）", "points": 8, "questions": [{"no": 35, "pts": 2, "cn": "你能辨別非洲象和亞洲象嗎？", "en": "Can you ((0)) an African elephant ((1)) an Asian elephant?", "blanks": [{"label": "(t)(l)", "ans": "tell", "accept": ["tell"]}, {"label": "(f)(m)", "ans": "from", "accept": ["from"]}], "ex": {"clue": "t…l f…m（分辨……與……）", "words": "tell A from B 分辨 A 與 B", "grammar": "tell A from B「分辨 A 與 B」；Can you…？「你能……嗎？」。", "trans": "你能辨別非洲象和亞洲象嗎？"}, "id": "q35"}, {"no": 36, "pts": 2, "cn": "當Sharon發現自己心愛的靴子不小心被扔掉時，她暴跳如雷。", "en": "Sharon ((0)) the ((1)) when she found out her favorite boots were thrown away by mistake.", "blanks": [{"label": "(h)(t)", "ans": "hit", "accept": ["hit"]}, {"label": "(r)(f)", "ans": "roof", "accept": ["roof"]}], "ex": {"clue": "h…t the r…f（大發雷霆）", "words": "hit the roof 暴跳如雷；by mistake 不小心地", "grammar": "hit the roof「暴跳如雷」為固定片語；when 引導時間副詞子句。", "trans": "當Sharon發現自己心愛的靴子不小心被扔掉時，她暴跳如雷。"}, "id": "q36"}]}, {"id": "s7", "type": "sentence", "title": "七、句型練習", "subtitle": "將所給的字詞重組成完整句子，或依提示合併／改寫句子。（第 37.～39. 題每題 3 分，第 40. 題 4 分，共 13 分）", "points": 13, "questions": [{"no": 37, "pts": 3, "task": "he could / so that / save more videos / Walter freed up / some space on his tablet（句子重組）", "answer": "Walter freed up some space on his tablet so that he could save more videos.", "accept": ["Walter freed up some space on his tablet so that he could save more videos", "walter freed up some space on his tablet so that he could save more videos"], "ex": {"clue": "so that 表目的（以便）", "words": "free up 騰出；tablet n. 平板電腦", "grammar": "so that + S + 助動詞 + V「以便……」，引導表目的的副詞子句，說明騰出空間的目的。", "trans": "沃特騰出平板電腦的一些空間，以便他可以儲存更多影片。"}, "id": "q37"}, {"no": 38, "pts": 3, "task": "To avoid missing any details, Cathy usually writes down every key point in a meeting.（以 so that 改寫）", "answer": "Cathy usually writes down every key point in a meeting so that she can avoid missing any details.", "accept": ["Cathy usually writes down every key point in a meeting so that she can avoid missing any details", "cathy usually writes down every key point in a meeting so that she can avoid missing any details", "Cathy usually writes down every key point in a meeting so that she will avoid missing any details", "cathy usually writes down every key point in a meeting so that she will avoid missing any details"], "ex": {"clue": "以 so that + S + can/will + V 改寫表目的", "words": "key point 重點；detail n. 細節", "grammar": "原句 To avoid missing…（為了避免遺漏……）表目的，可改寫為 so that + S + can/will + V；避免遺漏的主詞是 Cathy，故 so that she can/will avoid…。", "trans": "凱西通常會把會議中每個重點寫下來，以便她能避免漏掉任何細節。"}, "id": "q38"}, {"no": 39, "pts": 3, "task": "No one understands that.<br>Why did Matthew suddenly decide to quit the club?（將第二句改為間接問句 wh- + S + V 合併）", "answer": "No one understands why Matthew suddenly decided to quit the club.", "accept": ["No one understands why Matthew suddenly decided to quit the club", "no one understands why matthew suddenly decided to quit the club"], "ex": {"clue": "間接問句：疑問詞 + S + V", "words": "quit v. 退出；club n. 社團", "grammar": "將直接問句 Why did Matthew…？改為間接問句時，語序改為疑問詞 + S + V：why Matthew suddenly decided to quit the club，接在主要子句 No one understands 之後。", "trans": "沒人明白為什麼Matthew突然決定退出那個社團。"}, "id": "q39"}, {"no": 40, "pts": 4, "task": "我不確定Faye何時能和我聚會（get together），因為她週末不總是有空。（間接問句）（中譯英）", "answer": "I am not sure when Faye can get together with me because she is not always free on weekends.", "accept": ["I am not sure when Faye can get together with me because she is not always free on weekends", "i am not sure when faye can get together with me because she is not always free on weekends", "I am not certain when Faye can get together with me because she is not always free on weekends", "I am not sure when Faye can get together with me because she is not always free on the weekends"], "ex": {"clue": "間接問句：I am not sure when + S + V", "words": "not sure / not certain 不確定；get together 聚會；be free 有空", "grammar": "「何時」的間接問句用疑問詞 when + S + V 的語序：when Faye can get together with me；because 引導原因副詞子句。", "trans": "我不確定Faye何時能和我聚會，因為她週末不總是有空。"}, "id": "q40"}]}]};

var NORM_RE = /[\s\.,，。;；:：!！?？"'“”‘’（）()\[\]【】\-、_]/g;
function norm(s){return (s==null?"":String(s)).toLowerCase().replace(NORM_RE,"");}
function hasAny(user, arr){
  var u = norm(user);
  return arr.some(function(a){ return u === norm(a); });
}

var score = 0, total = 0;
var results = {};   // qid -> {ok:true/false, pts:n}   (fill -> {blanks:[bool]})

function el(tag, cls, html){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html != null) e.innerHTML = html;
  return e;
}

function exBlock(cls, title, text){
  var b = el("div", "ex-block " + cls);
  var h = el("h4", null, title);
  var p = el("p", null, text || "—");
  b.appendChild(h); b.appendChild(p);
  return b;
}

function exPanel(q, openAll){
  var ex = el("div", "ex" + (openAll ? " show" : ""));
  var grid = el("div", "ex-grid");
  var ans = "";
  if(q.type === "sentence" && q.answer){
    ans = q.answer;
  } else if(q.type === "fill" && q.en && q.blanks){
    ans = String(q.en).replace(/\(\((\d+)\)\)/g, function(m, n){ return q.blanks[+n] ? q.blanks[+n].ans : m; });
  }
  if(ans) grid.appendChild(exBlock("ans", "正確答案", ans));
  grid.appendChild(exBlock("clue", "解題線索", q.ex.clue));
  if((q.type === "choice" || q.type === "cloze") && q.ex.opts_trans && q.ex.opts_trans.length){
    var rows = q.options.map(function(o, i){
      return "<b>" + String.fromCharCode(65 + i) + ".</b> " + o + (q.ex.opts_trans[i] ? " ／ " + q.ex.opts_trans[i] : "");
    }).join("<br>");
    grid.appendChild(exBlock("opts", "選項解析", rows));
  }
  grid.appendChild(exBlock("words", "重要字詞", q.ex.words));
  grid.appendChild(exBlock("grammar", "文法句型", q.ex.grammar));
  if((q.type === "choice" || q.type === "cloze") && q.ex.why){
    grid.appendChild(exBlock("why", "為何不選其他選項", q.ex.why));
  }
  grid.appendChild(exBlock("trans", "中文翻譯", q.ex.trans));
  ex.appendChild(grid);
  var tg = el("button", "toggle-ex", "查看詳解 ▾");
  tg.onclick = function(){ ex.classList.toggle("show"); tg.textContent = ex.classList.contains("show") ? "收合詳解 ▴" : "查看詳解 ▾"; };
  ex.appendChild(tg);
  return ex;
}

function speak(text){
  try{
    if(!text) return;
    if(typeof window === "undefined") return;
    if(!window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined"){
      speechUnsupported();
      return;
    }
    var s = window.speechSynthesis;
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = "en-US";
    u.rate = 0.9;
    try{
      var vs = s.getVoices ? s.getVoices() : [];
      var v = null;
      for(var i = 0; i < vs.length; i++){ if(/^en[-_]?US/i.test(vs[i].lang || "")){ v = vs[i]; break; } }
      if(!v){ for(i = 0; i < vs.length; i++){ if(/^en/i.test(vs[i].lang || "")){ v = vs[i]; break; } } }
      if(v) u.voice = v;
    }catch(e1){}
    var np = (typeof navigator !== "undefined" && navigator) ? (navigator.platform || "") : "";
    var touch = false;
    try{ touch = ("ontouchstart" in window) || ((navigator.maxTouchPoints || 0) > 0); }catch(e3){}
    var iOS = /iP(hone|ad|od)/.test(np) || (np === "MacIntel" && (navigator.maxTouchPoints || 0) > 1);
    if(iOS || touch){
      // Mobile (iOS Safari / Android Chrome & Edge): cancel() before speak() is the
      // known Android workaround for silent first utterance, but pause()/resume()
      // must NOT be used — it can leave the synthesis paused and produce no sound.
      s.cancel();
      s.speak(u);
      return;
    }
    s.cancel();
    s.speak(u);
    // Chrome/Edge desktop workaround: wake the engine with pause()/resume()
    try{
      if(!s.paused){
        s.pause();
        s.resume();
      }
    }catch(e2){}
  }catch(e){}
}

var speechToast = null;
function speechUnsupported(){
  try{

    speechToast = el("div", "speech-note", "此環境無法播放語音朗讀：瀏覽器需支援 Web Speech API，並以 HTTPS（或本機）開啟頁面。");
    document.body.appendChild(speechToast);
    setTimeout(function(){ try{ if(speechToast){ speechToast.remove(); speechToast = null; } }catch(e){} }, 5200);
  }catch(e){}
}

(function(){

    else if(window.speechSynthesis.onvoiceschanged === null) window.speechSynthesis.onvoiceschanged = function(){ try{ if(window.speechSynthesis.getVoices) window.speechSynthesis.getVoices(); }catch(e){} };
  }catch(e){}
})();

function fullSentence(q){
  if(q.speakText) return q.speakText;
  if(q.en){
    return q.en.replace(/\(\((\d+)\)\)/g, function(m, n){ return (q.blanks[+n] || {}).ans || ""; });
  }
  if(q.sent){
    var s = String(q.sent).replace(/<span class='hint'>[^<]*<\/span>/g, q.answer || "");
    return s.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  }
  return String(q.stem || "").replace(/_{3,}/g, q.answer || (q.options ? q.options[q.ans] : "") || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
}

function sentChunk(text, no){
  var chs = splitSents(text);
  for(var i = 0; i < chs.length; i++){
    if(chs[i].indexOf("__" + no + "__") >= 0) return chs[i];
  }
  return "";
}

function sentenceWithBlank(text, no, ans){
  var ch = sentChunk(text, no);
  if(!ch) return "";
  ch = String(ch).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  // drop the OCR artifact period right after the blank when the sentence continues
  ch = ch.replace(new RegExp("__" + no + "__\\.(?=\\s*[a-z,])"), "__" + no + "__");
  var parts = String(ans || "").split("\u2026");
  var i = 0;
  var out = ch.replace(new RegExp("__" + no + "__", "g"), function(){
    var v = parts.length > 1 ? (parts[i] || "") : (ans || "");
    i++;
    return v.trim();
  });
  return out.replace(/\s+/g, " ").replace(/^[\s.,;:!?]+/, "").trim();
}

function badgeClean(s){
  return String(s).replace(/<span class='bk'>（\d+）<\/span>\.(?=\s*[a-z,])/g, function(m){ return m.slice(0, -1); });
}

function refSentHTML(text, no){
  var chs = splitSents(text);
  var idx = -1;
  for(var i = 0; i < chs.length; i++){
    if(chs[i].indexOf("__" + no + "__") >= 0){ idx = i; break; }
  }
  if(idx < 0) return "";
  var cur = chs[idx].replace(/__(\d+)__/g, function(m, n){ return "<span class='bk'>（" + n + "）</span>"; });
  var out = "";
  if(idx > 0 && /^\s*__\d+__/.test(chs[idx])){
    var prev = chs[idx - 1].replace(/__(\d+)__/g, function(m, n){ return "<span class='bk'>（" + n + "）</span>"; });
    out += "<span class='ctx-prev'>" + badgeClean(prev) + "</span>";
  }
  out += "<span class='ctx-cur'>" + badgeClean(cur) + "</span>";
  return out;
}

function splitSents(text){
  var t = String(text || "");
  var chunks = [];
  var start = 0;
  for(var i = 0; i < t.length; i++){
    var c = t.charAt(i);
    if(c === "." || c === "!" || c === "?"){
      var prev = t.slice(Math.max(0, i - 12), i);
      if(/[0-9]+__$/.test(prev)){
        var nx = t.slice(i + 1).replace(/^\s+/, "");
        if(nx && /^[a-z,]/.test(nx)) continue;
      }
      i++;
      while(i < t.length && /[.!?]/.test(t.charAt(i))) i++;
      var ch = t.slice(start, i).trim().replace(/\s+/g, " ");
      if(ch) chunks.push(ch);
      start = i;
      i--;
    }
  }
  var tail = t.slice(start).trim().replace(/\s+/g, " ");
  if(tail) chunks.push(tail);
  return chunks;
}

function goToQuestion(card, no){
  try{
    var box = null;
    [].forEach.call(card.querySelectorAll(".q"), function(b){
      var qno = b.querySelector(".qno");
      if(!qno) return;
      var t = String(qno.textContent || qno._innerSet || "").replace(/\s+/g, "");
      if(t === no + ".") box = b;
    });
    if(!box) return;
    if(typeof box.scrollIntoView === "function") box.scrollIntoView({behavior:"smooth", block:"start"});
    var ex = box.querySelector(".ex");
    if(ex){
      ex.classList.add("show");
      var tg = box.querySelector(".toggle-ex");
      if(tg) tg.textContent = "收合詳解 ▴";
    }
    box.classList.add("jump-hl");
    if(typeof setTimeout !== "undefined") setTimeout(function(){ try{ box.classList.remove("jump-hl"); }catch(e){} }, 1600);
  }catch(e){}
}

function highlightSentence(box, no){
  try{
    var card = box.parentElement || box.parent;
    if(!card) return;
    var target = null;
    [].forEach.call(card.querySelectorAll(".passage"), function(pa){
      if(!target) target = pa.querySelector("span[data-no=" + no + "]");
    });
    if(!target) return;
    [].forEach.call(card.querySelectorAll(".passage .sent"), function(s){ if(s.classList) s.classList.remove("hl"); });
    target.classList.add("hl");
    if(typeof target.scrollIntoView === "function") target.scrollIntoView({behavior:"smooth", block:"center"});
    if(typeof requestAnimationFrame === "function"){
      clearTimeout(target._hlTimer);
      target._hlTimer = setTimeout(function(){ target.classList.remove("hl"); }, 3600);
    }
  }catch(e){}
}

/* ---------- rendering ---------- */
function renderApp(){
  var app = document.getElementById("app");
  DATA.sections.forEach(function(sec){
    var card = el("section", "card");
    card.id = sec.id;
    var head = el("div", "sec-head");
    head.appendChild(el("h2", null, sec.title));
    head.appendChild(el("p", "sub", sec.subtitle));
    var ssc = el("span", "sec-score", "本節得分 <b id='ss-"+sec.id+"'>0</b> / <span>"+sec.points+"</span>");
    head.appendChild(ssc);
    card.appendChild(head);

    if(sec.type === "cloze"){
      sec.passages.forEach(function(pg){
        var pass = el("div", "passage");
        var pt = el("div", "ptitle", (sec.ptitle || "閱讀測驗 ") + pg.title);
        pass.appendChild(pt);
        var text = splitSents(pg.text).map(function(ch){
          var no = (ch.match(/__(\d+)__/) || [])[1];
          var html = ch.replace(/__(\d+)__/g, function(m, n){ return "<span class='bk'>（" + n + "）</span>"; });
          return "<span class='sent'" + (no ? " data-no='" + no + "'" : "") + ">" + badgeClean(html) + "</span>";
        }).join(" ");
        var pEl = el("p", null, text);
        pass.appendChild(pEl);
        card.appendChild(pass);
        [].forEach.call(pEl.querySelectorAll(".bk"), function(bk){
          var n = parseInt(String(bk.textContent || bk._innerSet || "").replace(/[^0-9]+/g, ""), 10);
          if(!n) return;
          bk.classList.add("bk-link");
          bk.title = "跳到第 " + n + " 題解析";
          bk.onclick = function(){ goToQuestion(card, n); };
        });
        pg.questions.forEach(function(q){
          q.speakText = sentenceWithBlank(pg.text, q.no, q.options[q.ans]);
          q.refSent = refSentHTML(pg.text, q.no);
          card.appendChild(renderQ(sec, q));
        });
      });
    } else {
      sec.questions.forEach(function(q){ card.appendChild(renderQ(sec, q)); });
    }
    app.appendChild(card);
  });
  total = 0;
  DATA.sections.forEach(function(sec){
    total += sec.points;
  });
  document.getElementById("total").textContent = total;
  buildChips();
}

function renderQ(sec, q){
  q.type = q.type || sec.type; q.sec = sec.id; q.secTitle = sec.title;
  var box = el("div", "q");
  box.setAttribute("data-qid", q.id);
  var head = el("div", "qhead");
  head.appendChild(el("span", "qno", q.no + "."));
  var dispPts = q.pts * (q.blanks ? q.blanks.length : 1);
  head.appendChild(el("span", "qpts", dispPts + " 分"));
  box.appendChild(head);

  var body = el("div", "qbody");
  var ctrl = el("div", "qctrl");
  var rbox = resultBox();

  if(q.type === "choice" || q.type === "cloze"){
    var stemText = q.stem || (q.type === "cloze" ? q.refSent : "");
    if(stemText) body.appendChild(el("p", "qstem" + (q.type === "cloze" && !q.stem ? " refsent" : ""), stemText));
    var opts = el("div", "opts");
    var selected = -1;
    q.options.forEach(function(opt, i){
      var o = el("div", "opt");
      o.innerHTML = "<span class='ol'>" + String.fromCharCode(65+i) + ".</span>" + opt;
      o.onclick = function(){
        if(box.dataset.graded === "1") return;
        Array.prototype.forEach.call(opts.children, function(c){ c.classList.remove("sel"); });
        o.classList.add("sel");
        selected = i;
      };
      opts.appendChild(o);
    });
    body.appendChild(opts);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      if(q.type === "cloze") highlightSentence(box, q.no);
      if(selected < 0){
        showInfo(rbox, "尚未選擇答案。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var ok = (selected === q.ans);
      markResult(box, rbox, q, ok);
      Array.prototype.forEach.call(opts.children, function(c, i){
        c.classList.remove("sel");
        if(i === q.ans) c.classList.add("correct");
        else if(i === selected && !ok) c.classList.add("wrong");
      });
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "vocab"){
    body.appendChild(el("p", "qstem", "請寫出「<b>" + q.answer + "</b>」的英文。"));
    var inp = el("input", "");
    inp.type = "text"; inp.placeholder = "輸入英文單字";
    body.appendChild(inp);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(q.word);
      var v = inp.value.trim();
      if(!v){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，作答後即可計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, [q.word].concat(q.accept_en || []));
      markResult(box, rbox, q, ok, q.word + "（" + q.answer + "）");
      if(ok){ inp.style.borderColor = "#2b8a3e"; } else { inp.style.borderColor = "#e03131"; }
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "word"){
    var sent = String(q.sent).replace(/<span class='hint'>([a-zA-Z]+)\s+([a-zA-Z]+)<\/span>/g, function(m, a, b){
      var missing = Math.max(1, (q.answer || "").length - a.length - b.length);
      return "<span class='hint'>" + a + "</span><span class='uhint'>" + new Array(missing + 1).join("_") + "</span><span class='hint'>" + b + "</span>";
    });
    body.appendChild(el("p", "qstem", sent));
    var inp = el("input", "");
    inp.type = "text"; inp.placeholder = "依提示字母填入單字";
    body.appendChild(inp);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      var v = inp.value.trim();
      if(!v){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，作答後即可計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, q.accept);
      markResult(box, rbox, q, ok);
      if(ok){ inp.style.borderColor = "#2b8a3e"; } else { inp.style.borderColor = "#e03131"; }
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "fill"){
    body.appendChild(el("p", "qstem", "【中文】" + q.cn));
    var sen = el("p", "qstem");
    var html = q.en.replace(/\(\((\d+)\)\)/g, function(m, n){
      var b = q.blanks[+n];
      var letters = [];
      var lm, lre = /\(([^)]+)\)/g;
      while((lm = lre.exec(b.label || ""))) letters.push(lm[1]);
      var fragA = letters[0] || "";
      var fragB = letters.length > 1 ? letters.slice(1).join("") : "";
      var missing = Math.max(1, (b.ans || "").length - fragA.length - fragB.length);
      var shown = fragA + new Array(missing + 1).join("_") + fragB;
      return ' <span class="bblank">' + shown + '</span> ';
    });
    sen.innerHTML = html;
    body.appendChild(sen);
    var abox = el("div", "fbox");
    q.blanks.forEach(function(b, n){
      var span = el("span", "lbl", "(" + (n + 1) + ")");
      var inp = el("input", "inline-in");
      inp.type = "text";
      inp.style.width = Math.min(220, Math.max(90, (b.ans || "").length * 12)) + "px";
      inp.setAttribute("data-blank", n);
      abox.appendChild(span); abox.appendChild(inp);
    });
    body.appendChild(abox);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      var ins = abox.querySelectorAll("input[data-blank]");
      var emptyAll = true;
      ins.forEach(function(ip){ if(String(ip.value || "").trim()) emptyAll = false; });
      if(emptyAll){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var oks = [];
      var all = true, any = false;
      ins.forEach(function(ip){
        var b = q.blanks[+ip.dataset.blank];
        var ok = hasAny(ip.value, b.accept);
        oks.push(ok); any = any || ok; if(!ok) all = false;
        ip.style.borderColor = ok ? "#2b8a3e" : "#e03131";
      });
      var nOk = oks.filter(Boolean).length;
      box.dataset.graded = "1";
      var pts = nOk * q.pts;
      var prev = results[q.id];
      if(prev){ score -= prev.pts; }
      results[q.id] = {ok: nOk === q.blanks.length, pts: pts};
      score += pts;
      updateScore();
      var msg = "答對 " + nOk + " / " + q.blanks.length + " 格，得 " + pts + " 分。";
      showResult(box, rbox, all, msg);
      expandEx(box);
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "sentence"){
    body.appendChild(el("p", "qstem", q.task));
    var ta = el("textarea", "");
    ta.placeholder = "請寫下你的句子";
    body.appendChild(ta);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(q.answer);
      var v = ta.value.trim();
      if(!v){
        showInfo(rbox, "尚未寫下句子。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, q.accept);
      markResult(box, rbox, q, ok);
      if(!ok){
        rbox.innerHTML = "尚未完全符合參考答案。請先參考下方「解題線索／文法句型」，再自行判斷是否答對。";
        var self = el("div", "qctrl");
        var y = el("button", "btn btn-ok", "我寫對了");
        var n = el("button", "btn btn-bad", "我寫錯了");
        y.onclick = function(){ markResult(box, rbox, q, true); self.remove(); };
        n.onclick = function(){ markResult(box, rbox, q, false); self.remove(); };
        self.appendChild(y); self.appendChild(n);
        rbox.appendChild(self);
      }
    };
    ctrl.appendChild(chk);
  }

  box.appendChild(body);
  box.appendChild(ctrl);
  box.appendChild(rbox);
  var ex = exPanel(q, false);
  box.appendChild(ex);
  return box;
}

function markResult(box, rbox, q, ok, ansText){
  box.dataset.graded = "1";
  var prev = results[q.id];
  if(prev){ score -= prev.pts; }
  results[q.id] = {ok: ok, pts: ok ? q.pts : 0};
  score += ok ? q.pts : 0;
  updateScore();
  if(ok){
    showResult(box, rbox, true, "答對了！得 " + q.pts + " 分。");
  } else {
    showResult(box, rbox, false, "答錯了。正確答案：" + (ansText || q.answer));
  }
  var chip = document.getElementById("chip-" + q.sec);
  if(chip){
    chip.textContent = q.secTitle + " " + sectionScore(q.sec) + "/" + sectionPoints(q.sec);
  }
  expandEx(box);
}

function expandEx(box){
  var ex = box.querySelector(".ex");
  var tg = box.querySelector(".toggle-ex");
  if(ex && !ex.classList.contains("show")){ ex.classList.add("show"); }
  if(tg){ tg.textContent = "收合詳解 ▴"; }
}

function sectionPoints(secId){
  var s = DATA.sections.filter(function(x){return x.id===secId;})[0];
  return s ? s.points : 0;
}
function sectionScore(secId){
  var tot = 0;
  Object.keys(results).forEach(function(k){
    var r = results[k];
    var q = questionById(k);
    if(q && q.sec === secId) tot += r.pts;
  });
  return tot;
}
function questionById(qid){
  var found = null;
  DATA.sections.forEach(function(sec){
    var list = [];
    if(sec.type === "cloze"){ sec.passages.forEach(function(p){ list = list.concat(p.questions); }); }
    else { list = sec.questions; }
    list.forEach(function(q){ if(q.id === qid){ found = q; } });
  });
  return found;
}

function updateScore(){
  document.getElementById("score").textContent = score;
  var p = total ? Math.round(score / total * 100) : 0;
  document.getElementById("pbar").style.width = p + "%";
  DATA.sections.forEach(function(sec){
    var s = document.getElementById("ss-" + sec.id);
    if(s) s.textContent = sectionScore(sec.id);
  });
}

function buildChips(){
  var c = document.getElementById("secchips");
  c.innerHTML = "";
  DATA.sections.forEach(function(sec){
    var ch = el("button", "chip", sec.title + " 0/" + sec.points);
    ch.type = "button";
    ch.id = "chip-" + sec.id;
    ch.onclick = function(){
      var el = document.getElementById(sec.id);
      if(el) el.scrollIntoView({behavior: "smooth", block: "start"});
    };
    c.appendChild(ch);
  });
  updateChipActive();
}

function updateChipActive(){
  var mark = null;
  DATA.sections.forEach(function(sec){
    var el = document.getElementById(sec.id);
    var ch = document.getElementById("chip-" + sec.id);
    if(!el || !ch) return;
    var r = el.getBoundingClientRect();
    if(r.top <= 170) mark = ch;
  });
  document.querySelectorAll("#secchips .chip").forEach(function(ch){
    if(ch === mark) ch.classList.add("on");
    else ch.classList.remove("on");
  });
}
if(typeof window !== "undefined"){
  window.addEventListener("scroll", updateChipActive, {passive: true});
}

function revealAll(){
  document.querySelectorAll("#app .q").forEach(function(box){
    var q = questionById(box.dataset.qid);
    if(!q) return;
    var ex = box.querySelector(".ex");
    if(ex) ex.classList.add("show");
    var ins = box.querySelectorAll("input[type=text],textarea");
    if(q.type === "vocab"){
      if(ins[0]) ins[0].value = q.word;
    } else if(q.type === "word"){
      if(ins[0]) ins[0].value = q.answer;
    } else if(q.type === "fill"){
      box.querySelectorAll("input[data-blank]").forEach(function(ip){
        ip.value = q.blanks[+ip.dataset.blank].ans;
      });
    } else if(q.type === "sentence"){
      if(ins[0]) ins[0].value = q.answer;
    } else if(q.type === "choice" || q.type === "cloze"){
      box.querySelectorAll(".opt").forEach(function(o, i){
        if(i === q.ans) o.classList.add("correct");
      });
    }
  });
  var tgs = document.querySelectorAll(".toggle-ex");
  tgs.forEach(function(t){ t.textContent = "收合詳解 ▴"; });
}

function resetAll(){
  score = 0; results = {};
  document.querySelectorAll("#app .q").forEach(function(box){
    box.dataset.graded = "";
    box.querySelectorAll("input[type=text],textarea").forEach(function(i){ i.value=""; i.style.borderColor=""; });
    box.querySelectorAll(".opt").forEach(function(o){ o.className="opt"; });
    var r = box.querySelector(".qresult");
    if(r){ r.className="qresult"; r.innerHTML=""; }
    var ex = box.querySelector(".ex");
    if(ex) ex.classList.remove("show");
  });
  document.querySelectorAll(".toggle-ex").forEach(function(t){ t.textContent = "查看詳解 ▾"; });
  updateScore();
  buildChips();
}

document.getElementById("reset").onclick = resetAll;
document.getElementById("revealAll").onclick = revealAll;
renderApp();
updateScore();
</script>
