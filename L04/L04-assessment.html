<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask a Lawyer | 學習評量（115上技高英文 Choice 版三）</title>
<style>
:root{
  --ink:#1f2430; --muted:#6b7280; --line:#e5e7eb; --bg:#f4f6fb;
  --card:#ffffff; --accent:#3b5bdb; --accent2:#0ca678; --warn:#f59f00;
  --ok:#2b8a3e; --bad:#e03131; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#065f46,#0ca678);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.top .wrap{padding-top:14px;padding-bottom:14px}
.top h1{margin:0;font-size:22px;letter-spacing:.5px}
.top .zh{margin:2px 0 10px;font-size:13px;opacity:.9}
.badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:1px 12px;font-size:12px;margin-bottom:6px}
.scorebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.score{background:rgba(255,255,255,.14);border-radius:10px;padding:6px 14px;font-size:14px}
.score b{font-size:20px;color:#ffe066}
.progress{flex:1 1 120px;height:10px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
#pbar{height:100%;width:0%;background:#ffe066;border-radius:999px;transition:width .3s}
.sb-btn{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer}
.sb-btn:hover{background:rgba(255,255,255,.15)}
.secchips{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;border:none;color:#fff;cursor:pointer;font-family:inherit;transition:.15s}
.chip:hover{background:rgba(255,255,255,.26)}
.chip.on{background:rgba(255,255,255,.4);box-shadow:0 0 0 1px rgba(255,255,255,.65) inset}
.chip.ok{background:rgba(46,204,113,.35)}
main.wrap{padding-top:20px;padding-bottom:40px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px;box-shadow:0 1px 4px rgba(16,24,40,.05);overflow:hidden}
.sec-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;background:#fafbff}
.sec-head h2{margin:0;font-size:17px;color:#253073}
.sec-head .sub{margin:0;font-size:12.5px;color:var(--muted)}
.sec-head .sec-score{margin-left:auto;font-size:13px;color:#253073;font-weight:600}
.passage{margin:14px 18px 0;padding:14px 16px;background:#f8f9ff;border:1px solid #dbe1ff;border-radius:10px;font-size:15px}
.passage .ptitle{font-weight:700;color:#3b5bdb;margin-bottom:6px}
.bk{display:inline-block;background:#3b5bdb;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;margin:0 2px;vertical-align:middle}
.q{padding:16px 18px;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:none}
.card{scroll-margin-top:170px}
.qhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.qno{font-weight:700;color:#3b5bdb}
.qpts{margin-left:auto;font-size:12px;color:var(--muted);background:#eef1ff;border-radius:6px;padding:0 8px}
.qstem{font-size:15.5px;margin:4px 0}
.qstem .hint{color:var(--warn);font-weight:600}
.uhint,.bblank{color:#94a3b8;font-family:monospace;letter-spacing:.5px;font-weight:600}
.bblank{color:#64748b}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;font-size:14.5px;user-select:none;transition:.12s}
.opt:hover{border-color:#aab4f0;background:#f4f6ff}
.opt .ol{display:inline-block;width:22px;color:#6b7280;font-weight:700}
.opt.sel{border-color:var(--accent);background:#e9edff;box-shadow:0 0 0 1px var(--accent) inset}
.opt.correct{border-color:var(--ok);background:#e6f7ec}
.opt.wrong{border-color:var(--bad);background:#fdecec}
.fbox{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fbox .lbl{font-weight:700;color:#6b7280;font-size:13px}
input[type=text],textarea{border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14.5px;font-family:inherit;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,91,219,.12)}
textarea{width:100%;min-height:64px;resize:vertical}
.inline-in{margin:0 4px;vertical-align:middle}
.fbl{display:inline-block;background:#fff3bf;color:#9a7b00;font-weight:700;font-size:11px;border-radius:5px;padding:0 6px;margin:0 2px;vertical-align:middle}
.qctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button.btn{border:none;border-radius:8px;padding:7px 16px;font-size:13.5px;cursor:pointer;font-family:inherit}
.btn-check{background:var(--accent);color:#fff}
.btn-check:hover{background:#2f4bc0}
.btn-ghost{background:#eef1f6;color:#374151}
.btn-ghost:hover{background:#e2e7f0}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:var(--bad);color:#fff}
.qresult{display:none;margin-top:10px;padding:10px 14px;border-radius:9px;font-size:14px}
.qresult.show{display:block}
.qresult.good{background:#e9f9f0;border:1px solid #b7e6c8;color:#1c6b32}
.qresult.bad{background:#fdeeee;border:1px solid #f3c1c1;color:#9c2222}
.qresult.info{background:#eef4ff;border:1px solid #c6d8ff;color:#2f4bc0}
.toggle-ex{margin-top:10px;border:1px solid #aab4f0;background:#eef1ff;color:#3b5bdb;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;padding:5px 14px;transition:.12s}
.toggle-ex:hover{background:#e2e8ff;border-color:#8f9cf0}
.ex{display:none;margin-top:10px}
.ex.show{display:block}
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex-block{border-radius:9px;padding:10px 12px;font-size:13.5px;border:1px solid var(--line)}
.ex-block h4{margin:0 0 4px;font-size:13px;color:#253073}
.ex-block p{margin:0}
.ex.clue{border-left:4px solid var(--warn);background:#fffbf0}
.ex.words{border-left:4px solid var(--accent);background:#f4f6ff}
.ex.grammar{border-left:4px solid var(--accent2);background:#f0fbf6}
.ex.trans{border-left:4px solid #be4bdb;background:#fcf5ff}
@media (max-width:600px){.ex-grid{grid-template-columns:1fr}}
footer.wrap{padding-bottom:30px;color:var(--muted);font-size:12px}
</style>
</head>

<header class="top">
  <div class="wrap">
    <span class="badge">Lesson 4｜115上 技高英文 Choice 版（三）學習評量</span>
    <h1>Ask a Lawyer</h1>
    <p class="zh">學習評量｜第 4 課｜作答、計分、四類詳解</p>

      <div class="score">得分 <b id="score">0</b> / <span id="total">0</span></div>

<script>
"use strict";
var DATA = {"num": 4, "en": "Ask a Lawyer", "zh": "學習評量｜第 4 課", "sections": [{"id": "s1", "type": "word", "title": "一、文意字彙", "subtitle": "1.～4. 填入適當的字彙，以完成該句；5.～8. 選出適當的字彙，以完成該句；9.～10. 選出與句中畫底線的字意思最接近的答案。（每題 2 分，共 20 分）", "points": 20, "questions": [{"no": 1, "pts": 2, "type": "word", "sent": "Gina is very <span class='hint'>r e</span> and you can trust her with important tasks.", "answer": "reliable", "accept": ["reliable"], "ex": {"clue": "r…e（可靠的）", "words": "reliable adj. 可靠的", "grammar": "reliable 為形容詞，be very reliable＝非常可靠。", "trans": "吉娜非常可靠，你可以把重要的工作交給她。"}, "id": "q1"}, {"no": 2, "pts": 2, "type": "word", "sent": "Molly cheated in the exam and was punished for her bad <span class='hint'>b r</span>.", "answer": "behavior", "accept": ["behavior", "behaviour"], "ex": {"clue": "b…r（行為）", "words": "behavior n. 行為", "grammar": "behavior 為名詞，bad behavior＝不良行為。", "trans": "茉莉考試作弊，並因為不良行為受到處罰。"}, "id": "q2"}, {"no": 3, "pts": 2, "type": "word", "sent": "The army <span class='hint'>i d</span> a neighboring country to gain control of important natural resources.", "answer": "invaded", "accept": ["invaded", "invade"], "ex": {"clue": "i…d（入侵）", "words": "invade v. 入侵；侵略", "grammar": "invade 為動詞，本句為過去式 invaded。", "trans": "軍隊入侵鄰國，以取得重要自然資源的控制權。"}, "id": "q3"}, {"no": 4, "pts": 2, "type": "word", "sent": "If you want to use Kane's computer, you should get her <span class='hint'>p n</span> first.", "answer": "permission", "accept": ["permission"], "ex": {"clue": "p…n（允許）", "words": "permission n. 允許；許可", "grammar": "get sb.'s permission「取得某人的允許」為常見搭配。", "trans": "如果你想用肯恩的電腦，你應該先得到她的允許。"}, "id": "q4"}, {"no": 5, "pts": 2, "type": "choice", "stem": "Jack ______ to Mary for keeping her waiting for an hour because he overslept.", "options": ["admired", "behaved", "wondered", "apologized"], "ans": 3, "ex": {"clue": "for keeping her waiting 而道歉", "words": "apologize v. 道歉；oversleep v. 睡過頭", "grammar": "apologize to sb. for sth.「為某事向某人道歉」。", "trans": "傑克因為讓瑪麗等了一個小時而向她道歉，因為他睡過頭了。"}, "id": "q5"}, {"no": 6, "pts": 2, "type": "choice", "stem": "Lucy decided to find a lawyer and take ______ action after she was tricked by a scammer.", "options": ["aware", "optional", "legal", "spare"], "ans": 2, "ex": {"clue": "找律師＝採取法律行動", "words": "legal adj. 法律的；scammer n. 詐騙者", "grammar": "take legal action「採取法律行動」為固定搭配。", "trans": "露西被詐騙後，決定找律師並採取法律行動。"}, "id": "q6"}, {"no": 7, "pts": 2, "type": "choice", "stem": "As society develops, traditional ______ roles may change over time.", "options": ["gender", "passion", "issue", "jewelry"], "ans": 0, "ex": {"clue": "傳統的……角色（性別角色）", "words": "gender n. 性別；gender roles 性別角色", "grammar": "gender roles「性別角色」為固定搭配。", "trans": "隨著社會發展，傳統的性別角色可能隨時間改變。"}, "id": "q7"}, {"no": 8, "pts": 2, "type": "choice", "stem": "Tom felt ______ about forgetting his wife's birthday, so he bought her a necklace as an apology.", "options": ["certain", "guilty", "physical", "influential"], "ans": 1, "ex": {"clue": "忘了生日所以感到愧疚", "words": "guilty adj. 愧疚的；apology n. 道歉", "grammar": "feel guilty about sth.「對某事感到愧疚」。", "trans": "湯姆因為忘了妻子的生日而感到愧疚，所以買了一條項鍊送她作為道歉。"}, "id": "q8"}, {"no": 9, "pts": 2, "type": "choice", "stem": "Bob said he would lend me the money, but I refused his offer.", "options": ["updated", "rejected", "reacted", "ensured"], "ans": 1, "ex": {"clue": "refused＝rejected 拒絕", "words": "refuse v. 拒絕；reject v. 拒絕", "grammar": "refused（拒絕）的意思最接近 rejected（拒絕、不受理）。", "trans": "鮑伯說他會借我錢，但我拒絕了他的提議。"}, "id": "q9"}, {"no": 10, "pts": 2, "type": "choice", "stem": "The waiter removed the empty plates from the table and served the next dish.", "options": ["gave up", "got into", "took away", "turned to"], "ans": 2, "ex": {"clue": "removed＝took away 收走", "words": "remove v. 移除；take away 拿走；收走", "grammar": "removed（移開、收走）的意思最接近 took away（拿走）。", "trans": "服務生收走了桌上的空盤子，接著上了下一道菜。"}, "id": "q10"}]}, {"id": "s2", "type": "choice", "title": "二、語法測驗", "subtitle": "選出一個最適當的答案。（每題 2 分，共 16 分）", "points": 16, "questions": [{"no": 11, "pts": 2, "stem": "Please tell me how ______ prepare for the job interview.", "options": ["I to", "can I", "should I", "I can"], "ans": 3, "ex": {"clue": "間接問句用 wh- + S + V", "words": "tell sb. how… 告訴某人如何…", "grammar": "○11 此題為 S + V + wh- + S + V 的間接問句句型，間接問句的結構是 wh- + S + V，故答案為 (D)。", "trans": "請告訴我該如何為工作面試做準備。"}, "id": "q11"}, {"no": 12, "pts": 2, "stem": "Tommy is saving money ______ he can buy a new smartphone.", "options": ["in order to", "so that", "that", "why"], "ans": 1, "ex": {"clue": "後句表目的", "words": "so that 以便；smartphone n. 智慧型手機", "grammar": "○12 此題後句是前句的目的，因此使用 S + V… so that + S + can / will + V 句型。", "trans": "湯米正在存錢，以便他能買一支新的智慧型手機。"}, "id": "q12"}, {"no": 13, "pts": 2, "stem": "Do you know ______?", "options": ["who playing the piano", "can who play the piano", "who can play the piano", "who the piano can play"], "ans": 2, "ex": {"clue": "疑問詞當主詞時語序不變", "words": "know wh- 子句；疑問詞當主詞", "grammar": "○13 此題為 S + V + wh- + S + V 的間接問句句型，因為原問句 “Who can play the piano?” 的主詞為疑問詞，故變成間接問句時，句子排序不變。", "trans": "你知道誰會彈鋼琴嗎？"}, "id": "q13"}, {"no": 14, "pts": 2, "stem": "You had better ______ an umbrella because the sky is looking pretty gray.", "options": ["to bring", "bringing", "bring", "brought"], "ans": 2, "ex": {"clue": "had better 後接原形動詞", "words": "had better 最好；umbrella n. 雨傘", "grammar": "○14 had better + 原形動詞，故答案為 (C)。", "trans": "天空看起來滿灰的，你最好帶一把傘。"}, "id": "q14"}, {"no": 15, "pts": 2, "stem": "I wonder what ______ for lunch.", "options": ["did he eat", "was he eating", "he eating", "he ate"], "ans": 3, "ex": {"clue": "間接問句 wh- + S + V，時態為過去式", "words": "wonder v. 想知道", "grammar": "○15 此題是 S + V + wh- + S + V 的間接問句句型，本句時態為過去式，故答案為 (D)。", "trans": "我想知道他午餐吃了什麼。"}, "id": "q15"}, {"no": 16, "pts": 2, "stem": "It's hard to tell unripe（未熟的）lemons ______ limes（萊姆）because they look similar.", "options": ["from", "to", "by", "with"], "ans": 0, "ex": {"clue": "tell A from B 分辨", "words": "tell A from B 分辨 A 和 B；unripe adj. 未熟的", "grammar": "○16 tell A from B 分辨 A 和 B，故介系詞選 (A)。", "trans": "要分辨未熟的檸檬和萊姆很困難，因為它們看起來很像。"}, "id": "q16"}, {"no": 17, "pts": 2, "stem": "The sign on the wall shows ______.", "options": ["where is the restroom", "where the restroom is", "the restroom is where", "the restroom where is"], "ans": 1, "ex": {"clue": "間接問句語序為 wh- + S + V", "words": "restroom n. 洗手間；sign n. 標示", "grammar": "○17 此題為 S + V + wh- + S + V 的間接問句句型，間接問句的結構是 wh- + S + V，故答案為 (B)。", "trans": "牆上的標示牌顯示洗手間在哪裡。"}, "id": "q17"}, {"no": 18, "pts": 2, "stem": "Road safety is an important issue, and many accidents are due to ______.", "options": ["drive carelessly", "the drivers are careless", "careless driving", "careless"], "ans": 2, "ex": {"clue": "due to 後接名詞／動名詞", "words": "due to 由於；accident n. 意外；事故", "grammar": "○18 due to + N / V-ing，故答案是 (C)。", "trans": "道路安全是很重要的議題，許多事故都是因為危險駕駛（粗心駕駛）造成的。"}, "id": "q18"}]}, {"id": "s3", "type": "cloze", "ptitle": "綜合測驗", "title": "三、綜合測驗", "subtitle": "依短文文意，選出一個最適合該空格的答案。（每題 3 分，共 15 分）", "points": 15, "passages": [{"title": "短文", "text": "The Me Too movement gained worldwide attention in 2017, when many people spoke out against a famous Hollywood producer who was accused of sexual harassment. After that, many victims began to share their stories __19__ the public could understand the issue better. Later, millions of people used #MeToo on social media to show support. The power of the Internet made people more __20__ of sexual harassment and assault. After learning what these victims experienced, many people __21__. They called for stronger laws and better education so people know __22__ when such attacks happen. They also hope that those who are guilty __23__ sexual violence will face proper punishment. Today, the movement continues to remind people to treat everyone with respect.", "questions": [{"no": 19, "pts": 3, "stem": "", "options": ["so that", "although", "in order", "as soon as"], "ans": 0, "ex": {"clue": "前後句有目的關係", "words": "so that 好讓；以便；accuse v. 指控；harassment n. 騷擾", "grammar": "○19 此題的前後句存在目的性，所以用 so that，表示「好讓，以便」。", "trans": "許多受害者開始分享他們的故事，好讓大眾更了解這個議題。"}, "id": "q19"}, {"no": 20, "pts": 3, "stem": "", "options": ["physical", "major", "aware", "specific"], "ans": 2, "ex": {"clue": "more……of 與 be aware of 搭配", "words": "aware adj. 察覺的；assault n. 侵害；攻擊", "grammar": "be aware of「意識到」為固定搭配，故答案為 (C)。", "trans": "網路的力量使人們更加意識到性騷擾與性侵害。"}, "id": "q20"}, {"no": 21, "pts": 3, "stem": "", "options": ["stole the show", "sold like hot cakes", "hit the roof", "broke the bank"], "ans": 2, "ex": {"clue": "憤怒的反應 hit the roof", "words": "hit the roof 勃然大怒；broke the bank 花光所有錢", "grammar": "hit the roof「勃然大怒」呼應受害者經歷，故答案為 (C)。", "trans": "了解這些受害者的經歷後，許多人勃然大怒。"}, "id": "q21"}, {"no": 22, "pts": 3, "stem": "", "options": ["what should they do", "what they should do", "what should do", "should do what"], "ans": 1, "ex": {"clue": "間接問句 wh- + S + V", "words": "indirect question 間接問句", "grammar": "○22 此題是 S + V + wh- + S + V 的間接問句句型，間接問句的結構是 wh- + S + V，故答案為 (B)。", "trans": "他們呼籲制定更嚴格的法律與更好的教育，好讓人們知道這類攻擊發生時該怎麼做。"}, "id": "q22"}, {"no": 23, "pts": 3, "stem": "", "options": ["in", "for", "at", "of"], "ans": 3, "ex": {"clue": "be guilty of 固定搭配", "words": "be guilty of 犯下……罪；punishment n. 懲罰", "grammar": "○23 be guilty of + 罪名，表示「犯下……罪的」，故答案為 (D)。", "trans": "他們也希望犯下性暴力罪行的人將受到應有的懲罰。"}, "id": "q23"}]}]}, {"id": "s4", "type": "choice", "title": "四、對話", "subtitle": "根據對話選一個最適當的答案。（每題 3 分，共 15 分）", "points": 15, "questions": [{"no": 24, "pts": 3, "stem": "Elsa: Can you lend me your jacket? I feel a bit cold.<br>Tom: Sure. Here you go.<br>Elsa: Thanks.<br>Tom: ______", "options": ["I doubt it.", "Calm down.", "I don't like it.", "Anytime."], "ans": 3, "ex": {"clue": "對方道謝，回應不客氣", "words": "lend v. 借出；Anytime. 不客氣；隨時", "grammar": "Anytime. 在此表示「不客氣、隨時歡迎」。", "trans": "艾莎：可以借我你的夾克嗎？我覺得有點冷。湯姆：當然可以，給你。艾莎：謝謝。湯姆：不客氣。"}, "id": "q24"}, {"no": 25, "pts": 3, "stem": "John: My classmates often play pranks（惡作劇）on me, and I don't like it.<br>Jack: I think you should tell your teacher about it.<br>John: You are right. Thanks for the advice.<br>Jack: ______", "options": ["That's not a wise move.", "You're welcome.", "You're so rude.", "Hold on."], "ans": 1, "ex": {"clue": "對方道謝，回應不客氣", "words": "prank n. 惡作劇；That's not a wise move. 這不是明智之舉。", "grammar": "You're welcome.「不客氣。」回應他人的道謝。", "trans": "約翰：同學們常對我惡作劇，我不喜歡這樣。傑克：我覺得你應該告訴老師。約翰：你說得對，謝謝你的建議。傑克：不客氣。"}, "id": "q25"}, {"no": 26, "pts": 3, "stem": "Tommy: I had a car accident. Somebody hit my car and drove away.<br>Judy: That's terrible! Did you call the police?<br>Tommy: I did. They said I could take legal action.<br>Judy: ______", "options": ["So you should talk to a lawyer.", "Where is my car?", "That's very sweet of him.", "I missed a call earlier."], "ans": 0, "ex": {"clue": "可採取法律行動→建議找律師", "words": "legal action 法律行動；lawyer n. 律師", "grammar": "So you should…「所以你應該……」承接前文提出建議。", "trans": "湯米：我出車禍了，有人撞了我的車就開走了。茱蒂：太可怕了！你報警了嗎？湯米：報了，他們說我可以採取法律行動。茱蒂：所以你應該跟律師談談。"}, "id": "q26"}, {"no": 27, "pts": 3, "stem": "David: Can you explain this math question? I can't figure it out by myself.<br>Paul: Of course. It's actually really easy.<br>David: Thank you so much.<br>Paul: ______", "options": ["No way.", "I'm afraid not.", "That makes sense.", "Happy to help."], "ans": 3, "ex": {"clue": "對方道謝，表達樂意幫忙", "words": "figure out 想出；弄懂", "grammar": "Happy to help.「很高興幫上忙。」", "trans": "大衛：可以跟我解釋這題數學嗎？我自己想不出來。保羅：當然可以，其實真的很簡單。大衛：非常感謝你。保羅：很高興幫上忙。"}, "id": "q27"}, {"no": 28, "pts": 3, "stem": "Helen: You shouldn't look into my bag without asking.<br>Mary: I'm sorry. I didn't mean to. I was just curious.<br>Helen: It's OK. This is the first and last time though. ______", "options": ["I couldn't agree more.", "It's my pleasure.", "Just don't do it again.", "I'll call the police."], "ans": 2, "ex": {"clue": "下不為例", "words": "curious adj. 好奇的；look into 偷看", "grammar": "Just don't do it again.「下次別再這樣了（下不為例）。」", "trans": "海倫：你不應該沒問就偷看我的包包。瑪莉：對不起，我不是故意的，我只是好奇。海倫：沒關係，不過這是最後一次，下不為例。"}, "id": "q28"}]}, {"id": "s5", "type": "cloze", "title": "五、閱讀測驗", "subtitle": "閱讀下列短文，選出最適當的答案。（每題 3 分，共 18 分）", "points": 18, "passages": [{"title": "A", "text": "Richard's school is running an anti-bullying program. Look at the poster and answer the following questions.<br><br><b>Anti-Bullying Poster</b><br><b>Physical:</b> Kicking, Hitting, Pushing, Touching someone in unwanted ways<br><b>Verbal:</b> Threatening（威脅）, Insulting, Teasing（嘲弄）, Embarrassing someone in public<br><b>Social:</b> Damaging someone's reputation（名聲）, Spreading rumors（謠言）, Leaving someone out<br><b>Cyber:</b> Sharing someone's private information online, Spreading rumors online, Sending hateful（仇恨的）texts<br><br>If any of the above kinds of bullying happens to you, please do the following:<br>Tell your teachers, parents, or guardians（監護人）.<br>Call the government 1953 anti-bullying hotline for help.<br>Send an email to our school email address to inform（通知）us of the matter.", "questions": [{"no": 29, "pts": 3, "stem": "What does the word “cyber” mean in the poster?", "options": ["Educational.", "Online.", "Related to language.", "Related to the body."], "ans": 1, "ex": {"clue": "cyber＝網路的", "words": "cyber adj. 網路的；數位的", "grammar": "cyber 指「網路、電腦」相關，在此指網路上的霸凌行為。", "trans": "海報中「cyber」這個字是什麼意思？（網路的）"}, "id": "q29"}, {"no": 30, "pts": 3, "stem": "Jenny often speaks ill of people behind their backs and spreads rumors on social media. What kinds of bullying are these?", "options": ["Physical and verbal bullying.", "Verbal and social bullying.", "Social and cyber bullying.", "Cyber and physical bullying."], "ans": 2, "ex": {"clue": "背後說壞話＝社會霸凌，社群媒體散布謠言＝網路霸凌", "words": "speak ill of 說……的壞話；spread rumors 散布謠言", "grammar": "在背後說人壞話屬 social bullying，在社群媒體散布謠言屬 cyber bullying。", "trans": "珍妮常在背後說人壞話，並在社群媒體散布謠言。這些是哪種霸凌？（社會霸凌與網路霸凌）"}, "id": "q30"}, {"no": 31, "pts": 3, "stem": "Which of the following statements is true, according to the poster?", "options": ["The school does not provide any way to report bullying.", "Students can call the school's anti-bullying hotline for help.", "Making fun of someone is not an issue of bullying.", "Students can get help by phone or by email if they are bullied."], "ans": 3, "ex": {"clue": "海報提供電話與電子郵件管道", "words": "anti-bullying hotline 反霸凌專線；guardian n. 監護人", "grammar": "海報提到可撥打政府 1953 反霸凌專線及寄信到學校信箱求助，故 (D) 正確；(B) 錯在是政府專線而非學校專線。", "trans": "根據海報，下列何者正確？（學生被霸凌時可透過電話或電子郵件求助）"}, "id": "q31"}]}, {"title": "B", "text": "The Internet is a necessary tool for many people nowadays. However, as technology develops, the Internet has also become a platform for people to do harmful things. Among the most serious problems are online scams, and many people have fallen victim to them. Take “phishing”（網路釣魚）for example. The word comes from “fishing” as scammers try to “catch” victims online. People who carry out this kind of scam, called phishers, trick their targets with fake websites or emails in order to get their personal information. As a result, many victims lose a large amount of money or have their identities stolen. Although the police have tried hard to cope with（處理）phishing, we also need to protect ourselves by staying alert. The most important thing is to watch out for emails or text messages that ask for personal information. Do not click on suspicious（可疑的）links because they may lead you to fake websites. Remember, you can never be too careful online, and it is always better to be safe than sorry.", "questions": [{"no": 32, "pts": 3, "stem": "What is the main idea of this passage?", "options": ["Examples of cyberbullying.", "A specific kind of online scam and how to avoid it.", "The convenience of the Internet and how to use it.", "Different types of online crime."], "ans": 1, "ex": {"clue": "本文主題＝網路釣魚及其防範", "words": "phishing n. 網路釣魚；scam n. 詐騙", "grammar": "全文說明 phishing 這種詐騙手法及自我保護方式，主旨為「一種特定的網路詐騙及如何避免」。", "trans": "本文主旨為何？（一種特定的網路詐騙及如何避免）"}, "id": "q32"}, {"no": 33, "pts": 3, "stem": "Which of the following statements is NOT true, according to the passage?", "options": ["Phishers often scam people over the phone.", "Phishing is a word that comes from “fishing.”", "Phishing is a kind of online scam.", "Phishers steal people's money and identities."], "ans": 0, "ex": {"clue": "文中未提到電話行騙", "words": "identity n. 身分；trick v. 欺騙", "grammar": "文中說 phishers 用假網站或電子郵件行騙，未提到電話，故 (A) 不正確。", "trans": "根據本文，下列何者「不」正確？（網路釣魚者常透過電話行騙）"}, "id": "q33"}, {"no": 34, "pts": 3, "stem": "What does the last sentence “it is always better to be safe than sorry” mean?", "options": ["People should not do something they may regret（後悔）.", "Safety is more important than speed.", "It is wise to be extra careful now to avoid regret later.", "It is important to avoid making mistakes."], "ans": 2, "ex": {"clue": "寧可多小心以免後悔", "words": "better safe than sorry 寧可謹慎為上，免得後悔", "grammar": "最後一句提醒大家小心謹慎，避免日後後悔，故 (C) 最貼切。", "trans": "最後一句「寧可小心謹慎，也不要事後後悔」是什麼意思？（現在格外小心以避免日後後悔是明智的）"}, "id": "q34"}]}]}, {"id": "s6", "type": "fill", "title": "六、填充", "subtitle": "依提示字母填入適當的字彙，以完成句子。（每格 2 分，共 8 分）", "points": 8, "questions": [{"no": 35, "pts": 2, "cn": "你能翻閱一下你的電子郵件看有沒有收到線上會議通知嗎？", "en": "Can you ((0)) ((1)) your emails and see if you received the online meeting notice?", "blanks": [{"label": "(l)", "ans": "look", "accept": ["look"]}, {"label": "(t)", "ans": "through", "accept": ["through"]}], "ex": {"clue": "l…／t…（翻閱）", "words": "look through 翻閱；查看", "grammar": "look through「翻閱、查看」為固定搭配。", "trans": "你能翻閱一下你的電子郵件，看有沒有收到線上會議通知嗎？"}, "id": "q35"}, {"no": 36, "pts": 2, "cn": "這個錯誤是不小心發生的，不過我們已經修正了。", "en": "The error happened ((0)) ((1)), but we have already fixed it.", "blanks": [{"label": "(b)", "ans": "by", "accept": ["by"]}, {"label": "(a)", "ans": "accident", "accept": ["accident"]}], "ex": {"clue": "b…／a…（不小心）", "words": "by accident 不小心；意外地", "grammar": "by accident「意外地、不小心」為固定介系詞片語。", "trans": "這個錯誤是不小心發生的，不過我們已經修正了。"}, "id": "q36"}]}, {"id": "s7", "type": "sentence", "title": "七、句子重組", "subtitle": "將所給的字詞重組成完整句子。（每題 4 分，共 8 分）", "points": 8, "questions": [{"no": 37, "pts": 4, "task": "get to the train station / can / how / I / Can you tell me", "answer": "Can you tell me how I can get to the train station?", "accept": ["Can you tell me how I can get to the train station", "can you tell me how i can get to the train station"], "ex": {"clue": "間接問句 how I can…", "words": "get to 到達；間接問句", "grammar": "Can you tell me + how 引導的間接問句，語序為 wh- + S + V（how I can get…）。", "trans": "你能告訴我怎麼到火車站嗎？"}, "id": "q37"}, {"no": 38, "pts": 4, "task": "he could / Paul / buy a larger one / so that / sold his old house", "answer": "Paul sold his old house so that he could buy a larger one.", "accept": ["Paul sold his old house so that he could buy a larger one", "paul sold his old house so that he could buy a larger one"], "ex": {"clue": "so that 引導目的子句", "words": "so that 以便", "grammar": "so that + S + could + V 引導目的子句「以便……」。", "trans": "保羅賣掉了他的舊房子，以便買一間更大的。"}, "id": "q38"}]}]};

var NORM_RE = /[\s\.,，。;；:：!！?？"'“”‘’（）()\[\]【】\-、_]/g;
function norm(s){return (s==null?"":String(s)).toLowerCase().replace(NORM_RE,"");}
function hasAny(user, arr){
  var u = norm(user);
  return arr.some(function(a){ return u === norm(a); });
}

var score = 0, total = 0;
var results = {};   // qid -> {ok:true/false, pts:n}   (fill -> {blanks:[bool]})

function el(tag, cls, html){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html != null) e.innerHTML = html;
  return e;
}

function exBlock(cls, title, text){
  var b = el("div", "ex-block " + cls);
  var h = el("h4", null, title);
  var p = el("p", null, text || "—");
  b.appendChild(h); b.appendChild(p);
  return b;
}

function exPanel(q, openAll){
  var ex = el("div", "ex" + (openAll ? " show" : ""));
  var grid = el("div", "ex-grid");
  grid.appendChild(exBlock("clue", "解題線索", q.ex.clue));
  grid.appendChild(exBlock("words", "重要字詞", q.ex.words));
  grid.appendChild(exBlock("grammar", "文法句型", q.ex.grammar));
  grid.appendChild(exBlock("trans", "中文翻譯", q.ex.trans));
  ex.appendChild(grid);
  var tg = el("button", "toggle-ex", "查看詳解 ▾");
  tg.onclick = function(){ ex.classList.toggle("show"); tg.textContent = ex.classList.contains("show") ? "收合詳解 ▴" : "查看詳解 ▾"; };
  ex.appendChild(tg);
  return ex;
}

function resultBox(){
  var r = el("div", "qresult");
  return r;
}
function showResult(qEl, rbox, ok, msg){
  rbox.className = "qresult show " + (ok ? "good" : "bad");
  rbox.innerHTML = msg;
}

function showInfo(rbox, msg){
  rbox.className = "qresult show info";
  rbox.innerHTML = msg;
}

function speak(text){
  try{
    if(!text) return;
    if(typeof window === "undefined" || !window.speechSynthesis) return;
    var s = window.speechSynthesis;
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = "en-US";
    u.rate = 0.9;
    s.cancel();
    s.speak(u);
    // Chrome/Edge workaround: wake the engine with pause()/resume()
    try{
      if(!s.paused){
        s.pause();
        s.resume();
      }
    }catch(e2){}
  }catch(e){}
}

function fullSentence(q){
  if(q.en){
    return q.en.replace(/\(\((\d+)\)\)/g, function(m, n){ return (q.blanks[+n] || {}).ans || ""; });
  }
  if(q.sent){
    var s = String(q.sent).replace(/<span class='hint'>[^<]*<\/span>/g, q.answer || "");
    return s.replace(/<[^>]+>/g, "");
  }
  return String(q.stem || "").replace(/_{3,}/g, q.answer);
}

/* ---------- rendering ---------- */
function renderApp(){
  var app = document.getElementById("app");
  DATA.sections.forEach(function(sec){
    var card = el("section", "card");
    card.id = sec.id;
    var head = el("div", "sec-head");
    head.appendChild(el("h2", null, sec.title));
    head.appendChild(el("p", "sub", sec.subtitle));
    var ssc = el("span", "sec-score", "本節得分 <b id='ss-"+sec.id+"'>0</b> / <span>"+sec.points+"</span>");
    head.appendChild(ssc);
    card.appendChild(head);

    if(sec.type === "cloze"){
      sec.passages.forEach(function(pg){
        var pass = el("div", "passage");
        var pt = el("div", "ptitle", (sec.ptitle || "閱讀測驗 ") + pg.title);
        pass.appendChild(pt);
        var text = pg.text.replace(/__(\d+)__/g, function(m, n){ return "<span class='bk'>（" + n + "）</span>"; });
        pass.appendChild(el("p", null, text));
        card.appendChild(pass);
        pg.questions.forEach(function(q){ card.appendChild(renderQ(sec, q)); });
      });
    } else {
      sec.questions.forEach(function(q){ card.appendChild(renderQ(sec, q)); });
    }
    app.appendChild(card);
  });
  total = 0;
  DATA.sections.forEach(function(sec){
    total += sec.points;
  });
  document.getElementById("total").textContent = total;
  buildChips();
}

function renderQ(sec, q){
  q.type = q.type || sec.type; q.sec = sec.id; q.secTitle = sec.title;
  var box = el("div", "q");
  box.setAttribute("data-qid", q.id);
  var head = el("div", "qhead");
  head.appendChild(el("span", "qno", q.no + "."));
  var dispPts = q.pts * (q.blanks ? q.blanks.length : 1);
  head.appendChild(el("span", "qpts", dispPts + " 分"));
  box.appendChild(head);

  var body = el("div", "qbody");
  var ctrl = el("div", "qctrl");
  var rbox = resultBox();

  if(q.type === "choice" || q.type === "cloze"){
    body.appendChild(el("p", "qstem", q.stem));
    var opts = el("div", "opts");
    var selected = -1;
    q.options.forEach(function(opt, i){
      var o = el("div", "opt");
      o.innerHTML = "<span class='ol'>" + String.fromCharCode(65+i) + ".</span>" + opt;
      o.onclick = function(){
        if(box.dataset.graded === "1") return;
        Array.prototype.forEach.call(opts.children, function(c){ c.classList.remove("sel"); });
        o.classList.add("sel");
        selected = i;
      };
      opts.appendChild(o);
    });
    body.appendChild(opts);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      if(selected < 0){
        showInfo(rbox, "尚未選擇答案。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var ok = (selected === q.ans);
      markResult(box, rbox, q, ok);
      Array.prototype.forEach.call(opts.children, function(c, i){
        c.classList.remove("sel");
        if(i === q.ans) c.classList.add("correct");
        else if(i === selected && !ok) c.classList.add("wrong");
      });
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "vocab"){
    body.appendChild(el("p", "qstem", "請寫出「<b>" + q.answer + "</b>」的英文。"));
    var inp = el("input", "");
    inp.type = "text"; inp.placeholder = "輸入英文單字";
    body.appendChild(inp);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(q.word);
      var v = inp.value.trim();
      if(!v){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，作答後即可計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, [q.word].concat(q.accept_en || []));
      markResult(box, rbox, q, ok, q.word + "（" + q.answer + "）");
      if(ok){ inp.style.borderColor = "#2b8a3e"; } else { inp.style.borderColor = "#e03131"; }
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "word"){
    var sent = String(q.sent).replace(/<span class='hint'>([a-zA-Z]+)\s+([a-zA-Z]+)<\/span>/g, function(m, a, b){
      var missing = Math.max(1, (q.answer || "").length - a.length - b.length);
      return "<span class='hint'>" + a + "</span><span class='uhint'>" + new Array(missing + 1).join("_") + "</span><span class='hint'>" + b + "</span>";
    });
    body.appendChild(el("p", "qstem", sent));
    var inp = el("input", "");
    inp.type = "text"; inp.placeholder = "依提示字母填入單字";
    body.appendChild(inp);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      var v = inp.value.trim();
      if(!v){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，作答後即可計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, q.accept);
      markResult(box, rbox, q, ok);
      if(ok){ inp.style.borderColor = "#2b8a3e"; } else { inp.style.borderColor = "#e03131"; }
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "fill"){
    body.appendChild(el("p", "qstem", "【中文】" + q.cn));
    var sen = el("p", "qstem");
    var html = q.en.replace(/\(\((\d+)\)\)/g, function(m, n){
      var b = q.blanks[+n];
      var letters = [];
      var lm, lre = /\(([^)]+)\)/g;
      while((lm = lre.exec(b.label || ""))) letters.push(lm[1]);
      var fragA = letters[0] || "";
      var fragB = letters.length > 1 ? letters.slice(1).join("") : "";
      var missing = Math.max(1, (b.ans || "").length - fragA.length - fragB.length);
      var shown = fragA + new Array(missing + 1).join("_") + fragB;
      return ' <span class="bblank">' + shown + '</span> ';
    });
    sen.innerHTML = html;
    body.appendChild(sen);
    var abox = el("div", "fbox");
    q.blanks.forEach(function(b, n){
      var span = el("span", "lbl", "(" + (n + 1) + ")");
      var inp = el("input", "inline-in");
      inp.type = "text";
      inp.style.width = Math.min(220, Math.max(90, (b.ans || "").length * 12)) + "px";
      inp.setAttribute("data-blank", n);
      abox.appendChild(span); abox.appendChild(inp);
    });
    body.appendChild(abox);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      var ins = abox.querySelectorAll("input[data-blank]");
      var emptyAll = true;
      ins.forEach(function(ip){ if(String(ip.value || "").trim()) emptyAll = false; });
      if(emptyAll){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var oks = [];
      var all = true, any = false;
      ins.forEach(function(ip){
        var b = q.blanks[+ip.dataset.blank];
        var ok = hasAny(ip.value, b.accept);
        oks.push(ok); any = any || ok; if(!ok) all = false;
        ip.style.borderColor = ok ? "#2b8a3e" : "#e03131";
      });
      var nOk = oks.filter(Boolean).length;
      box.dataset.graded = "1";
      var pts = nOk * q.pts;
      var prev = results[q.id];
      if(prev){ score -= prev.pts; }
      results[q.id] = {ok: nOk === q.blanks.length, pts: pts};
      score += pts;
      updateScore();
      var msg = "答對 " + nOk + " / " + q.blanks.length + " 格，得 " + pts + " 分。";
      showResult(box, rbox, all, msg);
      expandEx(box);
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "sentence"){
    body.appendChild(el("p", "qstem", q.task));
    var ta = el("textarea", "");
    ta.placeholder = "請寫下你的句子";
    body.appendChild(ta);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(q.answer);
      var v = ta.value.trim();
      if(!v){
        showInfo(rbox, "尚未寫下句子。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, q.accept);
      markResult(box, rbox, q, ok);
      if(!ok){
        rbox.innerHTML = "尚未完全符合參考答案。請先參考下方「解題線索／文法句型」，再自行判斷是否答對。";
        var self = el("div", "qctrl");
        var y = el("button", "btn btn-ok", "我寫對了");
        var n = el("button", "btn btn-bad", "我寫錯了");
        y.onclick = function(){ markResult(box, rbox, q, true); self.remove(); };
        n.onclick = function(){ markResult(box, rbox, q, false); self.remove(); };
        self.appendChild(y); self.appendChild(n);
        rbox.appendChild(self);
      }
    };
    ctrl.appendChild(chk);
  }

  box.appendChild(body);
  box.appendChild(ctrl);
  box.appendChild(rbox);
  var ex = exPanel(q, false);
  box.appendChild(ex);
  return box;
}

function markResult(box, rbox, q, ok, ansText){
  box.dataset.graded = "1";
  var prev = results[q.id];
  if(prev){ score -= prev.pts; }
  results[q.id] = {ok: ok, pts: ok ? q.pts : 0};
  score += ok ? q.pts : 0;
  updateScore();
  if(ok){
    showResult(box, rbox, true, "答對了！得 " + q.pts + " 分。");
  } else {
    showResult(box, rbox, false, "答錯了。正確答案：" + (ansText || q.answer));
  }
  var chip = document.getElementById("chip-" + q.sec);
  if(chip){
    chip.textContent = q.secTitle + " " + sectionScore(q.sec) + "/" + sectionPoints(q.sec);
  }
  expandEx(box);
}

function expandEx(box){
  var ex = box.querySelector(".ex");
  var tg = box.querySelector(".toggle-ex");
  if(ex && !ex.classList.contains("show")){ ex.classList.add("show"); }
  if(tg){ tg.textContent = "收合詳解 ▴"; }
}

function sectionPoints(secId){
  var s = DATA.sections.filter(function(x){return x.id===secId;})[0];
  return s ? s.points : 0;
}
function sectionScore(secId){
  var tot = 0;
  Object.keys(results).forEach(function(k){
    var r = results[k];
    var q = questionById(k);
    if(q && q.sec === secId) tot += r.pts;
  });
  return tot;
}
function questionById(qid){
  var found = null;
  DATA.sections.forEach(function(sec){
    var list = [];
    if(sec.type === "cloze"){ sec.passages.forEach(function(p){ list = list.concat(p.questions); }); }
    else { list = sec.questions; }
    list.forEach(function(q){ if(q.id === qid){ found = q; } });
  });
  return found;
}

function updateScore(){
  document.getElementById("score").textContent = score;
  var p = total ? Math.round(score / total * 100) : 0;
  document.getElementById("pbar").style.width = p + "%";
  DATA.sections.forEach(function(sec){
    var s = document.getElementById("ss-" + sec.id);
    if(s) s.textContent = sectionScore(sec.id);
  });
}

function buildChips(){
  var c = document.getElementById("secchips");
  c.innerHTML = "";
  DATA.sections.forEach(function(sec){
    var ch = el("button", "chip", sec.title + " 0/" + sec.points);
    ch.type = "button";
    ch.id = "chip-" + sec.id;
    ch.onclick = function(){
      var el = document.getElementById(sec.id);
      if(el) el.scrollIntoView({behavior: "smooth", block: "start"});
    };
    c.appendChild(ch);
  });
  updateChipActive();
}

function updateChipActive(){
  var mark = null;
  DATA.sections.forEach(function(sec){
    var el = document.getElementById(sec.id);
    var ch = document.getElementById("chip-" + sec.id);
    if(!el || !ch) return;
    var r = el.getBoundingClientRect();
    if(r.top <= 170) mark = ch;
  });
  document.querySelectorAll("#secchips .chip").forEach(function(ch){
    if(ch === mark) ch.classList.add("on");
    else ch.classList.remove("on");
  });
}
if(typeof window !== "undefined"){
  window.addEventListener("scroll", updateChipActive, {passive: true});
}

function revealAll(){
  document.querySelectorAll("#app .q").forEach(function(box){
    var q = questionById(box.dataset.qid);
    if(!q) return;
    var ex = box.querySelector(".ex");
    if(ex) ex.classList.add("show");
    var ins = box.querySelectorAll("input[type=text],textarea");
    if(q.type === "vocab"){
      if(ins[0]) ins[0].value = q.word;
    } else if(q.type === "word"){
      if(ins[0]) ins[0].value = q.answer;
    } else if(q.type === "fill"){
      box.querySelectorAll("input[data-blank]").forEach(function(ip){
        ip.value = q.blanks[+ip.dataset.blank].ans;
      });
    } else if(q.type === "sentence"){
      if(ins[0]) ins[0].value = q.answer;
    } else if(q.type === "choice" || q.type === "cloze"){
      box.querySelectorAll(".opt").forEach(function(o, i){
        if(i === q.ans) o.classList.add("correct");
      });
    }
  });
  var tgs = document.querySelectorAll(".toggle-ex");
  tgs.forEach(function(t){ t.textContent = "收合詳解 ▴"; });
}

function resetAll(){
  score = 0; results = {};
  document.querySelectorAll("#app .q").forEach(function(box){
    box.dataset.graded = "";
    box.querySelectorAll("input[type=text],textarea").forEach(function(i){ i.value=""; i.style.borderColor=""; });
    box.querySelectorAll(".opt").forEach(function(o){ o.className="opt"; });
    var r = box.querySelector(".qresult");
    if(r){ r.className="qresult"; r.innerHTML=""; }
    var ex = box.querySelector(".ex");
    if(ex) ex.classList.remove("show");
  });
  document.querySelectorAll(".toggle-ex").forEach(function(t){ t.textContent = "查看詳解 ▾"; });
  updateScore();
  buildChips();
}

document.getElementById("reset").onclick = resetAll;
document.getElementById("revealAll").onclick = revealAll;
renderApp();
updateScore();
</script>
