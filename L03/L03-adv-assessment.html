<style>
:root{

.btn-bad{background:var(--bad);color:#fff}

.qresult.bad{background:#fdeeee;border:1px solid #f3c1c1;color:#9c2222}

.toggle-ex{margin-top:10px;border:1px solid #aab4f0;background:#eef1ff;color:#3b5bdb;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;padding:5px 14px;transition:.12s}

@media (max-width:600px){.ex-grid{grid-template-columns:1fr}}
footer.wrap{padding-bottom:30px;color:var(--muted);font-size:12px}
.speech-note{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;max-width:88vw;background:#1f2430;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.35);text-align:center;line-height:1.5}

"use strict";
var DATA = {"num": 3, "en": "The Necklace", "zh": "進階評量｜第 3 課", "sections": [{"id": "s1", "type": "word", "title": "一、文意字彙", "subtitle": "1.～6. 題，填入適當的字彙，以完成該句。7.～8. 題，選出適當的字彙，以完成該句。9.～10. 題，選出與句中畫底線的字意思最接近的答案。（每題 2 分，共 20 分）", "points": 20, "questions": [{"no": 1, "pts": 2, "type": "word", "sent": "The boys were <span class='hint'>p d</span> for helping a lady pick up the things she dropped.", "answer": "praised", "accept": ["praised"], "ex": {"clue": "p…d（稱讚；表揚）", "words": "praise v. 稱讚；表揚", "grammar": "were praised 為被動語態 be + Vpp；for 在此表原因「因為……」。", "trans": "那些男孩因為幫助一位女士撿起她掉落的物品而受到稱讚。"}, "id": "q1"}, {"no": 2, "pts": 2, "type": "word", "sent": "Dustin is in <span class='hint'>d t</span>, and he has to pay back a small amount of money every month.", "answer": "debt", "accept": ["debt"], "ex": {"clue": "in d…t（負債）", "words": "debt n. 債務；be in debt 負債", "grammar": "be in debt「負債」；pay back「償還」。", "trans": "達斯汀負債，他每個月都必須償還一小筆錢。"}, "id": "q2"}, {"no": 3, "pts": 2, "type": "word", "sent": "The videotape shows that a man in a gray jacket stole the <span class='hint'>v e</span> necklace from the store.", "answer": "valuable", "accept": ["valuable"], "ex": {"clue": "v…e necklace（貴重的項鍊）", "words": "valuable adj. 貴重的；有價值的", "grammar": "valuable 為形容詞，修飾後面的名詞 necklace「項鍊」。", "trans": "監視錄影帶顯示，一名穿灰色夾克的男子從店裡偷走了那條貴重的項鍊。"}, "id": "q3"}, {"no": 4, "pts": 2, "type": "word", "sent": "The constant war has <span class='hint'>f d</span> many people in the country to leave their homes.", "answer": "forced", "accept": ["forced"], "ex": {"clue": "f…d sb. to V（迫使某人做某事）", "words": "force v. 迫使；constant adj. 持續不斷的", "grammar": "has forced 為現在完成式；force sb. to V「迫使某人做某事」。", "trans": "持續的戰爭迫使該國許多人離開家園。"}, "id": "q4"}, {"no": 5, "pts": 2, "type": "word", "sent": "The surface of the lake was <span class='hint'>s g</span> as the sun shone on it.", "answer": "sparkling", "accept": ["sparkling"], "ex": {"clue": "s…g（閃閃發光的）", "words": "sparkling adj. 閃閃發光的；閃爍的", "grammar": "was sparkling 為過去進行式，描述陽光照射下湖面閃閃發光；as 表「當……的時候」。", "trans": "陽光照耀下，湖面閃閃發光。"}, "id": "q5"}, {"no": 6, "pts": 2, "type": "word", "sent": "Cora is a famous <span class='hint'>j y</span> designer, and this diamond ring is one of her best works.", "answer": "jewelry", "accept": ["jewelry", "jewellery"], "ex": {"clue": "j…y（珠寶；首飾）", "words": "jewelry n. 珠寶；首飾", "grammar": "jewelry 為不可數名詞，此處修飾 designer「珠寶設計師」。", "trans": "柯拉是位著名的珠寶設計師，這枚鑽戒是她最好的作品之一。"}, "id": "q6"}, {"no": 7, "pts": 2, "type": "choice", "stem": "The school invited a speaker to give the students some ______ about their future careers（職涯）.", "options": ["logos", "replacements", "disasters", "suggestions"], "ans": 3, "ex": {"clue": "給學生一些「建議」", "words": "suggestion n. 建議；career n. 職業生涯", "grammar": "give sb. some suggestions about…「給某人關於……的一些建議」。", "trans": "學校邀請一位講者，給學生一些關於未來職涯的建議。"}, "id": "q7"}, {"no": 8, "pts": 2, "type": "choice", "stem": "Scott is considering getting rid of his old TV and ______ it with a new one.", "options": ["admitting", "daring", "replacing", "accepting"], "ans": 2, "ex": {"clue": "用新的「汰換」舊的", "words": "replace v. 替換；get rid of 丟棄；除掉", "grammar": "consider + V-ing「考慮做某事」；replace A with B「用 B 替換 A」。", "trans": "史考特正考慮丟掉他的舊電視，並用一台新的來替換。"}, "id": "q8"}, {"no": 9, "pts": 2, "type": "choice", "stem": "I admire Ms. Stewart for her wisdom and positive spirit; she inspires me to do my best.", "options": ["research", "include", "respect", "persuade"], "ans": 2, "ex": {"clue": "admire＝尊敬；敬佩", "words": "admire v. 欽佩；respect v. 尊敬；敬佩", "grammar": "admire（欽佩）的意思最接近 respect（尊敬、敬佩）。", "trans": "我很欽佩史都華女士的智慧與積極的精神；她激勵我盡全力做到最好。"}, "id": "q9"}, {"no": 10, "pts": 2, "type": "choice", "stem": "Sally is a popular young woman with a charming personality.", "options": ["an attractive", "an embarrassing", "a traditional", "a prepared"], "ans": 0, "ex": {"clue": "charming＝迷人的", "words": "charming adj. 迷人的；attractive adj. 迷人的；有吸引力的", "grammar": "charming（迷人的）的意思最接近 attractive（迷人的、有吸引力的）。", "trans": "莎莉是個受歡迎的年輕女子，擁有迷人的個性。"}, "id": "q10"}]}, {"id": "s2", "type": "choice", "title": "二、語法測驗", "subtitle": "選出一個最適當的答案。（每題 2 分，共 16 分）", "points": 16, "questions": [{"no": 11, "pts": 2, "stem": "To look neat, Marcus usually irons his shirts before ______ them on.", "options": ["putting", "put", "to put", "puts"], "ans": 0, "ex": {"clue": "before + V-ing 時間副詞片語", "words": "neat adj. 整齊的；iron v. 熨燙；put sth. on 穿上", "grammar": "此句為主動的分詞構句，保留表時間順序的從屬連接詞 before，其後接主動動名詞 putting（before + V-ing），構成時間副詞片語。", "trans": "為了看起來整齊，馬克斯通常在穿上襯衫前先把它們熨平。"}, "id": "q11"}, {"no": 12, "pts": 2, "stem": "Andrew asked the girl ______ she wanted to go to a movie with him.", "options": ["which", "what", "that", "whether"], "ans": 3, "ex": {"clue": "ask + 是否名詞子句", "words": "whether conj. 是否", "grammar": "if/whether 表「是否」，引導名詞子句作為動詞 ask 的受詞，故用 whether。", "trans": "安德魯問那個女孩是否想跟他一起去看電影。"}, "id": "q12"}, {"no": 13, "pts": 2, "stem": "The harbor is ______ more beautiful at night because of the colorful lights.", "options": ["farther", "very", "much", "many"], "ans": 2, "ex": {"clue": "比較級前的強調副詞", "words": "harbor n. 港灣；comparative 比較級", "grammar": "形容詞比較級 more beautiful 前可加 much/a lot/far/even 等副詞強調程度，故用 much；very 不能用於比較級前。", "trans": "因為繽紛的燈光，這座港灣在夜晚美麗得多。"}, "id": "q13"}, {"no": 14, "pts": 2, "stem": "Olivia hasn't replied to my message yet, so I'm not certain ______ she is going to join us for dinner.", "options": ["what", "which", "this", "if"], "ans": 3, "ex": {"clue": "形容詞 certain 後的 whether/if 子句", "words": "certain adj. 確定的；reply to 回覆", "grammar": "if/whether 表「是否」，引導名詞子句接在形容詞 certain 後面，故用 if。", "trans": "奧莉維亞還沒回覆我的訊息，所以我不確定她是否要跟我們一起吃晚餐。"}, "id": "q14"}, {"no": 15, "pts": 2, "stem": "Although ______ by heights, Paula decided to go on a helicopter ride.", "options": ["frightening", "frightened", "frightens", "frighten"], "ans": 1, "ex": {"clue": "although + 被動分詞構句", "words": "frightened adj. 感到害怕的；helicopter n. 直升機", "grammar": "此句為被動的分詞構句，被動動作用 Vpp（frightened），並保留從屬連接詞 although，省略主詞與 be 動詞（Although she was frightened by heights…）。", "trans": "雖然葆拉懼高，她仍決定去搭直升機。"}, "id": "q15"}, {"no": 16, "pts": 2, "stem": "The government has spent millions of dollars ______ the safety of the overpass.", "options": ["to improve", "improved", "improving", "improve"], "ans": 2, "ex": {"clue": "spend + 錢 + on N/V-ing", "words": "overpass n. 高架橋；safety n. 安全", "grammar": "表花費的動詞 spend + 錢 + on + N/V-ing，故後接動名詞 improving。", "trans": "政府已花費數百萬美元改善高架橋的安全。"}, "id": "q16"}, {"no": 17, "pts": 2, "stem": "The speed of treatment plays a key role in ______ patients in a serious condition can be saved.", "options": ["if", "whether", "that", "which"], "ans": 1, "ex": {"clue": "介系詞後的 whether 子句", "words": "treatment n. 治療；in a serious condition 情況危急", "grammar": "whether 表「是否」，引導名詞子句；接在介系詞 in 後面時不能用 if，故用 whether。", "trans": "治療的速度在危重病患能否獲救方面扮演關鍵角色。"}, "id": "q17"}, {"no": 18, "pts": 2, "stem": "If ______ in the correct way, this device may be damaged.", "options": ["not used", "it does not use", "not using", "it used not"], "ans": 0, "ex": {"clue": "if + 被動分詞構句（含否定）", "words": "device n. 裝置；damage v. 損壞", "grammar": "此句為被動的分詞構句，被動動作用 Vpp（used），並保留表條件的從屬連接詞 if 與否定詞 not：If not used＝If it is not used。", "trans": "如果沒有以正確方式使用，這台裝置可能會受損。"}, "id": "q18"}]}, {"id": "s3", "type": "cloze", "ptitle": "綜合測驗", "title": "三、綜合測驗", "subtitle": "依短文文意，選出一個最適合該空格的答案。（每題 2 分，共 10 分）", "points": 10, "passages": [{"title": "短文", "text": "Like Maupassant, the American writer O. Henry also often used short stories to show ordinary people's lives. The Gift of the Magi is a classic example. In the story, Della and Jim are a young couple who __19__ and are troubled by money all the time. They only earn 20 dollars a week __20__ and often lack essential items for daily life. As Christmas is coming, they are both worried about having nothing special __21__ to the other. Della sells her long hair to buy a chain for Jim's watch. __22__, Jim sells his watch to buy combs for Della's hair. When __23__ gifts, they realize that their actions turned out to make the presents useless. However, they also understand the thought behind a gift is more important than how much it costs.", "questions": [{"no": 19, "pts": 2, "stem": "", "options": ["keep their social status", "live in poverty", "seem satisfied with their lives", "care little about wealth"], "ans": 1, "ex": {"clue": "年輕夫妻為錢所苦，過著窮困生活", "words": "poverty n. 貧困；trouble v. 使煩惱", "grammar": "live in poverty「過著貧窮的生活」，與後方 be troubled by money（為金錢煩惱）語意連貫。", "trans": "黛拉和吉姆是一對年輕夫妻，他們過著貧窮的生活，且總是為錢所苦。"}, "id": "q19"}, {"no": 20, "pts": 2, "stem": "", "options": ["at most", "at least", "at first", "at last"], "ans": 0, "ex": {"clue": "一週最多賺二十美元", "words": "at most 至多；at least 至少", "grammar": "at most「至多」，呼應前面 only earn 20 dollars（只賺二十美元），強調收入微薄。", "trans": "他們一週最多只賺二十美元，常常缺少生活必需品。"}, "id": "q20"}, {"no": 21, "pts": 2, "stem": "", "options": ["gave", "giving", "give", "to give"], "ans": 3, "ex": {"clue": "不定詞當形容詞後位修飾 nothing", "words": "nothing special 沒有特別的東西", "grammar": "不定詞 to V 在此當形容詞，後位修飾前面的不定代名詞 nothing，故用 to give。", "trans": "聖誕節快到了，他們都很煩惱沒有特別的東西可以送給對方。"}, "id": "q21"}, {"no": 22, "pts": 2, "stem": "", "options": ["In other words", "For instance", "Similarly", "Still"], "ans": 2, "ex": {"clue": "前後句為並列關係", "words": "similarly adv. 同樣地；相似地", "grammar": "由上下文語意可知黛拉賣髮買鏈、吉姆賣錶買梳，前後句為並列關係，故用轉折詞 Similarly 表達「同樣地、相似地」。", "trans": "黛拉賣掉長髮為吉姆的手錶買鏈子；同樣地，吉姆賣掉手錶為黛拉的頭髮買梳子。"}, "id": "q22"}, {"no": 23, "pts": 2, "stem": "", "options": ["to exchange", "exchange", "exchanged", "exchanging"], "ans": 3, "ex": {"clue": "when + 主動分詞構句", "words": "exchange v. 交換；turned out 結果是", "grammar": "此句為主動的分詞構句，主動動作用 V-ing（exchanging），並保留從屬連接詞 when；When exchanging gifts＝When they exchanged gifts。", "trans": "交換禮物時，他們發現自己的行為反而使禮物派不上用場。"}, "id": "q23"}]}]}, {"id": "s4", "type": "choice", "title": "四、對話", "subtitle": "根據對話選一個最適當的答案。（每題 3 分，共 15 分）", "points": 15, "questions": [{"no": 24, "pts": 3, "stem": "Ricky: Excuse me. My laptop isn't working. Could you check it for me?<br>Craig: ______ Let me see... Well, the battery is getting less healthy. You should send it to the manufacturer（製造商）for repair.<br>Ricky: OK, I will. Thanks.", "options": ["Forget it.", "By all means.", "Good point.", "Of course not."], "ans": 1, "ex": {"clue": "爽快答應請求，用 By all means.", "words": "By all means. 當然好；沒問題；manufacturer n. 製造商", "grammar": "克雷格答應用瑞奇檢查筆電，By all means.（當然好）最符合語境。", "trans": "瑞奇：不好意思，我的筆電壞了。可以幫我檢查一下嗎？克雷格：當然好。讓我看一下……電池的健康狀況越來越差，你應該把它送修給製造商。瑞奇：好，我會的。謝謝。"}, "id": "q24"}, {"no": 25, "pts": 3, "stem": "Elle: Oh, no. There isn't enough money in my purse.<br>Jude: Don't worry. I can pay for our meals. My treat.<br>Elle: Really? ______ Thank you so much.", "options": ["I'd be happy to help.", "I owe you one.", "I can make it.", "No worries."], "ans": 1, "ex": {"clue": "受人恩惠，說「我欠你一次人情」", "words": "I owe you one. 我欠你一次人情；My treat. 我請客", "grammar": "裘德要請客，艾兒感動道謝並說 I owe you one.「我欠你一次人情」。", "trans": "艾兒：喔不，我的錢包裡錢不夠。裘德：別擔心，我可以付餐費，我請客。艾兒：真的嗎？我欠你一次人情，非常謝謝你。"}, "id": "q25"}, {"no": 26, "pts": 3, "stem": "Ollie: You look more relaxed these days. What happened?<br>Heather: Remember I had a student loan（貸款）in college? Well, ______.<br>Ollie: Good for you! No wonder you're in such a good mood.", "options": ["I finally paid it off last month", "the school didn't accept me", "I'm trying to save more money", "the bank finally let me apply for it"], "ans": 0, "ex": {"clue": "「我上個月終於還清了」", "words": "pay off 還清；student loan 學生貸款", "grammar": "懷瑟提到過去的大學學貸，I finally paid it off last month「我上個月終於還清了」，故用過去式。", "trans": "奧利：你這些日子看起來輕鬆多了，怎麼了？懷瑟：記得我大學時的學貸嗎？我上個月終於還清了。奧利：太好了！難怪你心情這麼好。"}, "id": "q26"}, {"no": 27, "pts": 3, "stem": "Maggie: I have to decorate our classroom for the welcome party. Could you give me a hand after school?<br>Justin: I'd love to, but ______. Sorry.<br>Maggie: That's fine. I'll try doing it myself, anyway.", "options": ["it won't take me too long to finish it.", "you don't need to do me a favor.", "I have a piano class at 5 p.m.", "I think I can help you then."], "ans": 2, "ex": {"clue": "先說願意，但以時間衝突婉拒", "words": "give sb. a hand 幫某人一把；piano class 鋼琴課", "grammar": "賈斯汀說 I'd love to, but…「我很樂意，但是……」並道歉，最合理的理由是時間衝突：I have a piano class at 5 p.m.「我下午五點有鋼琴課」。", "trans": "瑪姬：我得為迎新派對布置教室。放學後可以幫我一把嗎？賈斯汀：我很樂意，但是我下午五點有鋼琴課，抱歉。瑪姬：沒關係，反正我自己試試看。"}, "id": "q27"}, {"no": 28, "pts": 3, "stem": "Greta: I'm thinking about buying the necklace in this shop window to wear on my first date with Mike.<br>Claire: It does look beautiful, but I'm afraid ______. I don't think it's worth buying. Besides, a pretty dress is enough for you.<br>Greta: Maybe you're right. I don't need it to impress him.", "options": ["it costs a lot more than you can imagine", "it looks great on you", "I can lend you mine for one day", "it's a good gift for your boyfriend"], "ans": 0, "ex": {"clue": "勸退：恐怕它貴得超乎想像", "words": "be afraid… 恐怕……；worth buying 值得購買", "grammar": "克萊兒想勸葛蕾塔別買，用 I'm afraid it costs a lot more than you can imagine「恐怕它貴得超乎你的想像」，與後文 not worth buying 呼應。", "trans": "葛蕾塔：我考慮買下這家店櫥窗裡的項鍊，第一次跟麥克約會要戴。克萊兒：它看起來的確漂亮，但我恐怕它貴得超乎你的想像。我認為不值得買，況且一條漂亮的裙子對你來說就夠了。葛蕾塔：也許你說得對，我不需要靠它來讓他印象深刻。"}, "id": "q28"}]}, {"id": "s5", "type": "cloze", "title": "五、閱讀測驗", "subtitle": "閱讀下列短文，選出最適當的答案。（每題 3 分，共 18 分）", "points": 18, "passages": [{"title": "A", "text": "The chart below shows how Kelly used her monthly income in January and February.", "questions": [{"no": 29, "pts": 3, "stem": "Which expenses stayed the same over the two months?", "options": ["Transportation and clothing.", "Entertainment and food.", "Clothing and Electricity.", "Rent and transportation."], "ans": 3, "ex": {"clue": "由圖表，兩個月花費不變的項目", "words": "expense n. 開銷；transportation n. 交通", "grammar": "依圖表資料，一月與二月維持不變的開銷為租金與交通，故 (D) 正確。", "trans": "哪一項開銷在兩個月之間維持不變？租金與交通。"}, "id": "q29"}, {"no": 30, "pts": 3, "stem": "Which spending decreased the most from January to February?", "options": ["Clothing.", "Rent.", "Water and electricity.", "Entertainment."], "ans": 0, "ex": {"clue": "由圖表，一月到二月降幅最大的項目", "words": "decrease v. 減少；spending n. 花費", "grammar": "依圖表資料，服飾類的花費從一月到二月下降最多，故 (A) 正確。", "trans": "哪一項花費從一月到二月下降最多？服飾。"}, "id": "q30"}, {"no": 31, "pts": 3, "stem": "Which of the following is true?", "options": ["Food and groceries are always the largest bill for Kelly.", "Kelly saved more money in February than in January.", "Kelly saves a fixed amount of money before she spends any.", "Kelly spent around twenty percent of her income on basic needs."], "ans": 1, "ex": {"clue": "由圖表判斷正確敘述", "words": "saved 儲蓄；income n. 收入", "grammar": "依圖表資料，凱莉二月存的錢比一月多，故 (B) 正確。", "trans": "下列何者正確？凱莉二月存的錢比一月多。"}, "id": "q31"}]}, {"title": "B", "text": "Guy de Maupassant was a famous French writer in the 19th century. He developed a strong interest in literature at a young age. Maupassant was influenced by his mother, who loved reading. She later introduced him to Gustave Flaubert, a mentor who led him into writing. Maupassant served in the army during a war, where he saw the cruelty of human behavior in difficult times. These life experiences shaped his writing and inspired him to focus on real life and human nature.<br><br>Maupassant wrote short stories that are easy to read but powerful, often leaving readers with strong feelings and deep thoughts. He liked to write about ordinary people and daily life, showing human weakness and the realities of life. One of his well-known works, Boule de Suif, is set during a war and shows how people act selfishly while facing danger. Another story, The Horla, focuses on fear and the human mind, describing a man who believes an unseen power is controlling him. During his lifetime, Maupassant wrote more than 300 short stories. Many of them leave a lasting impression on readers.", "questions": [{"no": 32, "pts": 3, "stem": "What CAN'T we learn about Maupassant's life from this passage?", "options": ["He often used simple language to create meaningful stories.", "He was known for both short stories and poetry.", "His life as a soldier greatly influenced his writing style.", "His mother played a big role in his passion for writing."], "ans": 1, "ex": {"clue": "文中未提及詩作", "words": "poetry n. 詩；influence v. 影響", "grammar": "全文只提到他寫了三百多篇短篇故事，並未提及詩作，故 (B)「以短篇故事與詩作聞名」無法從本文得知。", "trans": "下列何者無法從本文得知？他以短篇故事和詩作聞名。"}, "id": "q32"}, {"no": 33, "pts": 3, "stem": "What does the word \"mentor\" in the first paragraph mean?", "options": ["Someone who rates and judges people's work.", "Someone who gives commands for tasks.", "Someone who provides guidance and advice.", "Someone who borrows ideas and inspiration."], "ans": 2, "ex": {"clue": "mentor＝導師", "words": "mentor n. 導師；指引者", "grammar": "文中 Flaubert「led him into writing（引領他進入寫作）」，故 mentor 指提供指導與建議的人 (C)。", "trans": "第一段中 mentor（導師）指的是提供指導與建議的人。"}, "id": "q33"}, {"no": 34, "pts": 3, "stem": "What do the two stories mentioned in the second paragraph have in common?", "options": ["They both describe life in wartime.", "They both feature what people are afraid of.", "They both show the weak side of human nature.", "They both discuss how desire can change people."], "ans": 2, "ex": {"clue": "兩篇故事都呈現人性軟弱的一面", "words": "human nature 人性；weakness n. 弱點", "grammar": "Boule de Suif 展現人們面對危險時的自私，The Horla 描述恐懼與失控，兩者都呈現人性的軟弱面，故 (C) 正確。", "trans": "第二段提到的兩篇故事有何共同點？它們都呈現人性軟弱的一面。"}, "id": "q34"}]}]}, {"id": "s6", "type": "fill", "title": "六、填充", "subtitle": "依提示字母填入適當的字彙，以完成句子。（每格 2 分，共 8 分）", "points": 8, "questions": [{"no": 35, "pts": 2, "cn": "Bruno沒料到這麼多年後偶遇他的老同學比爾。", "en": "Bruno did not expect to ((0)) ((1)) his old classmate Bill after so many years.", "blanks": [{"label": "(r)(n)", "ans": "run", "accept": ["run"]}, {"label": "(i)(o)", "ans": "into", "accept": ["into"]}], "ex": {"clue": "r…n i…o（偶然遇見）", "words": "run into 偶然遇見；偶遇", "grammar": "expect to + V；run into「不期而遇」，run 為原形動詞。", "trans": "布魯諾沒料到這麼多年後會偶遇他的老同學比爾。"}, "id": "q35"}, {"no": 36, "pts": 2, "cn": "Gillian為她的公寓買了一套家具，儘管它非常昂貴。", "en": "Gillian bought a set of furniture for her apartment even though it ((0)) a ((1)).", "blanks": [{"label": "(c)(t)", "ans": "cost", "accept": ["cost"]}, {"label": "(f)(e)", "ans": "fortune", "accept": ["fortune"]}], "ex": {"clue": "c…t a f…e（花一大筆錢）", "words": "cost v. 花費；fortune n. 一大筆錢", "grammar": "cost a fortune「花一大筆錢」；even though「儘管」引導讓步子句。", "trans": "吉莉安為她的公寓買了一套家具，儘管它非常昂貴。"}, "id": "q36"}]}, {"id": "s7", "type": "sentence", "title": "七、句型練習", "subtitle": "將所給的字詞重組成完整句子，或依提示合併／改寫句子。（第 37.～39. 題每題 3 分，第 40. 題 4 分，共 13 分）", "points": 13, "questions": [{"no": 37, "pts": 3, "task": "went inside to read a magazine / feeding / Beth / her dog in the yard / after（句子重組）", "answer": "Beth went inside to read a magazine after feeding her dog in the yard.", "accept": ["Beth went inside to read a magazine after feeding her dog in the yard", "beth went inside to read a magazine after feeding her dog in the yard", "After feeding her dog in the yard, Beth went inside to read a magazine"], "ex": {"clue": "after + V-ing 時間副詞片語", "words": "feed v. 餵食；magazine n. 雜誌", "grammar": "after + V-ing 表示「在……之後」，為時間副詞片語，故用 after feeding her dog in the yard。", "trans": "貝絲在院子裡餵完狗之後，走進屋裡去讀雜誌。"}, "id": "q37"}, {"no": 38, "pts": 3, "task": "Everyone is curious.<br>Will the talented baseball player play in the MLB next season or not?（以 if/whether 名詞子句合併）", "answer": "Everyone is curious whether the talented baseball player will play in the MLB next season (or not).", "accept": ["Everyone is curious whether the talented baseball player will play in the MLB next season (or not)", "Everyone is curious whether the talented baseball player will play in the MLB next season", "Everyone is curious if the talented baseball player will play in the MLB next season (or not)", "everyone is curious whether the talented baseball player will play in the MLB next season"], "ex": {"clue": "be curious + if/whether 子句", "words": "curious adj. 好奇的；talented adj. 有天賦的", "grammar": "疑問句改為 if/whether 引導的名詞子句，作 be curious 的補語；whether 子句可保留 or not。", "trans": "每個人都很好奇那位有天賦的棒球選手下個賽季是否會在大聯盟打球。"}, "id": "q38"}, {"no": 39, "pts": 3, var NORM_RE = /[\s\.,，。;；:：!！?？"'“”‘’（）()\[\]【】\-、_]/g;
function norm(s){return (s==null?"":String(s)).toLowerCase().replace(NORM_RE,"");}
function hasAny(user, arr){
  var u = norm(user);
  return arr.some(function(a){ return u === norm(a); });
}

function exPanel(q, openAll){

  }
  if(ans) grid.appendChild(exBlock("ans", "正確答案", ans));

function speak(text){
  try{
    if(!text) return;
    if(typeof window === "undefined") return;
    if(!window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined"){
      speechUnsupported();
      return;
    }
    var s = window.speechSynthesis;
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = "en-US";
    u.rate = 0.9;
    try{
      var vs = s.getVoices ? s.getVoices() : [];
      var v = null;
      for(var i = 0; i < vs.length; i++){ if(/^en[-_]?US/i.test(vs[i].lang || "")){ v = vs[i]; break; } }
      if(!v){ for(i = 0; i < vs.length; i++){ if(/^en/i.test(vs[i].lang || "")){ v = vs[i]; break; } } }
      if(v) u.voice = v;
    }catch(e1){}
    var np = (typeof navigator !== "undefined" && navigator) ? (navigator.platform || "") : "";
    var touch = false;
    try{ touch = ("ontouchstart" in window) || ((navigator.maxTouchPoints || 0) > 0); }catch(e3){}
    var iOS = /iP(hone|ad|od)/.test(np) || (np === "MacIntel" && (navigator.maxTouchPoints || 0) > 1);
    if(iOS || touch){
      // Mobile (iOS Safari / Android Chrome & Edge): cancel() before speak() is the
      // known Android workaround for silent first utterance, but pause()/resume()
      // must NOT be used — it can leave the synthesis paused and produce no sound.
      s.cancel();
      s.speak(u);
      return;
    }
    s.cancel();
    s.speak(u);
    // Chrome/Edge desktop workaround: wake the engine with pause()/resume()
    try{
      if(!s.paused){
        s.pause();
        s.resume();
      }
    }catch(e2){}
  }catch(e){}
}

}

function fullSentence(q){
  if(q.speakText) return q.speakText;
  if(q.en){
    return q.en.replace(/\(\((\d+)\)\)/g, function(m, n){ return (q.blanks[+n] || {}).ans || ""; });
  }
  if(q.sent){
    var s = String(q.sent).replace(/<span class='hint'>[^<]*<\/span>/g, q.answer || "");
    return s.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  }
  return String(q.stem || "").replace(/_{3,}/g, q.answer || (q.options ? q.options[q.ans] : "") || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
}

function sentChunk(text, no){
  var chs = splitSents(text);
  for(var i = 0; i < chs.length; i++){
    if(chs[i].indexOf("__" + no + "__") >= 0) return chs[i];
  }
  return "";
}

function sentenceWithBlank(text, no, ans){
  var ch = sentChunk(text, no);
  if(!ch) return "";
  ch = String(ch).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  // drop the OCR artifact period right after the blank when the sentence continues
  ch = ch.replace(new RegExp("__" + no + "__\\.(?=\\s*[a-z,])"), "__" + no + "__");
  var parts = String(ans || "").split("\u2026");
  var i = 0;
  var out = ch.replace(new RegExp("__" + no + "__", "g"), function(){
    var v = parts.length > 1 ? (parts[i] || "") : (ans || "");
    i++;
    return v.trim();
  });
  return out.replace(/\s+/g, " ").replace(/^[\s.,;:!?]+/, "").trim();
}

function badgeClean(s){
  return String(s).replace(/<span class='bk'>（\d+）<\/span>\.(?=\s*[a-z,])/g, function(m){ return m.slice(0, -1); });
}

function refSentHTML(text, no){
  var chs = splitSents(text);
  var idx = -1;
  for(var i = 0; i < chs.length; i++){
    if(chs[i].indexOf("__" + no + "__") >= 0){ idx = i; break; }
  }
  if(idx < 0) return "";
  var cur = chs[idx].replace(/__(\d+)__/g, function(m, n){ return "<span class='bk'>（" + n + "）</span>"; });
  var out = "";
  if(idx > 0 && /^\s*__\d+__/.test(chs[idx])){
    var prev = chs[idx - 1].replace(/__(\d+)__/g, function(m, n){ return "<span class='bk'>（" + n + "）</span>"; });
    out += "<span class='ctx-prev'>" + badgeClean(prev) + "</span>";
  }
  out += "<span class='ctx-cur'>" + badgeClean(cur) + "</span>";
  return out;
}

function splitSents(text){
  var t = String(text || "");
  var chunks = [];
  var start = 0;
  for(var i = 0; i < t.length; i++){
    var c = t.charAt(i);
    if(c === "." || c === "!" || c === "?"){
      var prev = t.slice(Math.max(0, i - 12), i);
      if(/[0-9]+__$/.test(prev)){
        var nx = t.slice(i + 1).replace(/^\s+/, "");
        if(nx && /^[a-z,]/.test(nx)) continue;
      }
      i++;
      while(i < t.length && /[.!?]/.test(t.charAt(i))) i++;
      var ch = t.slice(start, i).trim().replace(/\s+/g, " ");
      if(ch) chunks.push(ch);
      start = i;
      i--;
    }
  }
  var tail = t.slice(start).trim().replace(/\s+/g, " ");
  if(tail) chunks.push(tail);
  return chunks;
}

function goToQuestion(card, no){
  try{
    var box = null;
    [].forEach.call(card.querySelectorAll(".q"), function(b){
      var qno = b.querySelector(".qno");
      if(!qno) return;
      var t = String(qno.textContent || qno._innerSet || "").replace(/\s+/g, "");
      if(t === no + ".") box = b;
    });
    if(!box) return;
    if(typeof box.scrollIntoView === "function") box.scrollIntoView({behavior:"smooth", block:"start"});
    var ex = box.querySelector(".ex");
    if(ex){
      ex.classList.add("show");
      var tg = box.querySelector(".toggle-ex");
      if(tg) tg.textContent = "收合詳解 ▴";
    }
    box.classList.add("jump-hl");
    if(typeof setTimeout !== "undefined") setTimeout(function(){ try{ box.classList.remove("jump-hl"); }catch(e){} }, 1600);
  }catch(e){}
}

function highlightSentence(box, no){
  try{
    var card = box.parentElement || box.parent;
    if(!card) return;
    var target = null;
    [].forEach.call(card.querySelectorAll(".passage"), function(pa){
      if(!target) target = pa.querySelector("span[data-no=" + no + "]");
    });
    if(!target) return;
    [].forEach.call(card.querySelectorAll(".passage .sent"), function(s){ if(s.classList) s.classList.remove("hl"); });
    target.classList.add("hl");
    if(typeof target.scrollIntoView === "function") target.scrollIntoView({behavior:"smooth", block:"center"});
    if(typeof requestAnimationFrame === "function"){
      clearTimeout(target._hlTimer);
      target._hlTimer = setTimeout(function(){ target.classList.remove("hl"); }, 3600);
    }
  }catch(e){}
}

/* ---------- rendering ---------- */
function renderApp(){
  var app = document.getElementById("app");
  DATA.sections.forEach(function(sec){
    var card = el("section", "card");
    card.id = sec.id;
    var head = el("div", "sec-head");
    head.appendChild(el("h2", null, sec.title));
    head.appendChild(el("p", "sub", sec.subtitle));
    var ssc = el("span", "sec-score", "本節得分 <b id='ss-"+sec.id+"'>0</b> / <span>"+sec.points+"</span>");
    head.appendChild(ssc);
    card.appendChild(head);

    if(sec.type === "cloze"){
      sec.passages.forEach(function(pg){
        var pass = el("div", "passage");
        var pt = el("div", "ptitle", (sec.ptitle || "閱讀測驗 ") + pg.title);
        pass.appendChild(pt);
        var text = splitSents(pg.text).map(function(ch){
          var no = (ch.match(/__(\d+)__/) || [])[1];
          var html = ch.replace(/__(\d+)__/g, function(m, n){ return "<span class='bk'>（" + n + "）</span>"; });
          return "<span class='sent'" + (no ? " data-no='" + no + "'" : "") + ">" + badgeClean(html) + "</span>";
        }).join(" ");
        var pEl = el("p", null, text);
        pass.appendChild(pEl);
        card.appendChild(pass);
        [].forEach.call(pEl.querySelectorAll(".bk"), function(bk){
          var n = parseInt(String(bk.textContent || bk._innerSet || "").replace(/[^0-9]+/g, ""), 10);
          if(!n) return;
          bk.classList.add("bk-link");
          bk.title = "跳到第 " + n + " 題解析";
          bk.onclick = function(){ goToQuestion(card, n); };
        });
        pg.questions.forEach(function(q){
          q.speakText = sentenceWithBlank(pg.text, q.no, q.options[q.ans]);
          q.refSent = refSentHTML(pg.text, q.no);
          card.appendChild(renderQ(sec, q));
        });
      });
    } else {
      sec.questions.forEach(function(q){ card.appendChild(renderQ(sec, q)); });
    }
    app.appendChild(card);
  });
  total = 0;
  DATA.sections.forEach(function(sec){
    total += sec.points;
  });
  document.getElementById("total").textContent = total;
  buildChips();
}

function renderQ(sec, q){
  q.type = q.type || sec.type; q.sec = sec.id; q.secTitle = sec.title;
  var box = el("div", "q");
  box.setAttribute("data-qid", q.id);
  var head = el("div", "qhead");
  head.appendChild(el("span", "qno", q.no + "."));
  var dispPts = q.pts * (q.blanks ? q.blanks.length : 1);
  head.appendChild(el("span", "qpts", dispPts + " 分"));
  box.appendChild(head);

  var body = el("div", "qbody");
  var ctrl = el("div", "qctrl");
  var rbox = resultBox();

  if(q.type === "choice" || q.type === "cloze"){
    var stemText = q.stem || (q.type === "cloze" ? q.refSent : "");
    if(stemText) body.appendChild(el("p", "qstem" + (q.type === "cloze" && !q.stem ? " refsent" : ""), stemText));
    var opts = el("div", "opts");
    var selected = -1;
    q.options.forEach(function(opt, i){
      var o = el("div", "opt");
      o.innerHTML = "<span class='ol'>" + String.fromCharCode(65+i) + ".</span>" + opt;
      o.onclick = function(){
        if(box.dataset.graded === "1") return;
        Array.prototype.forEach.call(opts.children, function(c){ c.classList.remove("sel"); });
        o.classList.add("sel");
        selected = i;
      };
      opts.appendChild(o);
    });
    body.appendChild(opts);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      if(q.type === "cloze") highlightSentence(box, q.no);
      if(selected < 0){
        showInfo(rbox, "尚未選擇答案。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var ok = (selected === q.ans);
      markResult(box, rbox, q, ok);
      Array.prototype.forEach.call(opts.children, function(c, i){
        c.classList.remove("sel");
        if(i === q.ans) c.classList.add("correct");
        else if(i === selected && !ok) c.classList.add("wrong");
      });
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "vocab"){
    body.appendChild(el("p", "qstem", "請寫出「<b>" + q.answer + "</b>」的英文。"));
    var inp = el("input", "");
    inp.type = "text"; inp.placeholder = "輸入英文單字";
    body.appendChild(inp);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(q.word);
      var v = inp.value.trim();
      if(!v){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，作答後即可計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, [q.word].concat(q.accept_en || []));
      markResult(box, rbox, q, ok, q.word + "（" + q.answer + "）");
      if(ok){ inp.style.borderColor = "#2b8a3e"; } else { inp.style.borderColor = "#e03131"; }
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "word"){
    var sent = String(q.sent).replace(/<span class='hint'>([a-zA-Z]+)\s+([a-zA-Z]+)<\/span>/g, function(m, a, b){
      var missing = Math.max(1, (q.answer || "").length - a.length - b.length);
      return "<span class='hint'>" + a + "</span><span class='uhint'>" + new Array(missing + 1).join("_") + "</span><span class='hint'>" + b + "</span>";
    });
    body.appendChild(el("p", "qstem", sent));
    var inp = el("input", "");
    inp.type = "text"; inp.placeholder = "依提示字母填入單字";
    body.appendChild(inp);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      var v = inp.value.trim();
      if(!v){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，作答後即可計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, q.accept);
      markResult(box, rbox, q, ok);
      if(ok){ inp.style.borderColor = "#2b8a3e"; } else { inp.style.borderColor = "#e03131"; }
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "fill"){
    body.appendChild(el("p", "qstem", "【中文】" + q.cn));
    var sen = el("p", "qstem");
    var html = q.en.replace(/\(\((\d+)\)\)/g, function(m, n){
      var b = q.blanks[+n];
      var letters = [];
      var lm, lre = /\(([^)]+)\)/g;
      while((lm = lre.exec(b.label || ""))) letters.push(lm[1]);
      var fragA = letters[0] || "";
      var fragB = letters.length > 1 ? letters.slice(1).join("") : "";
      var missing = Math.max(1, (b.ans || "").length - fragA.length - fragB.length);
      var shown = fragA + new Array(missing + 1).join("_") + fragB;
      return ' <span class="bblank">' + shown + '</span> ';
    });
    sen.innerHTML = html;
    body.appendChild(sen);
    var abox = el("div", "fbox");
    q.blanks.forEach(function(b, n){
      var span = el("span", "lbl", "(" + (n + 1) + ")");
      var inp = el("input", "inline-in");
      inp.type = "text";
      inp.style.width = Math.min(220, Math.max(90, (b.ans || "").length * 12)) + "px";
      inp.setAttribute("data-blank", n);
      abox.appendChild(span); abox.appendChild(inp);
    });
    body.appendChild(abox);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      var ins = abox.querySelectorAll("input[data-blank]");
      var emptyAll = true;
      ins.forEach(function(ip){ if(String(ip.value || "").trim()) emptyAll = false; });
      if(emptyAll){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var oks = [];
      var all = true, any = false;
      ins.forEach(function(ip){
        var b = q.blanks[+ip.dataset.blank];
        var ok = hasAny(ip.value, b.accept);
        oks.push(ok); any = any || ok; if(!ok) all = false;
        ip.style.borderColor = ok ? "#2b8a3e" : "#e03131";
      });
      var nOk = oks.filter(Boolean).length;
      box.dataset.graded = "1";
      var pts = nOk * q.pts;
      var prev = results[q.id];
      if(prev){ score -= prev.pts; }
      results[q.id] = {ok: nOk === q.blanks.length, pts: pts};
      score += pts;
      updateScore();
      var msg = "答對 " + nOk + " / " + q.blanks.length + " 格，得 " + pts + " 分。";
      showResult(box, rbox, all, msg);
      expandEx(box);
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "sentence"){
    body.appendChild(el("p", "qstem", q.task));
    var ta = el("textarea", "");
    ta.placeholder = "請寫下你的句子";
    body.appendChild(ta);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(q.answer);
      var v = ta.value.trim();
      if(!v){
        showInfo(rbox, "尚未寫下句子。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, q.accept);
      markResult(box, rbox, q, ok);
      if(!ok){
        rbox.innerHTML = "尚未完全符合參考答案。請先參考下方「解題線索／文法句型」，再自行判斷是否答對。";
        var self = el("div", "qctrl");
        var y = el("button", "btn btn-ok", "我寫對了");
        var n = el("button", "btn btn-bad", "我寫錯了");
        y.onclick = function(){ markResult(box, rbox, q, true); self.remove(); };
        n.onclick = function(){ markResult(box, rbox, q, false); self.remove(); };
        self.appendChild(y); self.appendChild(n);
        rbox.appendChild(self);
      }
    };
    ctrl.appendChild(chk);
  }

  box.appendChild(body);
  box.appendChild(ctrl);
  box.appendChild(rbox);
  var ex = exPanel(q, false);
  box.appendChild(ex);
  return box;
}

function markResult(box, rbox, q, ok, ansText){
  box.dataset.graded = "1";
  var prev = results[q.id];
  if(prev){ score -= prev.pts; }
  results[q.id] = {ok: ok, pts: ok ? q.pts : 0};
  score += ok ? q.pts : 0;
  updateScore();
  if(ok){
    showResult(box, rbox, true, "答對了！得 " + q.pts + " 分。");
  } else {
    showResult(box, rbox, false, "答錯了。正確答案：" + (ansText || q.answer));
  }
  var chip = document.getElementById("chip-" + q.sec);
  if(chip){
    chip.textContent = q.secTitle + " " + sectionScore(q.sec) + "/" + sectionPoints(q.sec);
  }
  expandEx(box);
}

function expandEx(box){
  var ex = box.querySelector(".ex");
  var tg = box.querySelector(".toggle-ex");
  if(ex && !ex.classList.contains("show")){ ex.classList.add("show"); }
  if(tg){ tg.textContent = "收合詳解 ▴"; }
}

function sectionPoints(secId){
  var s = DATA.sections.filter(function(x){return x.id===secId;})[0];
  return s ? s.points : 0;
}
function sectionScore(secId){
  var tot = 0;
  Object.keys(results).forEach(function(k){
    var r = results[k];
    var q = questionById(k);
    if(q && q.sec === secId) tot += r.pts;
  });
  return tot;
}
function questionById(qid){
  var found = null;
  DATA.sections.forEach(function(sec){
    var list = [];
    if(sec.type === "cloze"){ sec.passages.forEach(function(p){ list = list.concat(p.questions); }); }
    else { list = sec.questions; }
    list.forEach(function(q){ if(q.id === qid){ found = q; } });
  });
  return found;
}

function updateScore(){
  document.getElementById("score").textContent = score;
  var p = total ? Math.round(score / total * 100) : 0;
  document.getElementById("pbar").style.width = p + "%";
  DATA.sections.forEach(function(sec){
    var s = document.getElementById("ss-" + sec.id);
    if(s) s.textContent = sectionScore(sec.id);
  });
}

function buildChips(){
  var c = document.getElementById("secchips");
  c.innerHTML = "";
  DATA.sections.forEach(function(sec){
    var ch = el("button", "chip", sec.title + " 0/" + sec.points);
    ch.type = "button";
    ch.id = "chip-" + sec.id;
    ch.onclick = function(){
      var el = document.getElementById(sec.id);
      if(el) el.scrollIntoView({behavior: "smooth", block: "start"});
    };
    c.appendChild(ch);
  });
  updateChipActive();
}

function updateChipActive(){
  var mark = null;
  DATA.sections.forEach(function(sec){
    var el = document.getElementById(sec.id);
    var ch = document.getElementById("chip-" + sec.id);
    if(!el || !ch) return;
    var r = el.getBoundingClientRect();
    if(r.top <= 170) mark = ch;
  });
  document.querySelectorAll("#secchips .chip").forEach(function(ch){
    if(ch === mark) ch.classList.add("on");
    else ch.classList.remove("on");
  });
}
if(typeof window !== "undefined"){
  window.addEventListener("scroll", updateChipActive, {passive: true});
}

function revealAll(){
  document.querySelectorAll("#app .q").forEach(function(box){
    var q = questionById(box.dataset.qid);
    if(!q) return;
    var ex = box.querySelector(".ex");
    if(ex) ex.classList.add("show");
    var ins = box.querySelectorAll("input[type=text],textarea");
    if(q.type === "vocab"){
      if(ins[0]) ins[0].value = q.word;
    } else if(q.type === "word"){
      if(ins[0]) ins[0].value = q.answer;
    } else if(q.type === "fill"){
      box.querySelectorAll("input[data-blank]").forEach(function(ip){
        ip.value = q.blanks[+ip.dataset.blank].ans;
      });
    } else if(q.type === "sentence"){
      if(ins[0]) ins[0].value = q.answer;
    } else if(q.type === "choice" || q.type === "cloze"){
      box.querySelectorAll(".opt").forEach(function(o, i){
        if(i === q.ans) o.classList.add("correct");
      });
    }
  });
  var tgs = document.querySelectorAll(".toggle-ex");
  tgs.forEach(function(t){ t.textContent = "收合詳解 ▴"; });
}

function resetAll(){
  score = 0; results = {};
  document.querySelectorAll("#app .q").forEach(function(box){
    box.dataset.graded = "";
    box.querySelectorAll("input[type=text],textarea").forEach(function(i){ i.value=""; i.style.borderColor=""; });
    box.querySelectorAll(".opt").forEach(function(o){ o.className="opt"; });
    var r = box.querySelector(".qresult");
    if(r){ r.className="qresult"; r.innerHTML=""; }
    var ex = box.querySelector(".ex");
    if(ex) ex.classList.remove("show");
  });
  document.querySelectorAll(".toggle-ex").forEach(function(t){ t.textContent = "查看詳解 ▾"; });
  updateScore();
  buildChips();
}

document.getElementById("reset").onclick = resetAll;
document.getElementById("revealAll").onclick = revealAll;
renderApp();
updateScore();
</script>
