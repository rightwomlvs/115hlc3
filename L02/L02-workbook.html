<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colors Speak Louder than Words | 習作互動評量（115上技高英文 Choice 版三）</title>
<style>
:root{
  --ink:#1f2430; --muted:#6b7280; --line:#e5e7eb; --bg:#f4f6fb;
  --card:#ffffff; --accent:#3b5bdb; --accent2:#0ca678; --warn:#f59f00;
  --ok:#2b8a3e; --bad:#e03131; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#b45309,#f59f00);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.top .wrap{padding-top:14px;padding-bottom:14px}
.top h1{margin:0;font-size:22px;letter-spacing:.5px}
.top .zh{margin:2px 0 10px;font-size:13px;opacity:.9}
.badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:1px 12px;font-size:12px;margin-bottom:6px}
.scorebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.score{background:rgba(255,255,255,.14);border-radius:10px;padding:6px 14px;font-size:14px}
.score b{font-size:20px;color:#ffe066}
.progress{flex:1 1 120px;height:10px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
#pbar{height:100%;width:0%;background:#ffe066;border-radius:999px;transition:width .3s}
.sb-btn{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer}
.sb-btn:hover{background:rgba(255,255,255,.15)}
.secchips{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;border:none;color:#fff;cursor:pointer;font-family:inherit;transition:.15s}
.chip:hover{background:rgba(255,255,255,.26)}
.chip.on{background:rgba(255,255,255,.4);box-shadow:0 0 0 1px rgba(255,255,255,.65) inset}
.chip.ok{background:rgba(46,204,113,.35)}
main.wrap{padding-top:20px;padding-bottom:40px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px;box-shadow:0 1px 4px rgba(16,24,40,.05);overflow:hidden}
.sec-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;background:#fafbff}
.sec-head h2{margin:0;font-size:17px;color:#253073}
.sec-head .sub{margin:0;font-size:12.5px;color:var(--muted)}
.sec-head .sec-score{margin-left:auto;font-size:13px;color:#253073;font-weight:600}
.passage{margin:14px 18px 0;padding:14px 16px;background:#f8f9ff;border:1px solid #dbe1ff;border-radius:10px;font-size:15px}
.passage .ptitle{font-weight:700;color:#3b5bdb;margin-bottom:6px}
.bk{display:inline-block;background:#3b5bdb;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;margin:0 2px;vertical-align:middle}
.bk-link{cursor:pointer;transition:.15s}
.bk-link:hover{background:#0ca678;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.q.jump-hl{animation:jumpflash 1.5s ease}
@keyframes jumpflash{0%{background:#fff9db}55%{background:#fff9db}100%{background:transparent}}
.sent{transition:background .3s,box-shadow .3s}
.sent.hl{background:#fff3bf;border-radius:6px;box-shadow:0 0 0 3px #ffe066;scroll-margin-top:170px}
.q{padding:16px 18px;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:none}
.card{scroll-margin-top:170px}
.qhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.qno{font-weight:700;color:#3b5bdb}
.qpts{margin-left:auto;font-size:12px;color:var(--muted);background:#eef1ff;border-radius:6px;padding:0 8px}
.qstem{font-size:15.5px;margin:4px 0}
.qstem .hint{color:var(--warn);font-weight:600}
.qstem.refsent{background:#f8f9ff;border:1px dashed #c7cff5;border-radius:8px;padding:8px 10px;margin:4px 0 8px}
.qstem.refsent .ctx-prev{display:block;color:#64748b;font-size:13.5px;margin-bottom:2px}
.qstem.refsent .ctx-prev:before{content:"前一句：";color:#3b5bdb;font-weight:700;font-size:12.5px;margin-right:6px}
.qstem.refsent .ctx-cur{display:block}
.qstem.refsent .ctx-cur:before{content:"該格句子：";color:#3b5bdb;font-weight:700;font-size:12.5px;margin-right:6px}
.uhint,.bblank{color:#94a3b8;font-family:monospace;letter-spacing:.5px;font-weight:600}
.bblank{color:#64748b}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;font-size:14.5px;user-select:none;transition:.12s}
.opt:hover{border-color:#aab4f0;background:#f4f6ff}
.opt .ol{display:inline-block;width:22px;color:#6b7280;font-weight:700}
.opt.sel{border-color:var(--accent);background:#e9edff;box-shadow:0 0 0 1px var(--accent) inset}
.opt.correct{border-color:var(--ok);background:#e6f7ec}
.opt.wrong{border-color:var(--bad);background:#fdecec}
.fbox{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fbox .lbl{font-weight:700;color:#6b7280;font-size:13px}
input[type=text],textarea{border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14.5px;font-family:inherit;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,91,219,.12)}
textarea{width:100%;min-height:64px;resize:vertical}
.inline-in{margin:0 4px;vertical-align:middle}
.fbl{display:inline-block;background:#fff3bf;color:#9a7b00;font-weight:700;font-size:11px;border-radius:5px;padding:0 6px;margin:0 2px;vertical-align:middle}
.qctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button.btn{border:none;border-radius:8px;padding:7px 16px;font-size:13.5px;cursor:pointer;font-family:inherit}
.btn-check{background:var(--accent);color:#fff}
.btn-check:hover{background:#2f4bc0}
.btn-ghost{background:#eef1f6;color:#374151}
.btn-ghost:hover{background:#e2e7f0}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:var(--bad);color:#fff}
.qresult{display:none;margin-top:10px;padding:10px 14px;border-radius:9px;font-size:14px}
.qresult.show{display:block}
.qresult.good{background:#e9f9f0;border:1px solid #b7e6c8;color:#1c6b32}
.qresult.bad{background:#fdeeee;border:1px solid #f3c1c1;color:#9c2222}
.qresult.info{background:#eef4ff;border:1px solid #c6d8ff;color:#2f4bc0}
.toggle-ex{margin-top:10px;border:1px solid #aab4f0;background:#eef1ff;color:#3b5bdb;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;padding:5px 14px;transition:.12s}
.toggle-ex:hover{background:#e2e8ff;border-color:#8f9cf0}
.ex{display:none;margin-top:10px}
.ex.show{display:block}
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex-block{border-radius:9px;padding:10px 12px;font-size:13.5px;border:1px solid var(--line)}
.ex-block h4{margin:0 0 4px;font-size:13px;color:#253073}
.ex-block p{margin:0}
.ex-block.ans{grid-column:1/-1;border-left:4px solid #2b8a3e;background:#f0fbf3}
.ex-block.clue{border-left:4px solid var(--warn);background:#fffbf0}
.ex-block.opts{border-left:4px solid #0ca678;background:#f3fbf7}
.ex-block.why{border-left:4px solid #e8590c;background:#fff7f0}
.ex-block.words{border-left:4px solid var(--accent);background:#f4f6ff}
.ex-block.grammar{border-left:4px solid var(--accent2);background:#f0fbf6}
.ex-block.trans{border-left:4px solid #be4bdb;background:#fcf5ff}
@media (max-width:600px){.ex-grid{grid-template-columns:1fr}}
footer.wrap{padding-bottom:30px;color:var(--muted);font-size:12px}
.speech-note{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;max-width:88vw;background:#1f2430;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.35);text-align:center;line-height:1.5}
.dblank{display:inline-block;min-width:7.5em;height:1.15em;border-bottom:2px solid #b45309;vertical-align:middle;background:rgba(245,159,0,.08)}
.myth-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.myth-cell{border:1px solid #d6c9a8;border-radius:6px;padding:8px 10px;background:#fdf8ee}
.myth-cell .mx{color:#e03131;font-weight:600}
.myth-cell .ck{color:#2b8a3e;font-weight:600}
.myth-cell .mtxt{margin:2px 0}
.pbody{line-height:1.7}
</style>
</head>

var DATA = {"num": 2, "en": "Colors Speak Louder than Words", "zh": "習作｜第 2 課（商業行銷）", "sections": [{"id": "s1", "type": "word", "title": "一、文意字彙", "subtitle": "1～4 題請依文意與提示填入最適當的字。5～8 題請在四個選項中，選出最適當的答案。9～10 題請在四個選項中，選出與畫底線的字詞意思最接近的答案。（每題 3 分，共 30 分）", "points": 30, "questions": [{"no": 1, "pts": 3, "type": "word", "sent": "I <span class='hint'>p r</span> home-cooked meals to expensive restaurant food.", "answer": "prefer", "accept": ["prefer"], "ex": {"clue": "p…r（偏愛）", "words": "prefer v. 偏愛；較喜歡", "grammar": "prefer A to B＝比起 B 更喜歡 A；home-cooked meals 家常菜。", "trans": "比起昂貴的餐廳食物，我更喜歡家常菜。"}, "id": "s1q1"}, {"no": 2, "pts": 3, "type": "word", "sent": "Nina moved across the stage with <span class='hint'>e e</span> and beauty.", "answer": "elegance", "accept": ["elegance"], "ex": {"clue": "e…e（優雅）", "words": "elegance n. 優雅；elegant adj. 優雅的", "grammar": "with elegance＝elegantly（優雅地）；with + 抽象名詞＝副詞。", "trans": "Nina 優雅且美麗地走過舞台。"}, "id": "s1q2"}, {"no": 3, "pts": 3, "type": "word", "sent": "To solve the problem, the students <span class='hint'>d d</span>ed their ideas in groups.", "answer": "discussed", "accept": ["discussed", "discuss"], "ex": {"clue": "d…ed（討論）", "words": "discuss v. 討論", "grammar": "discuss sth. in groups 分組討論某事；discuss 為及物動詞，直接接受詞。", "trans": "為了解決問題，學生們分組討論他們的想法。"}, "id": "s1q3"}, {"no": 4, "pts": 3, "type": "word", "sent": "Ronnie did careful <span class='hint'>r h</span> before he bought a new car for his family.", "answer": "research", "accept": ["research"], "ex": {"clue": "r…h（研究）", "words": "research n. 研究；調查", "grammar": "do research＝做研究，research 在此為不可數名詞；before 引導時間副詞子句。", "trans": "Ronnie 在為家人買新車之前做了仔細的研究調查。"}, "id": "s1q4"}, {"no": 5, "pts": 3, "type": "choice", "stem": "Jason's strong _______ for cooking led him to open his own restaurant.", "options": ["passion", "combination", "document", "warning"], "ans": 0, "ex": {"clue": "對烹飪強烈的「熱情」使他開餐廳", "words": "passion n. 熱情；熱愛", "grammar": "have a passion for＋名詞＝對……有熱情；lead sb. to＋原形動詞＝使某人去做……。", "trans": "Jason 對烹飪強烈的熱情使他開了 自己的餐廳。", "opts_trans": ["熱情；熱愛", "組合，結合", "文件", "警告"], "why": "「強烈到讓他開餐廳」的情緒是對烹飪的「熱情」；(B) 組合、(C) 文件、(D) 警告皆與開餐廳的原因不符。"}, "id": "s1q5"}, {"no": 6, "pts": 3, "type": "choice", "stem": "Some people _______ sadness by staying quiet instead of crying tears.", "options": ["doubt", "express", "persuade", "interact"], "ans": 1, "ex": {"clue": "以沉默來「表達」悲傷", "words": "express v. 表達；表現", "grammar": "express＋名詞＝表達……；instead of＋V-ing＝而不是……。", "trans": "有些人透過保持沉默而非流淚來表達悲傷。", "opts_trans": ["懷疑", "表達", "說服", "互動"], "why": "「用沉默的方式」來表現悲傷是「表達」；(A) 懷疑、(C) 說服、(D) 互動皆無法與 sadness 搭配。"}, "id": "s1q6"}, {"no": 7, "pts": 3, "type": "choice", "stem": "Climate change is a(n) _______ problem which affects everyone in the world.", "options": ["private", "elegant", "successful", "major"], "ans": 3, "ex": {"clue": "影響全世界的是「重大的」問題", "words": "major adj. 重大的；主要的", "grammar": "a major problem 重大的問題；which 子句修飾 problem。", "trans": "氣候變遷是一個影響全世界每個人的重大問題。", "opts_trans": ["私人的", "高雅的", "成功的", "重大的"], "why": "影響全世界的問題必然是「重大」問題；(A) 私人的、(B) 高雅的、(C) 成功的皆與語意不符。"}, "id": "s1q7"}, {"no": 8, "pts": 3, "type": "choice", "stem": "Edison checked the flight's online _______ to see if it was delayed.", "options": ["status", "logo", "trend", "spotlight"], "ans": 0, "ex": {"clue": "查航班是否延誤看的是「狀態」", "words": "status n. 狀態；情形", "grammar": "the flight's online status 航班的線上狀態；delay v. 延誤。", "trans": "Edison 在網路上查看了航班狀態，看它是否延誤。", "opts_trans": ["狀態；情形", "標誌，商標", "潮流", "關注的焦點；聚光燈"], "why": "查詢「是否延誤」要看的是航班的「狀態」；(B) 標誌、(C) 潮流、(D) 焦點皆不符。"}, "id": "s1q8"}, {"no": 9, "pts": 3, "type": "choice", "stem": "Mom's discovery of some old family photos brought back happy memories to everyone.", "options": ["reaction", "account", "contest", "finding"], "ans": 3, "ex": {"clue": "discovery＝finding（發現）", "words": "discovery n. 發現＝finding；bring back 勾起；喚起", "grammar": "discovery「發現」最接近 finding「發現、找到的東西」；bring back＋名詞＝喚起（回憶）。", "trans": "媽媽發現的一些舊家庭照片勾起了大家快樂的回憶。", "opts_trans": ["反應", "帳戶", "比賽", "發現"], "why": "discovery「發現」與 finding「發現、找到的事物」意思最接近；(A) 反應、(B) 帳戶、(C) 比賽皆不正確。"}, "id": "s1q9"}, {"no": 10, "pts": 3, "type": "choice", "stem": "I can't remember the specific amount of money I spent on groceries yesterday.", "options": ["similar", "exact", "doubtful", "optional"], "ans": 1, "ex": {"clue": "specific＝exact（確切的）", "words": "specific adj. 特定的；確切的＝exact", "grammar": "specific「確切的」最接近 exact「精確的」；the amount of money 金額。", "trans": "我不記得昨天買菜用掉的確切金額。", "opts_trans": ["相似的", "確切的；精確的", "懷疑的；可疑的", "可選擇的，非必要的"], "why": "specific「確切的」與 exact「精確的」意思最接近；(A) 相似的、(C) 可疑的、(D) 可選擇的皆不符。"}, "id": "s1q10"}]}, {"id": "s2", "type": "choice", "title": "二、語法測驗", "subtitle": "選出一個最適當的答案。（每題 2 分，共 10 分）", "points": 10, "questions": [{"no": 1, "pts": 2, "stem": "Joy entered the room, _______ by the birthday decorations inside.", "options": ["is surprising", "surprised", "was surprised", "surprising"], "ans": 1, "ex": {"clue": "Joy「被」驚喜到＝過去分詞", "words": "surprised adj. 感到驚喜的；decorations n. 裝飾", "grammar": "Joy 是「被」室內的布置驚喜到，被動語態的過去分詞 surprised 作補語，故選 (B)。", "trans": "Joy 走進房間，被裡面的生日布置嚇了一跳。", "opts_trans": ["是令人驚喜的（主動，be＋V-ing）", "感到驚喜的（過去分詞）", "被驚喜到了（限定動詞）", "令人驚喜的（現在分詞）"], "why": "decorations 使 Joy 感到驚喜，Joy 為「被驚喜」的一方，需用過去分詞 surprised 表被動；(A)(D) 主動、(C) 為限定動詞，無法在此作補語。"}, "id": "s2q1"}, {"no": 2, "pts": 2, "stem": "It is _______ that drinking green tea can improve health.", "options": ["believed", "believing", "believe", "believes"], "ans": 0, "ex": {"clue": "大眾普遍的看法＝被相信", "words": "believe v. 相信；It is believed that… 據信……", "grammar": "It is believed that＋子句＝大家相信……，為表達大眾看法的慣用被動句型，故選 (A) believed。", "trans": "據信喝綠茶可以增進健康。", "opts_trans": ["被相信（過去分詞）", "相信（現在分詞）", "相信（原形）", "相信（第三人稱單數）"], "why": "It is believed that…「據信……」是固定的被動句型；(B)(C)(D) 均非被動語態，無法構成此句型。"}, "id": "s2q2"}, {"no": 3, "pts": 2, "stem": "The heavy rain lasted for three days, _______ serious floods in many areas.", "options": ["it caused", "caused", "causing", "and causing"], "ans": 2, "ex": {"clue": "大雨與洪水之間主動，分詞構句用 V-ing", "words": "flood n. 洪水；lasting v. 持續", "grammar": "「大雨」與「造成洪水」之間是主動關係，分詞構句主動動作改為現在分詞 causing，故選 (C)。", "trans": "大雨持續了三天，在許多地區造成嚴重的洪水。", "opts_trans": ["它造成（多主詞）", "造成（過去分詞）", "造成（現在分詞）", "而且造成（重複連接詞）"], "why": "後半句無連接詞，須用分詞構句；rain 主動 causing，(A) 多出主詞 it、(B) 被動語態不合、(D) 已有連接詞 and。"}, "id": "s2q3"}, {"no": 4, "pts": 2, "stem": "The movie was _______ funny _______ everyone couldn't stop laughing.", "options": ["too … to", "such … so", "as … that", "so … that"], "ans": 3, "ex": {"clue": "so＋形容詞＋that＋子句", "words": "so…that… 如此……以至於……", "grammar": "空格後接形容詞 funny 再接 that 子句，符合 so＋形容詞＋that＋子句「如此……以至於……」的句型，故選 (D)。", "trans": "這部電影太好笑了，以至於大家都笑個不停。", "opts_trans": ["太……而不能……", "如此……如此……", "和……一樣……＋以至於", "如此……以至於……"], "why": "so＋adj.＋that＋子句表「如此……以至於……」；(A) too…to 後接原形動詞、(B)(C) 搭配錯誤。"}, "id": "s2q4"}, {"no": 5, "pts": 2, "stem": "Lloyd usually eats fruits _______ apples and bananas for breakfast.", "options": ["like", "are like", "likes", "like to"], "ans": 0, "ex": {"clue": "舉例說明 fruits 用介系詞 like", "words": "like prep. 例如；像是（＝such as）", "grammar": "此處 like 是介系詞，意為「例如、像是」，用來舉例說明前面的 fruits，故選 (A)。", "trans": "Lloyd 早餐通常吃像蘋果和香蕉這類水果。", "opts_trans": ["例如；像是（介系詞）", "是……的樣子", "喜歡（動詞）", "喜歡去做……"], "why": "apples and bananas 是 fruits 的例子，用介系詞 like「例如」；(B) 為動詞、(C)(D) 表「喜歡」，皆不符。"}, "id": "s2q5"}]}, {"id": "s3", "type": "cloze", "ptitle": "綜合測驗", "title": "三、綜合測驗", "subtitle": "根據文意，選出一個最適當的答案。（每題 2 分，共 10 分）", "points": 10, "passages": [{"title": "短文", "text": "Colors carry different meanings in different cultures. In Taiwan, white envelopes are used at funerals※, __1__ sadness. However, in Japan, people use them at weddings or the New Year. It is said __2__ white stands for new beginnings in Japanese culture. __3__, red has different meanings. In China, red means luck and joy, but in some places, it is the color of death.\nPeople tend __4__ specific colors with certain emotions, but these meanings are not the same everywhere. __5__ avoid mistakes, we should learn about these cultural differences. It can help us show respect for other people.\n※ funeral n. 喪禮", "questions": [{"no": 1, "pts": 2, "stem": "", "options": ["symbolize", "symbolized", "they symbolize", "symbolizing"], "ans": 3, "ex": {"clue": "分詞構句：主動動作用 V-ing", "words": "symbolize v. 象徵；funeral n. 喪禮", "grammar": "分詞構句為了簡化句子，省略連接詞與主詞 they，將動詞改為現在分詞 symbolizing，故選 (D)。", "trans": "在台灣，白色信封（白包）用於喪禮，象徵著哀傷。", "opts_trans": ["象徵（限定動詞）", "象徵（過去式）", "它們象徵（多主詞）", "象徵（現在分詞）"], "why": "此處為分詞構句修飾前句，symbolize 對 white envelopes 是主動，須用現在分詞；(A)(B)(C) 皆為限定動詞形式，無法作分詞。"}, "id": "s3q1"}, {"no": 2, "pts": 2, "stem": "", "options": ["to", "that", "when", "which"], "ans": 1, "ex": {"clue": "It is said that＋子句「據說……」", "words": "It is said that… 據說……", "grammar": "虛主詞句型 It is said that＋子句，表示「據說……」，故選 (B) that。", "trans": "據說在日本文化中，白色代表新的開始。", "opts_trans": ["去（不定詞）", "（連接詞）", "當……時", "哪一個"], "why": "It is said that…「據說……」為固定句型，that 引導名詞子句；(A)(C)(D) 皆無法搭配。"}, "id": "s3q2"}, {"no": 3, "pts": 2, "stem": "", "options": ["Recently", "Essentially", "Similarly", "Hopefully"], "ans": 2, "ex": {"clue": "前後都在講顏色在不同文化有不同義＝平行", "words": "Similarly adv. 同樣地", "grammar": "前文提到白色在不同文化有不同意義，此處要帶入另一個顏色「紅色」，語境是平行的，故選 (C) Similarly。", "trans": "同樣地，紅色也有不同的意義。", "opts_trans": ["最近地", "必須地", "同樣地", "抱著希望地"], "why": "白與紅都呈現「不同文化有不同義」，語氣平行，用 Similarly「同樣地」；(A)(B)(D) 語意不合。"}, "id": "s3q3"}, {"no": 4, "pts": 2, "stem": "", "options": ["to connect", "connecting", "connect", "connected"], "ans": 0, "ex": {"clue": "慣用法 tend to＋V", "words": "tend to＋V 傾向於……；connect A with B 把 A 與 B 連結", "grammar": "慣用法 tend to＋原形動詞（傾向於……），故選 (A) to connect。", "trans": "人們傾向於將特定顏色與某些情緒連結起來。", "opts_trans": ["去連結（不定詞）", "連結（動名詞）", "連結（原形）", "連結（過去分詞）"], "why": "tend to＋原形動詞是固定用法；(B) 動名詞、(C)(D) 與 to 搭配錯誤。"}, "id": "s3q4"}, {"no": 5, "pts": 2, "stem": "", "options": ["In order to", "Because of", "As a result of", "No wonder"], "ans": 0, "ex": {"clue": "後接原形動詞 avoid＝表目的", "words": "In order to＋V 為了……；avoid v. 避免", "grammar": "In order to＋原形動詞，表示「為了……」。後方是 avoid（原形動詞），故選 (A)。", "trans": "為了避免犯錯，我們應該學習這些文化差異。", "opts_trans": ["為了（＋原形動詞）", "因為（＋名詞）", "由於（＋名詞）", "難怪（＋子句）"], "why": "句後接原形動詞 avoid，需用 In order to 表目的；(B)(C) 後接名詞、(D) 後接子句，皆不合。"}, "id": "s3q5"}]}]}, {"id": "s4", "type": "choice", "title": "四、對話", "subtitle": "根據對話內容，選出一個最適當的答案。（每題 4 分，共 12 分）", "points": 12, "questions": [{"no": 1, "pts": 4, "stem": "Clerk: Hi, may I help you?<br>Amy: Yes, I'm looking for a wedding dress.<br>Clerk: Do you have a color preference?<br>Amy: Well, white is traditional, but I want to try something different.<br>Clerk: [b1] That would look beautiful on you.<br>Amy: Sounds perfect. Can I try one on?", "speakText": "Clerk: Hi, may I help you? Amy: Yes, I'm looking for a wedding dress. Clerk: Do you have a color preference? Amy: Well, white is traditional, but I want to try something different. Clerk: How about a light pink one? That would look beautiful on you. Amy: Sounds perfect. Can I try one on?", "options": ["Do you have a dress for me?", "How about a light pink one?", "It's too late to order now.", "You can rent one online."], "ans": 1, "ex": {"clue": "空格在店員的話裡：Amy 想試不同顏色", "words": "wedding dress 婚紗；preference n. 偏好；試穿 try on", "grammar": "Amy 提到她想要不一樣的顏色，因此店員推薦淡粉紅色，故選 (B) How about a light pink one?。", "trans": "店員：淡粉紅色的如何？穿在您身上一定很漂亮。", "opts_trans": ["你有適合我的禮服嗎？", "淡粉紅色的如何？", "現在訂購太遲了。", "你可以線上租一件。"], "why": "Amy 說想要嘗試不同顏色，店員順勢推薦淡粉紅最合理；(A) 與「試穿」話題不符、(C)(D) 內容與上下文無關。"}, "id": "s4q1"}, {"no": 2, "pts": 4, "stem": "Anna: Let's go to that new spicy hot pot place!<br>Ben: It's 30℃ today. It's too hot for spicy food.<br>Anna: [b1] What do you have in mind?<br>Ben: How about sushi?<br>Anna: Great idea. Sushi it is.", "speakText": "Anna: Let's go to that new spicy hot pot place! Ben: It's 30℃ today. It's too hot for spicy food. Anna: You have a point. What do you have in mind? Ben: How about sushi? Anna: Great idea. Sushi it is.", "options": ["You have a point.", "It's too heavy to carry.", "Let's take a break.", "It is cheaper than pizza."], "ans": 0, "ex": {"clue": "空格在 Anna 的話裡：認同 Ben 的說法", "words": "spicy adj. 辣的；have a point 說得有道理", "grammar": "Ben 提到天氣太熱不適合吃火鍋，Anna 隨後詢問 Ben 的意見，代表她認同 Ben 的看法，故選 (A) You have a point.。", "trans": "Anna：你說得有道理。你有什麼想法嗎？", "opts_trans": ["你說得有道理。", "它太重搬不動。", "我們休息一下吧。", "它比披薩便宜。"], "why": "Ben 以天氣太熱為由婉拒火鍋，Anna 認同並改問他意願，用 You have a point.（有道理）最連貫；(B)(C)(D) 與對話無關。"}, "id": "s4q2"}, {"no": 3, "pts": 4, "stem": "Lisa: I got an A on the math test because I wore my lucky watch.<br>Tom: Wait. You actually think the watch helped you?<br>Lisa: Of course! I always wear it on test days. It helps me think.<br>Tom: [b1]<br>Lisa: Alright, maybe studying helped too.", "speakText": "Lisa: I got an A on the math test because I wore my lucky watch. Tom: Wait. You actually think the watch helped you? Lisa: Of course! I always wear it on test days. It helps me think. Tom: That doesn't make sense. Lisa: Alright, maybe studying helped too.", "options": ["You should wear it again.", "I wonder why it is blue.", "You have good taste.", "That doesn't make sense."], "ans": 3, "ex": {"clue": "空格在 Tom 的話：懷疑迷信說法", "words": "lucky watch 幸運手錶；make sense 有道理", "grammar": "Tom 前一句對 Lisa 迷信的說法表示懷疑，因此最可能的反應是認為這「不合理、沒道理」，故選 (D) That doesn't make sense.。", "trans": "Tom：那沒道理。", "opts_trans": ["你應該再戴一次。", "我好奇它為什麼是藍色的。", "你品味真好。", "那沒道理。"], "why": "Tom 質疑幸運手錶的功效，覺得不合邏輯，用 That doesn't make sense. 最貼切；(A)(B)(C) 都無法承接 Tom 的懷疑態度。"}, "id": "s4q3"}]}, {"id": "s5", "type": "cloze", "ptitle": "閱讀測驗", "title": "五、閱讀測驗", "subtitle": "根據文本內容，選出一個最適當的答案。（每題 3 分，共 18 分）", "points": 18, "passages": [{"title": "A", "rawHtml": true, "text": "( 一 ) 第 1-3 題<br>Different colors can either improve your appetite or make you feel less hungry. The table below shows how colors affect your desire for food.<br><table class='wbtab'><tr><th>Color</th><th>How colors affect you (1)</th></tr><tr><td><span class='ck'>red</span></td><td>makes you feel excited about food and eat more <span class='ck'>○</span></td></tr><tr><td><span class='ck'>orange</span></td><td>grabs your attention and helps you feel relaxed <span class='ck'>○</span></td></tr><tr><td><span class='ck'>yellow</span></td><td>makes you feel happy and energetic <span class='ck'>○</span></td></tr><tr><td><span class='ck'>green</span></td><td>gives you a sense of freshness and makes you feel healthy <span class='ck'>○</span></td></tr><tr><td><span class='mx'>blue</span></td><td>makes you think the food is unnatural or unsafe <span class='mx'>✗</span></td></tr><tr><td><span class='mx'>purple</span></td><td>makes you think of spoiled food <span class='mx'>✗</span></td></tr><tr><td><span class='mx'>black</span></td><td>suggests danger and makes you think the food is burnt or not fresh <span class='mx'>✗</span></td></tr><tr><td><span class='mx'>brown</span></td><td>gives food a “muddy” look and makes it look heavy or dull <span class='mx'>✗</span></td></tr></table>Source: https://www.escoffieronline.com/how-color-affects-your-appetite/<br>※ spoiled adj. （食物）腐壞的　dull adj. 單調的", "questions": [{"no": 1, "pts": 3, "stem": "Which of the following is the best fit for the blank (1) in the table?", "options": ["Warm colors.", "Cool colors.", "Reducing appetite.", "Increasing appetite."], "ans": 3, "ex": {"clue": "表格符號 ○／✗ 對應食慾增減", "words": "appetite n. 食慾；desire n. 渴望", "grammar": "表格右側的符號「○」代表該顏色對食慾有正面影響，「✗」代表負面影響。前四種顏色描述的都能激發想吃東西的慾望，因此 (1) 的欄位標題應為 (D) Increasing appetite.。", "trans": "下列何者最適合填入表中的空格？（增加食慾）", "opts_trans": ["暖色。", "冷色。", "減少食慾。", "增加食慾。"], "why": "紅橙黃綠都會令人興奮、放鬆、快樂、覺得健康，有助於激發食慾，故 (1) 應為「增加食慾」；(A)(B) 為顏色分類、(C) 與表格內容相反。"}, "id": "s5q1"}, {"no": 2, "pts": 3, "stem": "Which statement is supported by the table?", "options": ["People don't usually link blue with natural foods.", "Brown can make people hungry.", "Warm colors usually make people eat less.", "Purple is most likely to be used in food advertising."], "ans": 0, "ex": {"clue": "藍色被認為是「不自然、不安全」", "words": "support v. 支持；natural adj. 天然的", "grammar": "表格提到藍色會讓人覺得食物「不自然或不安全」，暗示藍色食物在自然界中並不普遍，故 (A) 有證據支持。", "trans": "根據表格，哪一項敘述是有證據支持的？", "opts_trans": ["人們通常不會把藍色與天然食物連結。", "棕色會讓人感到飢餓。", "暖色通常讓人吃得較少。", "紫色最有可能被用於食物廣告。"], "why": "表格說藍色讓食物看起來「不自然、不安全」，故 (A) 正確；(B) 與棕色使人食慾不振相反、(C) 暖色是增進食慾、(D) 表格未提廣告用途。"}, "id": "s5q2"}, {"no": 3, "pts": 3, "stem": "Kelly is trying to lose weight. What can she do to help reduce her appetite?", "options": ["Paint her kitchen walls yellow.", "Eat more green vegetables.", "Use blue plates and bowls.", "Avoid eating black foods."], "ans": 2, "ex": {"clue": "藍色抑制食慾＝有助減肥", "words": "lose weight 減重；reduce v. 減少", "grammar": "表格指出藍色會讓人覺得食物「不安全或不自然」，進而抑制食慾。想減肥的人用藍色餐具是常見方法，故選 (C)。", "trans": "Kelly 正試圖減肥。她可以做什麼來幫助減少食慾？（使用藍色的盤子和碗）", "opts_trans": ["把廚房牆壁漆成黃色。", "吃更多的綠色蔬菜。", "使用藍色的盤子和碗。", "避免食用黑色食物。"], "why": "藍色會讓食物看起來不自然、抑制食慾，最適合減肥者；(A) 黃色增進食慾、(B) 綠色蔬菜增進食慾、(D) 黑色食物與食慾關聯性不如藍色直接。"}, "id": "s5q3"}]}, {"title": "B", "text": "( 二 ) 第 4-6 題<br>A new study shows that men are more attracted to women who wear red. Researchers from the University of Rochester asked over 100 men to look at photos of women wearing different colors. The men rated the women on their looks and how much they wanted to date them. Even when the women were described as very smart or kind, those wearing red got higher scores and were chosen for more expensive dates.<br><br>The research was led by psychology※ professor Andrew Elliot. He explains that this discovery is intriguing because people usually don't realize how colors affect them. Red in things such as roses and lipstick is traditionally linked to love and passion. Elliot also suggests this attraction might be natural; for example, certain apes※ also show a preference for red when they are choosing partners. This study suggests that in romance, the color red has a special power to grab attention and change how we act even if we are completely unaware of its deep influence.<br>※ psychology n. 心理學　ape n. 猿猴", "questions": [{"no": 4, "pts": 3, "stem": "What is the best title for this passage?", "options": ["Why Men and Women Think Differently", "The Power of the Color Red", "What Makes People Fall in Love", "Pretty Colors and Ugly Colors"], "ans": 1, "ex": {"clue": "全文都在談紅色如何影響吸引力", "words": "title n. 標題；attract v. 吸引", "grammar": "文章核心都在討論「紅色」如何影響男性的行為與吸引力，從心理學研究到自然界的例子，因此 (B) The Power of the Color Red 最能涵蓋主旨。", "trans": "這篇文章最好的標題是什麼？（紅色的力量）", "opts_trans": ["為什麼男女想法不同", "紅色的力量", "什麼讓人墜入愛河", "漂亮的顏色與醜陋的顏色"], "why": "文章圍繞「紅色吸引男性注意力」的研究展開，(B) 最貼切；(A) 非全文重點、(C) 太廣、(D) 文章未比較顏色美醜。"}, "id": "s5q4"}, {"no": 5, "pts": 3, "stem": "Which of the following is true according to the passage?", "options": ["Only humans are affected by colors.", "Kind and smart women often choose to wear red.", "Roses and lipstick are perfect gifts for a date.", "Men found women in red more attractive."], "ans": 3, "ex": {"clue": "研究發現：穿紅色的女性獲較高分數", "words": "attractive adj. 有吸引力的；according to 根據", "grammar": "(D) 正確：這是全文第一句的主旨，也是研究的發現——男性覺得穿紅色的女性更有吸引力。", "trans": "根據本文，下列何者正確？（男性覺得穿紅色的女性更有吸引力）", "opts_trans": ["只有人類會受到顏色影響。", "善良且聰明的女性通常選擇穿紅色。", "玫瑰和口紅是約會時完美的禮物。", "男性覺得穿紅色的女性更有吸引力。"], "why": "(A) 錯誤：文章提到某些猿猴也會受紅色影響；(B) 是「被描述為」而非「選擇穿」；(C) 文章只說玫瑰口紅傳統上與愛連結。"}, "id": "s5q5"}, {"no": 6, "pts": 3, "stem": "What is “intriguing” closest in meaning to?", "options": ["difficult", "interesting", "fake", "simple"], "ans": 1, "ex": {"clue": "intriguing＝interesting（有趣的）", "words": "intriguing adj. 引人入勝的；有趣的＝interesting", "grammar": "在文章脈絡中，這種科學發現讓人感到驚訝且想進一步探索，intriguing 形容某事神秘、迷人，語意最接近 (B) interesting。", "trans": "「intriguing」的意思最接近下列哪一個單字？（有趣的）", "opts_trans": ["困難的", "有趣的", "虛假的", "簡單的"], "why": "intriguing「引人入勝的」與 interesting「有趣的」意思最接近；(A) 困難的、(C) 虛假的、(D) 簡單的皆不符。"}, "id": "s5q6"}]}]}, {"id": "s6", "type": "fill", "title": "六、填充", "subtitle": "依提示字母填入適當的字詞。（每格 2 分，共 8 分）", "points": 8, "questions": [{"no": 1, "pts": 2, "cn": "警方正在調查昨晚發生的搶劫案。", "en": "The police are ((0)) ((1)) a robbery that happened last night.", "blanks": [{"label": "(l)(g)", "ans": "looking", "accept": ["looking", "look"]}, {"label": "(i)(o) , "ex": {"clue": "主動的分詞構句用 not＋V-ing", "words": "participle construction 分詞構句；goodbye n. 再見", "grammar": "前後兩個動作的主詞都是 Christy，且動作為同時發生，可以省略連接詞 and 與重複的主詞 she。Christy「主動」沒打招呼，所以動詞改為 not saying。", "trans": "Christy 悄悄離開派對，沒有跟任何人說再見。"}, "id": "s7q3"}, {"no": 4, "pts": 3, "task": "中譯英：據說，閱讀是發展智慧最好的方式。（It is ...）", "answer": "It is said that reading is the best way to develop intelligence.", "accept": ["It is said that reading is the best way to develop intelligence"], "ex": {"clue": "It is said that… 據說……", "words": "It is said that… 據說……；develop v. 發展；intelligence n. 智慧", "grammar": "It is said that…，表示「據說」。to develop intelligence 使用不定詞來修飾 way，表示「做……的方式」。", "trans": "據說，閱讀是發展智慧最好的方式。"}, "id": "s7q4"}]}]};

var NORM_RE = /[\s\.,，。;；:：!！?？"'“”‘’（）()\[\]【】\-、_]/g;
function norm(s){return (s==null?"":String(s)).toLowerCase().replace(NORM_RE,"");}
function hasAny(user, arr){
  var u = norm(user);
  return arr.some(function(a){ return u === norm(a); });
}

var score = 0, total = 0;
var results = {};   // qid -> {ok:true/false, pts:n}   (fill -> {blanks:[bool]})

function el(tag, cls, html){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html != null) e.innerHTML = html;
  return e;
}

function exBlock(cls, title, text){
  var b = el("div", "ex-block " + cls);
  var h = el("h4", null, title);
  var p = el("p", null, text || "—");
  b.appendChild(h); b.appendChild(p);
  return b;
}

function exPanel(q, openAll){
  var ex = el("div", "ex" + (openAll ? " show" : ""));
  var grid = el("div", "ex-grid");
  var ans = "";
  if(q.type === "sentence" && q.answer){
    ans = q.answer;
  } else if(q.type === "fill" && q.en && q.blanks){
    ans = String(q.en).replace(/\(\((\d+)\)\)/g, function(m, n){ return q.blanks[+n] ? q.blanks[+n].ans : m; });
  }
  if(ans) grid.appendChild(exBlock("ans", "正確答案", ans));
  grid.appendChild(exBlock("clue", "解題線索", q.ex.clue));
  if((q.type === "choice" || q.type === "cloze") && q.ex.opts_trans && q.ex.opts_trans.length){
    var rows = q.options.map(function(o, i){
      return "<b>" + String.fromCharCode(65 + i) + ".</b> " + o + (q.ex.opts_trans[i] ? " ／ " + q.ex.opts_trans[i] : "");
    }).join("<br>");
    grid.appendChild(exBlock("opts", "選項解析", rows));
  }
  grid.appendChild(exBlock("words", "重要字詞", q.ex.words));
  grid.appendChild(exBlock("grammar", "文法句型", q.ex.grammar));
  if((q.type === "choice" || q.type === "cloze") && q.ex.why){
    grid.appendChild(exBlock("why", "為何不選其他選項", q.ex.why));
  }
  grid.appendChild(exBlock("trans", "中文翻譯", q.ex.trans));
  ex.appendChild(grid);
  var tg = el("button", "toggle-ex", "查看詳解 ▾");
  tg.onclick = function(){ ex.classList.toggle("show"); tg.textContent = ex.classList.contains("show") ? "收合詳解 ▴" : "查看詳解 ▾"; };
  ex.appendChild(tg);
  return ex;
}

function speak(text){
  try{
    if(!text) return;
    if(typeof window === "undefined") return;
    if(!window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined"){
      speechUnsupported();
      return;
    }
    var s = window.speechSynthesis;
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = "en-US";
    u.rate = 0.9;
    try{
      var vs = s.getVoices ? s.getVoices() : [];
      var v = null;
      for(var i = 0; i < vs.length; i++){ if(/^en[-_]?US/i.test(vs[i].lang || "")){ v = vs[i]; break; } }
      if(!v){ for(i = 0; i < vs.length; i++){ if(/^en/i.test(vs[i].lang || "")){ v = vs[i]; break; } } }
      if(v) u.voice = v;
    }catch(e1){}
    var np = (typeof navigator !== "undefined" && navigator) ? (navigator.platform || "") : "";
    var touch = false;
    try{ touch = ("ontouchstart" in window) || ((navigator.maxTouchPoints || 0) > 0); }catch(e3){}
    var iOS = /iP(hone|ad|od)/.test(np) || (np === "MacIntel" && (navigator.maxTouchPoints || 0) > 1);
    if(iOS || touch){
      // Mobile (iOS Safari / Android Chrome & Edge): cancel() before speak() is the
      // known Android workaround for silent first utterance, but pause()/resume()
      // must NOT be used — it can leave the synthesis paused and produce no sound.
      s.cancel();
      s.speak(u);
      return;
    }
    s.cancel();
    s.speak(u);
    // Chrome/Edge desktop workaround: wake the engine with pause()/resume()
    try{
      if(!s.paused){
        s.pause();
        s.resume();
      }
    }catch(e2){}
  }catch(e){}
}

var speechToast = null;
function speechUnsupported(){
  try{
    if(speechToast) return;
    speechToast = el("div", "speech-note", "此環境無法播放語音朗讀：瀏覽器需支援 Web Speech API，並以 HTTPS（或本機）開啟頁面。");
    document.body.appendChild(speechToast);
    setTimeout(function(){ try{ if(speechToast){ speechToast.remove(); speechToast = null; } }catch(e){} }, 5200);
  }catch(e){}
}

(function(){
  if(typeof window === "undefined" || !window.speechSynthesis) return;

    if(window.speechSynthesis.getVoices) window.speechSynthesis.getVoices();

    else if(window.speechSynthesis.onvoiceschanged === null) window.speechSynthesis.onvoiceschanged = function(){ try{ if(window.speechSynthesis.getVoices) window.speechSynthesis.getVoices(); }catch(e){} };
  }catch(e){}
})();

function fullSentence(q){
  if(q.speakText) return q.speakText;
  if(q.en){
    return q.en.replace(/\(\((\d+)\)\)/g, function(m, n){ return (q.blanks[+n] || {}).ans || ""; });
  }
  if(q.sent){
    var s = String(q.sent).replace(/<span class='hint'>[^<]*<\/span>/g, q.answer || "");
    return s.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  }
  return String(q.stem || "").replace(/_{3,}/g, q.answer || (q.options ? q.options[q.ans] : "") || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
}

function sentChunk(text, no){
  var chs = splitSents(text);
  for(var i = 0; i < chs.length; i++){
    if(chs[i].indexOf("__" + no + "__") >= 0) return chs[i];
  }
  return "";
}

function sentenceWithBlank(text, no, ans){
  var ch = sentChunk(text, no);
  if(!ch) return "";
  ch = String(ch).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  // drop the OCR artifact period right after the blank when the sentence continues
  ch = ch.replace(new RegExp("__" + no + "__\\.(?=\\s*[a-z,])"), "__" + no + "__");
  var parts = String(ans || "").split("\u2026");
  var i = 0;
  var out = ch.replace(new RegExp("__" + no + "__", "g"), function(){
    var v = parts.length > 1 ? (parts[i] || "") : (ans || "");
    i++;
    return v.trim();
  });
  return out.replace(/\s+/g, " ").replace(/^[\s.,;:!?]+/, "").trim();
}

function badgeClean(s){
  return String(s).replace(/<span class='bk'>（\d+）<\/span>\.(?=\s*[a-z,])/g, function(m){ return m.slice(0, -1); });
}

function refSentHTML(text, no){
  var chs = splitSents(text);
  var idx = -1;
  for(var i = 0; i < chs.length; i++){
    if(chs[i].indexOf("__" + no + "__") >= 0){ idx = i; break; }
  }
  if(idx < 0) return "";
  var cur = chs[idx].replace(/__(\d+)__/g, function(m, n){ return "<span class='bk'>（" + n + "）</span>"; });
  var out = "";
  if(idx > 0 && /^\s*__\d+__/.test(chs[idx])){
    var prev = chs[idx - 1].replace(/__(\d+)__/g, function(m, n){ return "<span class='bk'>（" + n + "）</span>"; });
    out += "<span class='ctx-prev'>" + badgeClean(prev) + "</span>";
  }
  out += "<span class='ctx-cur'>" + badgeClean(cur) + "</span>";
  return out;
}

function splitSents(text){
  var t = String(text || "");
  var chunks = [];
  var start = 0;
  for(var i = 0; i < t.length; i++){
    var c = t.charAt(i);
    if(c === "." || c === "!" || c === "?"){
      var prev = t.slice(Math.max(0, i - 12), i);
      if(/[0-9]+__$/.test(prev)){
        var nx = t.slice(i + 1).replace(/^\s+/, "");
        if(nx && /^[a-z,]/.test(nx)) continue;
      }
      i++;
      while(i < t.length && /[.!?]/.test(t.charAt(i))) i++;
      var ch = t.slice(start, i).trim().replace(/\s+/g, " ");
      if(ch) chunks.push(ch);
      start = i;
      i--;
    }
  }
  var tail = t.slice(start).trim().replace(/\s+/g, " ");
  if(tail) chunks.push(tail);
  return chunks;
}

function goToQuestion(card, no){
  try{
    var box = null;
    [].forEach.call(card.querySelectorAll(".q"), function(b){
      var qno = b.querySelector(".qno");
      if(!qno) return;
      var t = String(qno.textContent || qno._innerSet || "").replace(/\s+/g, "");
      if(t === no + ".") box = b;
    });
    if(!box) return;
    if(typeof box.scrollIntoView === "function") box.scrollIntoView({behavior:"smooth", block:"start"});
    var ex = box.querySelector(".ex");
    if(ex){
      ex.classList.add("show");
      var tg = box.querySelector(".toggle-ex");
      if(tg) tg.textContent = "收合詳解 ▴";
    }
    box.classList.add("jump-hl");
    if(typeof setTimeout !== "undefined") setTimeout(function(){ try{ box.classList.remove("jump-hl"); }catch(e){} }, 1600);
  }catch(e){}
}

function highlightSentence(box, no){
  try{
    var card = box.parentElement || box.parent;
    if(!card) return;
    var target = null;
    [].forEach.call(card.querySelectorAll(".passage"), function(pa){
      if(!target) target = pa.querySelector("span[data-no=" + no + "]");
    });
    if(!target) return;
    [].forEach.call(card.querySelectorAll(".passage .sent"), function(s){ if(s.classList) s.classList.remove("hl"); });
    target.classList.add("hl");
    if(typeof target.scrollIntoView === "function") target.scrollIntoView({behavior:"smooth", block:"center"});
    if(typeof requestAnimationFrame === "function"){
      clearTimeout(target._hlTimer);
      target._hlTimer = setTimeout(function(){ target.classList.remove("hl"); }, 3600);
    }
  }catch(e){}
}

/* ---------- rendering ---------- */
function renderApp(){
  var app = document.getElementById("app");
  DATA.sections.forEach(function(sec){
    var card = el("section", "card");
    card.id = sec.id;
    var head = el("div", "sec-head");
    head.appendChild(el("h2", null, sec.title));
    head.appendChild(el("p", "sub", sec.subtitle));
    var ssc = el("span", "sec-score", "本節得分 <b id='ss-"+sec.id+"'>0</b> / <span>"+sec.points+"</span>");
    head.appendChild(ssc);
    card.appendChild(head);

    if(sec.type === "cloze"){
      sec.passages.forEach(function(pg){
        var pass = el("div", "passage");
        var pt = el("div", "ptitle", (sec.ptitle || "閱讀測驗 ") + pg.title);
        pass.appendChild(pt);
        if(pg.rawHtml){
          pass.appendChild(el("div", "pbody", pg.text));
          card.appendChild(pass);
          pg.questions.forEach(function(q){
            q.speakText = "";
            q.refSent = "";
            card.appendChild(renderQ(sec, q));
          });
          return;
        }
        var text = splitSents(pg.text).map(function(ch){
          var no = (ch.match(/__(\d+)__/) || [])[1];
          var html = ch.replace(/__(\d+)__/g, function(m, n){ return "<span class='bk'>（" + n + "）</span>"; });
          return "<span class='sent'" + (no ? " data-no='" + no + "'" : "") + ">" + badgeClean(html) + "</span>";
        }).join(" ");
        var pEl = el("p", null, text);
        pass.appendChild(pEl);
        card.appendChild(pass);
        [].forEach.call(pEl.querySelectorAll(".bk"), function(bk){
          var n = parseInt(String(bk.textContent || bk._innerSet || "").replace(/[^0-9]+/g, ""), 10);
          if(!n) return;
          bk.classList.add("bk-link");
          bk.title = "跳到第 " + n + " 題解析";
          bk.onclick = function(){ goToQuestion(card, n); };
        });
        pg.questions.forEach(function(q){
          q.speakText = sentenceWithBlank(pg.text, q.no, q.options[q.ans]);
          q.refSent = refSentHTML(pg.text, q.no);
          card.appendChild(renderQ(sec, q));
        });
      });
    } else {
      sec.questions.forEach(function(q){ card.appendChild(renderQ(sec, q)); });
    }
    app.appendChild(card);
  });
  total = 0;
  DATA.sections.forEach(function(sec){
    total += sec.points;
  });
  document.getElementById("total").textContent = total;
  buildChips();
}

function renderQ(sec, q){
  q.type = q.type || sec.type; q.sec = sec.id; q.secTitle = sec.title;
  var box = el("div", "q");
  box.setAttribute("data-qid", q.id);
  var head = el("div", "qhead");
  head.appendChild(el("span", "qno", q.no + "."));
  var dispPts = q.pts * (q.blanks ? q.blanks.length : 1);
  head.appendChild(el("span", "qpts", dispPts + " 分"));
  box.appendChild(head);

  var body = el("div", "qbody");
  var ctrl = el("div", "qctrl");
  var rbox = resultBox();

  if(q.type === "choice" || q.type === "cloze"){
    var stemText = String(q.stem || (q.type === "cloze" ? q.refSent : "")).replace(/\[b(\d+)\]/g, "<span class='dblank'></span>");
    if(stemText) body.appendChild(el("p", "qstem" + (q.type === "cloze" && !q.stem ? " refsent" : ""), stemText));
    var opts = el("div", "opts");
    var selected = -1;
    q.options.forEach(function(opt, i){
      var o = el("div", "opt");
      o.innerHTML = "<span class='ol'>" + String.fromCharCode(65+i) + ".</span>" + opt;
      o.onclick = function(){
        if(box.dataset.graded === "1") return;
        Array.prototype.forEach.call(opts.children, function(c){ c.classList.remove("sel"); });
        o.classList.add("sel");
        selected = i;
      };
      opts.appendChild(o);
    });
    body.appendChild(opts);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      if(q.type === "cloze") highlightSentence(box, q.no);
      if(selected < 0){
        showInfo(rbox, "尚未選擇答案。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var ok = (selected === q.ans);
      markResult(box, rbox, q, ok);
      Array.prototype.forEach.call(opts.children, function(c, i){
        c.classList.remove("sel");
        if(i === q.ans) c.classList.add("correct");
        else if(i === selected && !ok) c.classList.add("wrong");
      });
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "vocab"){
    body.appendChild(el("p", "qstem", "請寫出「<b>" + q.answer + "</b>」的英文。"));
    var inp = el("input", "");
    inp.type = "text"; inp.placeholder = "輸入英文單字";
    body.appendChild(inp);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(q.word);
      var v = inp.value.trim();
      if(!v){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，作答後即可計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, [q.word].concat(q.accept_en || []));
      markResult(box, rbox, q, ok, q.word + "（" + q.answer + "）");
      if(ok){ inp.style.borderColor = "#2b8a3e"; } else { inp.style.borderColor = "#e03131"; }
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "word"){
    var sent = String(q.sent).replace(/<span class='hint'>([a-zA-Z]+)\s+([a-zA-Z]+)<\/span>/g, function(m, a, b){
      var missing = Math.max(1, (q.answer || "").length - a.length - b.length);
      return "<span class='hint'>" + a + "</span><span class='uhint'>" + new Array(missing + 1).join("_") + "</span><span class='hint'>" + b + "</span>";
    });
    body.appendChild(el("p", "qstem", sent));
    var inp = el("input", "");
    inp.type = "text"; inp.placeholder = "依提示字母填入單字";
    body.appendChild(inp);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      var v = inp.value.trim();
      if(!v){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，作答後即可計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, q.accept);
      markResult(box, rbox, q, ok);
      if(ok){ inp.style.borderColor = "#2b8a3e"; } else { inp.style.borderColor = "#e03131"; }
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "fill"){
    body.appendChild(el("p", "qstem", "【中文】" + q.cn));
    var sen = el("p", "qstem");
    var html = q.en.replace(/\(\((\d+)\)\)/g, function(m, n){
      var b = q.blanks[+n];
      var letters = [];
      var lm, lre = /\(([^)]+)\)/g;
      while((lm = lre.exec(b.label || ""))) letters.push(lm[1]);
      var fragA = letters[0] || "";
      var fragB = letters.length > 1 ? letters.slice(1).join("") : "";
      var missing = Math.max(1, (b.ans || "").length - fragA.length - fragB.length);
      var shown = fragA + new Array(missing + 1).join("_") + fragB;
      return ' <span class="bblank">' + shown + '</span> ';
    });
    sen.innerHTML = html;
    body.appendChild(sen);
    var abox = el("div", "fbox");
    q.blanks.forEach(function(b, n){
      var span = el("span", "lbl", "(" + (n + 1) + ")");
      var inp = el("input", "inline-in");
      inp.type = "text";
      inp.style.width = Math.min(220, Math.max(90, (b.ans || "").length * 12)) + "px";
      inp.setAttribute("data-blank", n);
      abox.appendChild(span); abox.appendChild(inp);
    });
    body.appendChild(abox);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(fullSentence(q));
      var ins = abox.querySelectorAll("input[data-blank]");
      var emptyAll = true;
      ins.forEach(function(ip){ if(String(ip.value || "").trim()) emptyAll = false; });
      if(emptyAll){
        showInfo(rbox, "尚未輸入答案。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var oks = [];
      var all = true, any = false;
      ins.forEach(function(ip){
        var b = q.blanks[+ip.dataset.blank];
        var ok = hasAny(ip.value, b.accept);
        oks.push(ok); any = any || ok; if(!ok) all = false;
        ip.style.borderColor = ok ? "#2b8a3e" : "#e03131";
      });
      var nOk = oks.filter(Boolean).length;
      box.dataset.graded = "1";
      var pts = nOk * q.pts;
      var prev = results[q.id];
      if(prev){ score -= prev.pts; }
      results[q.id] = {ok: nOk === q.blanks.length, pts: pts};
      score += pts;
      updateScore();
      var msg = "答對 " + nOk + " / " + q.blanks.length + " 格，得 " + pts + " 分。";
      showResult(box, rbox, all, msg);
      expandEx(box);
    };
    ctrl.appendChild(chk);
  }
  else if(q.type === "sentence"){
    body.appendChild(el("p", "qstem", q.task));
    var ta = el("textarea", "");
    ta.placeholder = "請寫下你的句子";
    body.appendChild(ta);
    var chk = el("button", "btn btn-check", "檢查答案");
    chk.onclick = function(){
      speak(q.answer);
      var v = ta.value.trim();
      if(!v){
        showInfo(rbox, "尚未寫下句子。可先參考下方解析，再作答計分。");
        expandEx(box);
        return;
      }
      var ok = hasAny(v, q.accept);
      markResult(box, rbox, q, ok);
      if(!ok){
        rbox.innerHTML = "尚未完全符合參考答案。請先參考下方「解題線索／文法句型」，再自行判斷是否答對。";
        var self = el("div", "qctrl");
        var y = el("button", "btn btn-ok", "我寫對了");
        var n = el("button", "btn btn-bad", "我寫錯了");
        y.onclick = function(){ markResult(box, rbox, q, true); self.remove(); };
        n.onclick = function(){ markResult(box, rbox, q, false); self.remove(); };
        self.appendChild(y); self.appendChild(n);
        rbox.appendChild(self);
      }
    };
    ctrl.appendChild(chk);
  }

  box.appendChild(body);
  box.appendChild(ctrl);
  box.appendChild(rbox);
  var ex = exPanel(q, false);
  box.appendChild(ex);
  return box;
}

function markResult(box, rbox, q, ok, ansText){
  box.dataset.graded = "1";
  var prev = results[q.id];
  if(prev){ score -= prev.pts; }
  results[q.id] = {ok: ok, pts: ok ? q.pts : 0};
  score += ok ? q.pts : 0;
  updateScore();
  if(ok){
    showResult(box, rbox, true, "答對了！得 " + q.pts + " 分。");
  } else {
    showResult(box, rbox, false, "答錯了。正確答案：" + (ansText || q.answer));
  }
  var chip = document.getElementById("chip-" + q.sec);
  if(chip){
    chip.textContent = q.secTitle + " " + sectionScore(q.sec) + "/" + sectionPoints(q.sec);
  }
  expandEx(box);
}

function expandEx(box){
  var ex = box.querySelector(".ex");
  var tg = box.querySelector(".toggle-ex");
  if(ex && !ex.classList.contains("show")){ ex.classList.add("show"); }
  if(tg){ tg.textContent = "收合詳解 ▴"; }
}

function sectionPoints(secId){
  var s = DATA.sections.filter(function(x){return x.id===secId;})[0];
  return s ? s.points : 0;
}
function sectionScore(secId){
  var tot = 0;
  Object.keys(results).forEach(function(k){
    var r = results[k];
    var q = questionById(k);
    if(q && q.sec === secId) tot += r.pts;
  });
  return tot;
}
function questionById(qid){
  var found = null;
  DATA.sections.forEach(function(sec){
    var list = [];
    if(sec.type === "cloze"){ sec.passages.forEach(function(p){ list = list.concat(p.questions); }); }
    else { list = sec.questions; }
    list.forEach(function(q){ if(q.id === qid){ found = q; } });
  });
  return found;
}

function updateScore(){
  document.getElementById("score").textContent = score;
  var p = total ? Math.round(score / total * 100) : 0;
  document.getElementById("pbar").style.width = p + "%";
  DATA.sections.forEach(function(sec){
    var s = document.getElementById("ss-" + sec.id);
    if(s) s.textContent = sectionScore(sec.id);
  });
}

function buildChips(){
  var c = document.getElementById("secchips");
  c.innerHTML = "";
  DATA.sections.forEach(function(sec){
    var ch = el("button", "chip", sec.title + " 0/" + sec.points);
    ch.type = "button";
    ch.id = "chip-" + sec.id;
    ch.onclick = function(){
      var el = document.getElementById(sec.id);
      if(el) el.scrollIntoView({behavior: "smooth", block: "start"});
    };
    c.appendChild(ch);
  });
  updateChipActive();
}

function updateChipActive(){
  var mark = null;
  DATA.sections.forEach(function(sec){
    var el = document.getElementById(sec.id);
    var ch = document.getElementById("chip-" + sec.id);
    if(!el || !ch) return;
    var r = el.getBoundingClientRect();
    if(r.top <= 170) mark = ch;
  });
  document.querySelectorAll("#secchips .chip").forEach(function(ch){
    if(ch === mark) ch.classList.add("on");
    else ch.classList.remove("on");
  });
}
if(typeof window !== "undefined"){
  window.addEventListener("scroll", updateChipActive, {passive: true});
}

function revealAll(){
  document.querySelectorAll("#app .q").forEach(function(box){
    var q = questionById(box.dataset.qid);
    if(!q) return;
    var ex = box.querySelector(".ex");
    if(ex) ex.classList.add("show");
    var ins = box.querySelectorAll("input[type=text],textarea");
    if(q.type === "vocab"){
      if(ins[0]) ins[0].value = q.word;
    } else if(q.type === "word"){
      if(ins[0]) ins[0].value = q.answer;
    } else if(q.type === "fill"){
      box.querySelectorAll("input[data-blank]").forEach(function(ip){
        ip.value = q.blanks[+ip.dataset.blank].ans;
      });
    } else if(q.type === "sentence"){
      if(ins[0]) ins[0].value = q.answer;
    } else if(q.type === "choice" || q.type === "cloze"){
      box.querySelectorAll(".opt").forEach(function(o, i){
        if(i === q.ans) o.classList.add("correct");
      });
    }
  });
  var tgs = document.querySelectorAll(".toggle-ex");
  tgs.forEach(function(t){ t.textContent = "收合詳解 ▴"; });
}

function resetAll(){
  score = 0; results = {};
  document.querySelectorAll("#app .q").forEach(function(box){
    box.dataset.graded = "";
    box.querySelectorAll("input[type=text],textarea").forEach(function(i){ i.value=""; i.style.borderColor=""; });
    box.querySelectorAll(".opt").forEach(function(o){ o.className="opt"; });
    var r = box.querySelector(".qresult");
    if(r){ r.className="qresult"; r.innerHTML=""; }
    var ex = box.querySelector(".ex");
    if(ex) ex.classList.remove("show");
  });
  document.querySelectorAll(".toggle-ex").forEach(function(t){ t.textContent = "查看詳解 ▾"; });
  updateScore();
  buildChips();
}

document.getElementById("reset").onclick = resetAll;
document.getElementById("revealAll").onclick = revealAll;
renderApp();
updateScore();
</script>
