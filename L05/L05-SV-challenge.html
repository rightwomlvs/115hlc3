let currentTab = 'all';
let filtered = [];
let currentIdx = 0;
let pairIdx = 0;
let subDone = false;
let hintShown = false;

function getPairs(sentence) {
    if (sentence.pairs) return sentence.pairs;
    return [{ subject: sentence.subject, verb: sentence.verb, skip: !!sentence.skipSubject }];
}

function getFilteredSentences() {
    if (currentTab === 'all') return allSentences;
    return allSentences.filter(s => String(s.section) === currentTab);
}

function navigate(delta) {
    const next = currentIdx + delta;
    if (next < 0 || next >= filtered.length) return;
    currentIdx = next;
    hintShown = false;
    renderSentence();
}

function renderSentence() {
    speechSynthesis.cancel();
    const sentence = filtered[currentIdx];
    const pairs = getPairs(sentence);
    pairIdx = 0;
    subDone = (pairs[0] && !pairs[0].subject) ? true : false;
    document.getElementById('counter').textContent = (currentIdx + 1) + ' / ' + filtered.length + (pairs.length > 1 ? (' · 組 ' + (pairIdx + 1) + '/' + pairs.length) : '');
    document.getElementById('prevBtn').disabled = currentIdx === 0;
    document.getElementById('nextBtn').disabled = currentIdx === filtered.length - 1;

    renderPairReminder();

    const area = document.getElementById('sentenceArea');
    area.innerHTML = '';
    if (hintShown) {
        sentence.words.forEach((word, index) => {
            const btn = document.createElement('button');
            btn.className = 'chunk ' + CANDY_CLASSES[index % CANDY_CLASSES.length];
            btn.textContent = word;
            btn.dataset.word = word;
            btn.onclick = () => handleChunkClick(btn);
            area.appendChild(btn);
        });
    } else {
        const full = document.createElement('div');
        full.className = 'sentence-full';
        full.textContent = sentence.words.join(' ');
        area.appendChild(full);
        const prompt = document.createElement('div');
        prompt.className = 'hint-prompt';
        prompt.textContent = '👀 先讀完整句子，按「💡 Show Hint」切換為語意斷句。';
        area.appendChild(prompt);
    }

    document.getElementById('translationArea').innerHTML = '';
    renderTranslation(true);

    setTimeout(speakCurrentSentence, 500);
}

const PAIR_S_COLORS = ['#2563eb', '#9333ea', '#16a34a', '#ea580c', '#db2777', '#0891b2', '#475569'];
const PAIR_V_COLORS = ['#dbeafe', '#e9d5ff', '#dcfce7', '#ffedd5', '#fce7f3', '#cffafe', '#e2e8f0'];

function renderPairReminder() {
    const el = document.getElementById('pairReminder');
    if (!el) return;
    const n = getPairs(filtered[currentIdx]).length;
    if (n > 1) {
        el.classList.remove('hidden');
        let legend = '';
        for (let i = 0; i < n; i++) {
            legend += '<span style="display:inline-flex;align-items:center;gap:4px;margin:0 6px;font-size:12px;font-weight:700;">組' + (i + 1) +
                '<span style="background:' + PAIR_S_COLORS[i] + ';color:#fff;padding:1px 8px;border-radius:6px;">S</span>' +
                '<span style="background:' + PAIR_V_COLORS[i] + ';color:#334155;padding:1px 8px;border-radius:6px;">V</span></span>';
        }
        el.innerHTML = '🔎 本句有 ' + n + ' 組 S+V，每組用同一顏色標示（深色=主詞 S、淺色=動詞 V）。請依序找出全部：' + legend;
    } else {
        el.classList.add('hidden');
    }
}

function showHint() {
    if (hintShown) return;
    hintShown = true;
    renderSentence();
}

function handleChunkClick(el) {
    const sentence = filtered[currentIdx];
    const pairs = getPairs(sentence);
    if (pairIdx >= pairs.length) return;
    const word = el.dataset.word;
    const found = el.classList.contains('subject-found') || el.classList.contains('verb-found') ||
        Array.from(el.classList).some(c => c.startsWith('pair-s-') || c.startsWith('pair-v-'));
    if (found) return;
    const multi = pairs.length > 1;

    const cur = pairs[pairIdx];
    const needSubject = !cur.skip && !subDone && !!cur.subject;

    if (needSubject) {
        if (word === cur.subject) {
            subDone = true;
            el.classList.add(multi ? 'pair-s-' + pairIdx : 'subject-found', 'pop');
            setTimeout(() => el.classList.remove('pop'), 350);
        } else {
            shakeElement(el);
        }
        return;
    }

    if (word === cur.verb) {
        el.classList.add(multi ? 'pair-v-' + pairIdx : 'verb-found', 'pop');
        setTimeout(() => el.classList.remove('pop'), 350);
        pairIdx++;
        if (pairIdx >= pairs.length) {
            renderTranslation(false);
        } else {
            subDone = !pairs[pairIdx].subject;
            document.getElementById('counter').textContent = (currentIdx + 1) + ' / ' + filtered.length + ' · 組 ' + (pairIdx + 1) + '/' + pairs.length;
        }
    } else {
        shakeElement(el);
    }
}

function shakeElement(el) {
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
    setTimeout(() => el.classList.remove('shake'), 400);
}

function renderTranslation(hidden) {
    const sentence = filtered[currentIdx];
    const pairs = getPairs(sentence);
    const area = document.getElementById('translationArea');
    area.innerHTML = '';
    const done = pairIdx >= pairs.length;
    if (hidden || !done) {
        area.innerHTML = '<span class="text-slate-400 text-sm">完成全部 S 與 V 之後，這裡會顯示中譯。</span>';
        return;
    }
    sentence.translation.parts.forEach(part => {
        const span = document.createElement('span');
        span.className = 'trans-part';
        if (part.type === 's') span.classList.add('trans-s');
        else if (part.type === 'v') span.classList.add('trans-v');
        if (part.implicit) span.classList.add('trans-implicit');
        span.textContent = part.text + ' ';
        area.appendChild(span);
    });
}

function resetSentence() {
    hintShown = false;
    renderSentence();
}

function speakCurrentSentence() {
    const sentence = filtered[currentIdx];
    if (!sentence) return;
    const text = sentence.words.join(' ');
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.85;
    const voices = speechSynthesis.getVoices();
    const preferred = voices.find(v => v.name.includes('Google US English')) || voices.find(v => v.lang === 'en-US');
    if (preferred) utterance.voice = preferred;
    speechSynthesis.speak(utterance);
}

function pauseYouTube() {
    const frame = document.getElementById('youtubeFrame');
    if (frame && frame.contentWindow) {
        try { frame.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*'); } catch (e) {}
    }
}

const YOUTUBE_VIDEO_URL = 'https://www.youtube.com/embed/-Z_UcaYWiLE';

function setupVideoPane() {
    const isFile = window.location.protocol === 'file:';
    document.getElementById('videoWrap').classList.toggle('hidden', isFile);
    document.getElementById('videoFallback').classList.toggle('hidden', !isFile);
    const frame = document.getElementById('youtubeFrame');
    if (!isFile && frame && !frame.getAttribute('src')) {
        frame.setAttribute('src', YOUTUBE_VIDEO_URL);
    }
}

function switchTab(tab) {
    if (currentTab === 'youtube') pauseYouTube();
    currentTab = tab;
    document.querySelectorAll('.tabs-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    const isVideo = tab === 'youtube';
    document.getElementById('pane-youtube').classList.toggle('hidden-pane', !isVideo);
    document.getElementById('pane-all').classList.toggle('hidden-pane', isVideo);
    if (isVideo) {
        speechSynthesis.cancel();
        return;
    }
    filtered = getFilteredSentences();
    currentIdx = 0;
    hintShown = false;
    renderSentence();
}

document.querySelectorAll('.tabs-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

window.addEventListener('beforeunload', () => speechSynthesis.cancel());
speechSynthesis.onvoiceschanged = function() {};

setupVideoPane();

filtered = getFilteredSentences();
currentIdx = 0;
renderSentence();
</script>
